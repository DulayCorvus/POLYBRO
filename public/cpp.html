/* =========================================================================
   EDITOR CODE-SUGGESTION DROPDOWN
   Autocomplete for the code editor textareas: matches what's typed against
   snippet expansions (full statement/block, cursor lands at \u00a6) and plain
   word completions (keywords, std:: members), navigable with arrow keys and
   accepted with Tab or Enter.
   ========================================================================= */
const EDITOR_SNIPPETS = {
  main: 'int main() {\n  \u00a6\n  return 0;\n}',
  for: 'for (int i = 0; i < \u00a6; i++) {\n\n}',
  while: 'while (\u00a6) {\n\n}',
  if: 'if (\u00a6) {\n\n}',
  else: 'else {\n  \u00a6\n}',
  elseif: 'else if (\u00a6) {\n\n}',
  switch: 'switch (\u00a6) {\n  case 0:\n    break;\n  default:\n    break;\n}',
  class: 'class \u00a6 {\n  public:\n\n};',
  struct: 'struct \u00a6 {\n\n};',
  cout: 'cout << \u00a6 << endl;',
  cin: 'cin >> \u00a6;',
  vector: 'vector<int> \u00a6;',
  string: 'string \u00a6;',
  include: '#include <\u00a6>',
  template: 'template <typename T>\n\u00a6',
  function: 'int \u00a6() {\n\n  return 0;\n}',
  constructor: '\u00a6(int start) {\n\n}'
};
// Plain-word completions: keywords, types, and std:: members that just
// finish the identifier, without a full expansion.
const EDITOR_WORDS = [
  'int','double','float','bool','char','string','void','auto','const','static',
  'true','false','return','break','continue','using','namespace','std',
  'class','struct','public','private','protected','virtual','override',
  'template','typename','new','delete','nullptr',
  'cout','cin','endl','vector','array','map','set','pair',
  'push_back','pop_back','size','length','begin','end','insert','erase',
  'sort','max','min','swap','to_string',
  'iostream','vector','string','algorithm','cmath'
];
function buildEditorSuggestItems(){
  const items = [];
  const seen = new Set();
  Object.keys(EDITOR_SNIPPETS).forEach(k=>{
    items.push({trigger:k, kind:'snippet', detail:'expands snippet'});
    seen.add(k);
  });
  EDITOR_WORDS.forEach(w=>{
    if(!seen.has(w)){ items.push({trigger:w, kind:'word', detail:''}); seen.add(w); }
  });
  return items;
}
const EDITOR_SUGGEST_ITEMS = buildEditorSuggestItems();
let ES_STATE = { el:null, matches:[], index:0, wordStart:0 };

function ensureEditorSuggestBox(){
  let box = document.getElementById('editor-suggest');
  if(!box){
    box = document.createElement('div');
    box.id = 'editor-suggest';
    document.body.appendChild(box);
    box.addEventListener('mousedown', (e)=>{
      const item = e.target.closest('.es-item');
      if(!item) return;
      e.preventDefault(); // keep focus in the textarea, don't blur it
      const idx = Number(item.dataset.idx);
      acceptEditorSuggestion(ES_STATE.el, idx);
    });
  }
  return box;
}

function getEditorWordBeforeCaret(el){
  const before = el.value.slice(0, el.selectionStart);
  const m = before.match(/([a-zA-Z_][\w]*)$/);
  return m ? {word:m[1], start:el.selectionStart - m[1].length} : {word:'', start:el.selectionStart};
}

// Positions the dropdown just under the caret using the standard
// mirror-element technique (a hidden div replicating the textarea's font
// metrics, with a marker span dropped in at the caret position).
function positionEditorSuggestBox(el, box, caretPos){
  const mirror = document.createElement('div');
  const cs = getComputedStyle(el);
  ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','padding','border','boxSizing','whiteSpace','wordWrap'].forEach(p=>{
    mirror.style[p] = cs[p];
  });
  mirror.style.position = 'absolute';
  mirror.style.visibility = 'hidden';
  mirror.style.whiteSpace = 'pre-wrap';
  mirror.style.wordWrap = 'break-word';
  mirror.style.width = el.clientWidth + 'px';
  mirror.textContent = el.value.slice(0, caretPos);
  const marker = document.createElement('span');
  marker.textContent = '\u200b';
  mirror.appendChild(marker);
  document.body.appendChild(mirror);
  const rect = el.getBoundingClientRect();
  const markerRect = marker.getBoundingClientRect();
  const mirrorRect = mirror.getBoundingClientRect();
  const top = rect.top + (markerRect.top - mirrorRect.top) - el.scrollTop + 20;
  const left = rect.left + (markerRect.left - mirrorRect.left) - el.scrollLeft;
  document.body.removeChild(mirror);
  const maxLeft = window.innerWidth - 290;
  box.style.top = Math.min(top, window.innerHeight - 60) + 'px';
  box.style.left = Math.max(8, Math.min(left, maxLeft)) + 'px';
}

function renderEditorSuggestBox(){
  const box = ensureEditorSuggestBox();
  box.innerHTML = ES_STATE.matches.map((it,i)=>
    `<div class="es-item ${i===ES_STATE.index?'sel':''}" data-idx="${i}">
       <span class="es-trig">${it.trigger}</span>
       <span class="es-detail">${it.detail}</span>
     </div>`
  ).join('');
  const selEl = box.querySelector('.es-item.sel');
  if(selEl) selEl.scrollIntoView({block:'nearest'});
}

function showEditorSuggest(el){
  const {word, start} = getEditorWordBeforeCaret(el);
  if(word.length < 1){ hideEditorSuggest(); return; }
  const lower = word.toLowerCase();
  const matches = EDITOR_SUGGEST_ITEMS
    .filter(it=>it.trigger.toLowerCase().startsWith(lower))
    .sort((a,b)=> a.trigger.length - b.trigger.length)
    .slice(0, 8);
  if(matches.length === 0 || (matches.length===1 && matches[0].trigger.toLowerCase()===lower)){
    hideEditorSuggest();
    return;
  }
  ES_STATE = { el, matches, index:0, wordStart:start };
  const box = ensureEditorSuggestBox();
  renderEditorSuggestBox();
  positionEditorSuggestBox(el, box, el.selectionStart);
  box.classList.add('show');
}

function hideEditorSuggest(){
  const box = document.getElementById('editor-suggest');
  if(box) box.classList.remove('show');
  ES_STATE = { el:null, matches:[], index:0, wordStart:0 };
}

function acceptEditorSuggestion(el, idx){
  const item = ES_STATE.matches[idx];
  if(!el || !item) { hideEditorSuggest(); return; }
  const end = el.selectionStart;
  const wordStart = ES_STATE.wordStart;
  let insertText, cursorOffset;
  if(item.kind === 'snippet'){
    const snippet = EDITOR_SNIPPETS[item.trigger];
    cursorOffset = snippet.indexOf('\u00a6');
    insertText = snippet.replace('\u00a6', '');
  } else {
    insertText = item.trigger;
    cursorOffset = -1;
  }
  el.value = el.value.slice(0, wordStart) + insertText + el.value.slice(end);
  const newPos = wordStart + (cursorOffset === -1 ? insertText.length : cursorOffset);
  el.selectionStart = el.selectionEnd = newPos;
  hideEditorSuggest();
  el.focus();
  el.dispatchEvent(new Event('input', {bubbles:true}));
}

// Called on every keystroke in an editor textarea: refreshes the
// suggestion dropdown to match whatever's now typed before the caret.
function editorOnInput(el){
  showEditorSuggest(el);
}

// Combined keydown handler: when the suggestion dropdown is open, arrow
// keys/Tab/Enter/Escape drive it; otherwise Tab falls back to exact-match
// snippet expansion or plain indentation.
function handleEditorTab(e, el){
  const suggestOpen = ES_STATE.el === el && ES_STATE.matches.length > 0
    && document.getElementById('editor-suggest') && document.getElementById('editor-suggest').classList.contains('show');
  if(suggestOpen){
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      ES_STATE.index = (ES_STATE.index + 1) % ES_STATE.matches.length;
      renderEditorSuggestBox();
      return;
    }
    if(e.key === 'ArrowUp'){
      e.preventDefault();
      ES_STATE.index = (ES_STATE.index - 1 + ES_STATE.matches.length) % ES_STATE.matches.length;
      renderEditorSuggestBox();
      return;
    }
    if(e.key === 'Tab' || e.key === 'Enter'){
      e.preventDefault();
      acceptEditorSuggestion(el, ES_STATE.index);
      return;
    }
    if(e.key === 'Escape'){
      e.preventDefault();
      hideEditorSuggest();
      return;
    }
  }
  if(e.key !== 'Tab') return;
  e.preventDefault();
  const INDENT = '  ';
  const start = el.selectionStart, end = el.selectionEnd;
  if(!e.shiftKey && start === end){
    const before = el.value.slice(0, start);
    const wordMatch = before.match(/([a-zA-Z_][\w]*)$/);
    const snippet = wordMatch ? EDITOR_SNIPPETS[wordMatch[1]] : null;
    if(snippet){
      const wordStart = start - wordMatch[1].length;
      const cursorOffset = snippet.indexOf('\u00a6');
      const expansion = snippet.replace('\u00a6', '');
      el.value = el.value.slice(0, wordStart) + expansion + el.value.slice(end);
      const newPos = wordStart + (cursorOffset === -1 ? expansion.length : cursorOffset);
      el.selectionStart = el.selectionEnd = newPos;
      el.dispatchEvent(new Event('input', {bubbles:true}));
      return;
    }
  }
  if(e.shiftKey){
    const lineStart = el.value.lastIndexOf('\n', start-1) + 1;
    if(el.value.slice(lineStart, lineStart+INDENT.length) === INDENT){
      el.value = el.value.slice(0,lineStart) + el.value.slice(lineStart+INDENT.length);
      el.selectionStart = Math.max(lineStart, start-INDENT.length);
      el.selectionEnd = Math.max(lineStart, end-INDENT.length);
    }
  } else if(start === end){
    el.value = el.value.slice(0,start) + INDENT + el.value.slice(end);
    el.selectionStart = el.selectionEnd = start + INDENT.length;
  } else {
    el.value = el.value.slice(0,start) + INDENT + el.value.slice(start,end) + el.value.slice(end);
    el.selectionStart = start + INDENT.length;
    el.selectionEnd = end + INDENT.length;
  }
  el.dispatchEvent(new Event('input', {bubbles:true}));
}

function jumpToChapter(chId){
  const ch = CHAPTERS.find(c=>c.id===chId);
  if(!ch) return;
  const target = ch.lessons.find(l=>!STATE.completedLessons.includes(l.id)) || ch.lessons[0];

}

let dashTab = 'discover';
let dashSearch = '';
function setDashTab(t){ dashTab = t; render(); }
function setDashSearch(v){ dashSearch = v; render(); }

function buildDashCards(){
  const cards = [];
  CHAPTERS.forEach(ch=>{
    const prog = chapterProgress(ch);
    const pct = prog.total ? Math.round(prog.done/prog.total*100) : 0;
    const started = prog.done>0 || ch.lessons.some(l=>STATE.attemptedLessons.includes(l.id));
    cards.push({
      kind:'chapter', id:ch.id, title:ch.title,
      blurb: ch.lessons.map(l=>l.title).slice(0,3).join(' · '),
      badges: prog.done===prog.total ? ['done'] : (started?['started']:[]),
      meta: `${ch.lessons.length} lessons`,
      pct, started, done: prog.done===prog.total,
      recentKey: ch.lessons.map(l=>l.id)
    });
  });
  Object.keys(PROJECTS).forEach(pid=>{
    const proj = PROJECTS[pid];
    const done = STATE.completedProjects.includes(pid);
    const started = done || PROJECT_CODE_CACHE[pid] !== undefined;
    cards.push({
      kind:'project', id:pid, title:'Project: '+proj.title,
      blurb: proj.brief,
      badges: ['proj', ...(done?['done']:started?['started']:[])],
      meta: proj.chapterTitle,
      pct: done?100:(started?40:0), started, done,
      recentKey:[pid]
    });
  });
  CHAPTERS.forEach(ch=>{
    const best = STATE.quizBest && STATE.quizBest[ch.id]!=null ? STATE.quizBest[ch.id] : null;
    const done = best===100;
    const started = best!=null && !done;
    cards.push({
      kind:'quiz', id:ch.id, title:'🧠 Quiz: '+ch.title,
      blurb: best!=null ? `Best score so far: ${best}%. Retake any time to try for a better one.` : `Test yourself on ${ch.title} — mix of multiple choice, enumeration, and drag-and-drop.`,
      badges: ['quiz', ...(done?['done']:started?['started']:[])],
      meta: ch.title,
      pct: best!=null?best:0, started, done,
      recentKey: []
    });
  });
  return cards;
}

function renderDashCard(c){
  const badgeHtml = c.badges.map(b=>{
    if(b==='done') return `<span class="badge" style="border-color:var(--green);color:var(--green)">✓ done</span>`;
    if(b==='started') return `<span class="badge medium">in progress</span>`;
    if(b==='proj') return `<span class="badge proj">PROJECT</span>`;
    if(b==='quiz') return `<span class="badge quiz">QUIZ</span>`;
    return '';
  }).join('');
  const onclick = c.kind==='chapter' ? `jumpToChapter('${c.id}')` : c.kind==='quiz' ? `enterQuizFromDash('${c.id}')` : `enterProjectFromDash('${c.id}')`;
  const metaLabel = c.kind==='quiz' ? (c.started||c.done ? `${c.pct}% best` : 'not attempted') : `${c.pct}% complete`;
  return `
    <div class="dash-card ${c.done?'done':''}" onclick="${onclick}">
      <div class="toprow">${badgeHtml}</div>
      <h3>${escapeHtml(c.title)}</h3>
      <p>${escapeHtml(c.blurb)}</p>
      <div class="meta"><span>${escapeHtml(c.meta)}</span><span>${metaLabel}</span></div>
      <div class="mbar"><div style="width:${c.pct}%"></div></div>
    </div>`;
}

/* ---------------- Chapter recap view ---------------- */
// Pulls the TL;DR line back out of a lesson's authored `concept` HTML so the
// recap doesn't need its own separately-maintained summary copy per lesson.
function extractTldr(conceptHtml){
  const m = conceptHtml.match(/<div class="tldr"><span class="tldr-label">TL;DR<\/span>(.*?)<\/div>/);
  return m ? m[1] : '';
}
function chapterAvgMastery(ch){
  const tags = [...new Set(ch.lessons.map(l=>l.tag))];
  if(!tags.length) return 0;
  return Math.round(tags.reduce((a,t)=>a+getMastery(t),0)/tags.length);
}

// crude var collector: run transpiled code but capture locals via Function + explicit return object
function tryCollectVars(code){
  try{
    let body = transpile(code);
    const varNames = [...new Set([...body.matchAll(/\blet\s+(\w+)/g)].map(m=>m[1]))];
    const output = [];
    const __print = (...vals)=>{ output.push(vals.join('')); };
    const __input = ()=>0;
    const wrapped = body + `\nreturn {${varNames.map(v=>`${v}: (typeof ${v}!=='undefined'?${v}:undefined)`).join(',')}};`;
    const fn = new Function('__print','__input', wrapped);
    const vars = fn(__print, __input);
    return vars;
  }catch(e){ return {}; }
}

function startChallenge(lessonId){
  const found = lessonById(lessonId);
  const tag = found.lesson.tag;
  const diff = pickDifficulty(tag);
  const gen = PROBLEM_GENERATORS[tag];
  const problem = gen ? gen[diff]() : null;
  if(!problem){ return; }
  CURRENT_PROBLEM = Object.assign({tag, diff, lessonId}, problem);
  STATE.hintIndex[lessonId+'_problem'] = 0;
  goTo('problem', lessonId+'_problem');
}

function markLessonComplete(id){
  // "mark complete" used to award XP with zero verification, letting someone rack up
  // XP/mastery-adjacent credit for every lesson without ever running the challenge.
  // Now it requires having attempted the lesson's challenge at least once, and pays out
  // less XP than actually passing one (10 vs the 20-30 checkProblem() awards).
  if(!STATE.attemptedLessons.includes(id)){
    const fbEl = document.getElementById('lesson-complete-note');
    if(fbEl) fbEl.textContent = 'Try the challenge for this lesson at least once before marking it complete.';
    return;
  }
  if(!STATE.completedLessons.includes(id)){
    STATE.completedLessons.push(id);
    addXP(10);
  }
  saveState();
  render();
}

// Plain substring matching lets numeric answers false-positive: a challenge expecting "15"
// would accept a buggy "115" or "1500" because "115".includes("15") is true. For expected
// values that are pure numbers, require them to appear as a standalone token (not embedded
// inside a longer digit run) rather than anywhere in the output. Non-numeric expected values
// (phrases like "Rex says woof", "even", "yes") keep plain substring matching, since prompts
// often have surrounding text/formatting that a full-output match would wrongly reject.
function outputMatches(output, expected){
  if(/^-?\d+(\.\d+)?$/.test(expected)){
    const escaped = expected.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`(?<![\\d.-])${escaped}(?![\\d.])`);
    return re.test(output);
  }
  return output.includes(expected);
}
function gradeProblem(code, p){
  const result = runCppSubset(code, []);
  const runOk = result.success;
  let pass = false, msg = '';
  if(p.structural && p.structural.length){
    const missing = p.structural.filter(kw => !code.includes(kw));
    const executionRequired = p.expectedContains && p.expectedContains.length > 0;
    if(missing.length===0 && (!executionRequired || (runOk && p.expectedContains.every(e=>outputMatches(result.output,e))))){
      pass = true; msg = 'Structure and output both look right. Nice.';
    } else if(missing.length){
      msg = `Missing expected structure: ${missing.join(', ')}`;
    } else if(executionRequired && !runOk){
      msg = `Runs with an error: ${result.error}`;
    } else if(executionRequired){
      msg = `Runs, but the output doesn't match yet. Got: "${result.output}"`;
    } else {
      msg = `Runtime error (not required to pass, but worth checking): ${result.error}`;
    }
  } else {
    if(!runOk){ msg = `Runtime error: ${result.error}`; }
    else if(p.expectedContains.every(e=>outputMatches(result.output,e))){ pass = true; msg = 'Correct! Output matches.'; }
    else { msg = `Not quite — expected output to include "${p.expectedContains.join('", "')}". Got: "${result.output}"`; }
  }
  return {pass, msg, runOk, result};
}

function checkProblem(){
  const code = getProblemCode();
  const p = CURRENT_PROBLEM;
  const fbEl = document.getElementById('prob-feedback');
  const {pass, msg, runOk, result} = gradeProblem(code, p);

  const consoleEl = document.getElementById('prob-console');
  consoleEl.className = 'console'+(runOk?'':' err');
  consoleEl.textContent = runOk ? (result.output||'(no output)') : ('Error: '+result.error);
  document.getElementById('prob-diagram').innerHTML = renderDiagram(tryCollectVars(code));

  fbEl.innerHTML = `<div class="feedback ${pass?'pass':'fail'}">${pass?'✓ ':'✗ '}${msg}</div>`;
  if(pass){
    updateMastery(p.tag, p.diff==='hard'?18:p.diff==='medium'?15:12);
    addXP(p.diff==='hard'?30:p.diff==='medium'?20:10);
    if(p.isDaily){
      if(!STATE.dailyChallenge.completed){
        STATE.dailyChallenge.completed = true;
        const today = todayKey();
        const y = new Date(); y.setDate(y.getDate()-1);
        const yesterday = y.toISOString().slice(0,10);
        STATE.dailyStreak = (STATE.lastDailyDate === yesterday) ? STATE.dailyStreak + 1 : 1;
        STATE.lastDailyDate = today;
        addXP(25); // daily bonus on top of the normal reward above
      }
    } else {
      if(!STATE.completedLessons.includes(p.lessonId)) STATE.completedLessons.push(p.lessonId);
      if(!STATE.attemptedLessons.includes(p.lessonId)) STATE.attemptedLessons.push(p.lessonId);
    }
    saveState();
    refreshChrome();
  } else {
    if(!p.isDaily){
      updateMastery(p.tag, -4);
      if(!STATE.attemptedLessons.includes(p.lessonId)) { STATE.attemptedLessons.push(p.lessonId); saveState(); }
    }
  }
}

/* ---------------- Quiz (multiple choice / enumeration / drag-and-drop) ---------------- */
function buildQuizState(chapterId){
  const bank = QUIZZES[chapterId] || [];
  const chosen = shuffleArr(bank).slice(0, Math.min(6, bank.length));
  const questions = chosen.map(q=>{
    if(q.type==='dragdrop'){
      const pool = shuffleArr(q.items.map((text,i)=>({origIndex:i, text})));
      return Object.assign({}, q, {slots:new Array(q.items.length).fill(null), pool});
    }
    if(q.type==='mc') return Object.assign({}, q, {selected:null});
    if(q.type==='enum') return Object.assign({}, q, {answer:''});
    return Object.assign({}, q);
  });
  return {chapterId, questions, submitted:false, score:0};
}
function ensureQuiz(chapterId){
  if(!QUIZ_STATE || QUIZ_STATE.chapterId !== chapterId){
    QUIZ_STATE = buildQuizState(chapterId);
  }
}
function startQuiz(chapterId){
  ensureQuiz(chapterId);
  goTo('quiz', chapterId);
}
function restartQuiz(){
  if(!QUIZ_STATE) return;
  QUIZ_STATE = buildQuizState(QUIZ_STATE.chapterId);
  rerenderMain();
}
function selectMcOption(qIndex, optIndex){
  if(!QUIZ_STATE || QUIZ_STATE.submitted) return;
  QUIZ_STATE.questions[qIndex].selected = optIndex;
  rerenderMain();
}
function setEnumAnswer(qIndex, val){
  if(!QUIZ_STATE || QUIZ_STATE.submitted) return;
  QUIZ_STATE.questions[qIndex].answer = val;
}
function placeDragItem(qIndex, origIndex){
  if(!QUIZ_STATE || QUIZ_STATE.submitted) return;
  const q = QUIZ_STATE.questions[qIndex];
  const slotIdx = q.slots.findIndex(s=>s===null);
  if(slotIdx===-1) return;
  q.slots[slotIdx] = origIndex;
  q.pool = q.pool.filter(p=>p.origIndex!==origIndex);
  rerenderMain();
}
function removeDragItem(qIndex, slotIdx){
  if(!QUIZ_STATE || QUIZ_STATE.submitted) return;
  const q = QUIZ_STATE.questions[qIndex];
  const origIndex = q.slots[slotIdx];
  if(origIndex==null) return;
  q.slots[slotIdx] = null;
  q.pool.push({origIndex, text:q.items[origIndex]});
  rerenderMain();
}
function submitQuiz(){
  if(!QUIZ_STATE || QUIZ_STATE.submitted) return;
  const norm = s => String(s||'').trim().toLowerCase();
  QUIZ_STATE.questions.forEach(q=>{
    let correct = false;
    if(q.type==='mc'){
      correct = q.selected === q.answer;
      q.partialScore = correct ? 1 : 0;
    } else if(q.type==='enum'){
      if(q.multi){
        const parts = norm(q.answer).split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean);
        correct = q.answers.every(a=>parts.includes(norm(a)));
      } else {
        correct = q.answers.some(a=>norm(a)===norm(q.answer));
      }
      q.partialScore = correct ? 1 : 0;
    } else if(q.type==='dragdrop'){
      // fractional credit: how many slots landed in their correct position, out of the total
      const totalSlots = q.items.length;
      const correctSlots = q.slots.filter((v,i)=>v===i).length;
      q.partialScore = totalSlots ? correctSlots/totalSlots : 0;
      correct = q.partialScore === 1;
    }
    q.correct = correct;
  });
  QUIZ_STATE.score = QUIZ_STATE.questions.reduce((sum,q)=>sum+(q.partialScore||0), 0);
  QUIZ_STATE.submitted = true;
  const total = QUIZ_STATE.questions.length;
  QUIZ_STATE.questions.forEach(q=>{ updateMastery(q.tag, q.correct ? 8 : -2); });
  addXP(Math.round(QUIZ_STATE.score*5) + (QUIZ_STATE.score===total ? 15 : 0));
  if(!STATE.quizBest) STATE.quizBest = {};
  const pct = Math.round((QUIZ_STATE.score/total)*100);
  STATE.quizBest[QUIZ_STATE.chapterId] = Math.max(STATE.quizBest[QUIZ_STATE.chapterId]||0, pct);
  saveState();
  rerenderMain();
  refreshChrome();
}
function renderQuizQuestion(q, i){
  const stateClass = QUIZ_STATE.submitted ? (q.correct?'correct':'wrong') : '';
  const typeLabel = q.type==='mc' ? 'multiple choice' : q.type==='enum' ? 'enumeration' : 'drag &amp; drop';
  let body = '';
  if(q.type==='mc'){
    body = `<div class="qopts">${q.options.map((opt,oi)=>{
      let cls = 'qopt';
      if(QUIZ_STATE.submitted){
        if(oi===q.answer) cls += ' correct';
        else if(oi===q.selected) cls += ' wrong';
      } else if(oi===q.selected){ cls += ' selected'; }
      return `<button class="${cls}" ${QUIZ_STATE.submitted?'disabled':''} onclick="selectMcOption(${i},${oi})">${escapeHtml(opt)}</button>`;
    }).join('')}</div>`;
  } else if(q.type==='enum'){
    body = `<input type="text" class="qinput" ${QUIZ_STATE.submitted?'disabled':''} placeholder="${q.multi?'comma-separated answers':'type your answer'}" value="${escapeHtml(q.answer)}" oninput="setEnumAnswer(${i},this.value)">
      ${QUIZ_STATE.submitted?`<div class="qanswerkey">Accepted: ${q.answers.map(escapeHtml).join(', ')}</div>`:''}`;
  } else if(q.type==='dragdrop'){
    const slots = q.slots.map((origIndex,si)=>{
      let cls = 'dragslot' + (origIndex!=null?' filled':'');
      if(QUIZ_STATE.submitted && origIndex!=null){ cls += (origIndex===si?' ok':' bad'); }
      const label = origIndex!=null ? escapeHtml(q.items[origIndex]) : 'tap a piece below to place it here';
      return `<div class="${cls}" onclick="removeDragItem(${i},${si})"><span class="n">${si+1}</span>${label}</div>`;
    }).join('');
    const pool = q.pool.map(p=>`<button class="dragchip" onclick="placeDragItem(${i},${p.origIndex})">${escapeHtml(p.text)}</button>`).join('');
    body = `<div class="dragslots">${slots}</div>${!QUIZ_STATE.submitted?`<div class="dragpool">${pool}</div>`:(q.correct?'':`<div class="qanswerkey">Correct order: ${q.items.map(escapeHtml).join(' → ')}</div>`)}`;
  }
  return `
    <div class="qcard ${stateClass}">
      <div class="qhead">
        <span class="qnum">Q${i+1} · ${typeLabel}</span>
        ${QUIZ_STATE.submitted?(q.correct?'<span class="badge" style="border-color:var(--green);color:var(--green)">✓ correct</span>':'<span class="badge" style="border-color:var(--red);color:var(--red)">✗ missed</span>'):''}
      </div>
      <p class="qtext">${q.q}</p>
      ${body}
      ${QUIZ_STATE.submitted && !q.correct && q.explain ? `<div class="qexplain"><b>Why:</b> ${escapeHtml(q.explain)}</div>` : ''}
    </div>`;
}
function renderQuizView(chapterId){
  ensureQuiz(chapterId);
  const ch = CHAPTERS.find(c=>c.id===chapterId);
  if(!ch) return '<p>Chapter not found.</p>';
  const best = STATE.quizBest && STATE.quizBest[chapterId]!=null ? STATE.quizBest[chapterId] : null;
  const questionsHtml = QUIZ_STATE.questions.map((q,i)=>renderQuizQuestion(q,i)).join('');
  const total = QUIZ_STATE.questions.length;
  const scoreDisplay = Number.isInteger(QUIZ_STATE.score) ? QUIZ_STATE.score : QUIZ_STATE.score.toFixed(1);
  return `
    <div class="crumbs">${ch.title} <span class="cyan">/</span> Quiz</div>
    <h2 class="title">🧠 Quiz: ${ch.title}</h2>
    <span class="badge quiz">${total} questions</span>
    ${best!=null?`<span class="badge" style="border-color:var(--cyan-dim);color:var(--cyan)">best ${best}%</span>`:''}
    <div class="prose" style="margin:14px 0;">Mix of multiple choice, enumeration, and drag-and-drop pulled from this chapter's lessons. Drag-and-drop questions award partial credit for slots placed correctly. Answer everything, then submit to see your score.</div>
    ${questionsHtml}
    <div class="qsubmitrow">
      ${QUIZ_STATE.submitted
        ? `<span class="quizscore">Score: ${scoreDisplay} / ${total}</span><button class="btn ghost" onclick="restartQuiz()">↺ Retake quiz</button>`
        : `<button class="btn primary" onclick="submitQuiz()">✓ Submit quiz</button>`}
    </div>
  `;
}
