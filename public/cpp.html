<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PolyBro · C++</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#0B1D33;
  --panel:#0F2440;
  --panel-2:#122a4a;
  --grid:#1D3A54;
  --cyan:#4FD1E8;
  --cyan-dim:#2b6b78;
  --paper:#EDEFF2;
  --paper-dim:#9FB2C6;
  --amber:#F5A623;
  --green:#6FCF97;
  --red:#EF6F6C;
  --purple:#b78cf5;
  --purple-dim:#5f4d85;
  --pink:#f2789f;
  --pink-dim:#7a4257;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/32px 32px,
    var(--ink);
  background-blend-mode: normal, normal, normal;
  opacity:1;
  color:var(--paper);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background: radial-gradient(circle at 15% 10%, rgba(79,209,232,0.06), transparent 40%);
  pointer-events:none;
}
h1,h2,h3,.mono-head{font-family:'JetBrains Mono',monospace; letter-spacing:0.02em;}
code, textarea, .console, .plex{font-family:'IBM Plex Mono',monospace;}

::selection{background:var(--cyan);color:var(--ink);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--panel);}
::-webkit-scrollbar-thumb{background:var(--grid);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--cyan-dim);}

button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
button:focus-visible, [tabindex]:focus-visible, a:focus-visible, textarea:focus-visible{
  outline:2px solid var(--cyan); outline-offset:2px;
}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;min-height:100vh;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;border-bottom:1px solid var(--grid);
  background:rgba(11,29,51,0.85);backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{
  width:30px;height:30px;border:1.5px solid var(--cyan);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:var(--cyan);
  font-family:'JetBrains Mono';font-weight:800;font-size:14px;
  box-shadow:0 0 14px rgba(79,209,232,0.25) inset;
}
.brand h1{font-size:16px;margin:0;font-weight:700;color:var(--paper);}
.brand .tag{font-size:11px;color:var(--paper-dim);font-family:'IBM Plex Mono';margin-top:-2px;}

.stats{display:flex;align-items:center;gap:18px;}
.stat{display:flex;flex-direction:column;align-items:flex-end;}
.stat .v{font-family:'JetBrains Mono';font-weight:700;font-size:15px;color:var(--cyan);}
.stat .l{font-size:10px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.08em;}
.xpbar{width:120px;height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin-top:4px;}
.xpbar > div{height:100%;background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));}

.focusbtn{
  background:transparent;border:1px solid var(--grid);color:var(--paper-dim);
  padding:7px 12px;border-radius:6px;font-size:12px;font-family:'IBM Plex Mono';
}
.focusbtn:hover{border-color:var(--cyan);color:var(--cyan);}
.focusbtn.on{border-color:var(--amber);color:var(--amber);}

.layout{flex:1;display:grid;grid-template-columns:270px 1fr 300px;gap:0;min-height:0;}
.layout.focus{grid-template-columns:0px 1fr 0px;}
.layout.focus .sidepanel, .layout.focus .mentorpanel{display:none;}

/* ---------- side panel (skill tree) ---------- */
.sidepanel{
  border-right:1px solid var(--grid);padding:18px 14px;overflow-y:auto;
  max-height:calc(100vh - 63px);
}
.sidepanel h2{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--paper-dim);margin:4px 0 14px 2px;}
.chapter{margin-bottom:6px;}
.chapter-head{
  display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:6px;cursor:pointer;
  color:var(--paper);font-size:13px;font-weight:600;
}
.chapter-head:hover{background:var(--panel-2);}
.chapter-head .idx{
  width:20px;height:20px;border-radius:4px;border:1px solid var(--grid);
  display:flex;align-items:center;justify-content:center;font-size:10px;
  font-family:'JetBrains Mono';color:var(--paper-dim);flex-shrink:0;
}
.chapter-head.done .idx{border-color:var(--green);color:var(--green);}
.chapter-body{padding-left:26px;border-left:1px dashed var(--grid);margin-left:9px;}
.lesson-node{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;
  font-size:12.5px;color:var(--paper-dim);position:relative;
}
.lesson-node:hover{background:var(--panel-2);color:var(--paper);}
.lesson-node.active{background:rgba(79,209,232,0.12);color:var(--cyan);}
.lesson-node .dot{width:8px;height:8px;border-radius:50%;background:var(--grid);flex-shrink:0;}
.lesson-node.complete .dot{background:var(--green);}
.lesson-node.inprogress .dot{background:var(--amber);}
.project-node{
  display:flex;align-items:center;gap:8px;padding:7px 8px;margin:6px 0 10px;border-radius:5px;cursor:pointer;
  font-size:12px;color:var(--amber);border:1px dashed var(--cyan-dim);
}
.project-node:hover{background:rgba(245,166,35,0.08);}
.project-node.done{color:var(--green);border-color:var(--green);}
.project-node .dot{width:8px;height:8px;transform:rotate(45deg);background:var(--amber);flex-shrink:0;}
.project-node.done .dot{background:var(--green);}
.recap-node{
  display:flex;align-items:center;gap:8px;padding:6px 8px;margin:2px 0 8px;border-radius:5px;cursor:pointer;
  font-size:12px;color:var(--cyan);
}
.recap-node:hover{background:rgba(79,209,232,0.08);}
.recap-node.active{background:rgba(79,209,232,0.12);}
.recap-node .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--cyan);background:transparent;flex-shrink:0;}
.quiz-node{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;margin:2px 0 8px;border-radius:5px;cursor:pointer;
  font-size:12px;color:var(--pink);
}
.quiz-node:hover{background:rgba(242,120,159,0.08);}
.quiz-node.active{background:rgba(242,120,159,0.12);}
.quiz-node .left{display:flex;align-items:center;gap:8px;}
.quiz-node .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--pink);background:transparent;flex-shrink:0;}
.quiz-node .best{font-family:'IBM Plex Mono';font-size:10px;color:var(--paper-dim);}

/* ---------- main panel ---------- */
.mainpanel{padding:26px 34px;overflow-y:auto;max-height:calc(100vh - 63px);}
.crumbs{font-size:11px;color:var(--paper-dim);font-family:'IBM Plex Mono';margin-bottom:10px;text-transform:uppercase;letter-spacing:0.06em;}
.crumbs .cyan{color:var(--cyan);}
.view h2.title{font-size:26px;margin:0 0 4px;color:var(--paper);}
.badge{
  display:inline-block;font-size:10px;font-family:'IBM Plex Mono';padding:3px 8px;border-radius:20px;
  border:1px solid var(--grid);color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.06em;margin-right:6px;
}
.badge.easy{border-color:var(--green);color:var(--green);}
.badge.medium{border-color:var(--amber);color:var(--amber);}
.badge.hard{border-color:var(--red);color:var(--red);}

.card{
  background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:20px;margin:16px 0;
  position:relative;
}
.card::before{
  content:attr(data-tag);position:absolute;top:-9px;left:14px;background:var(--ink);
  padding:0 6px;font-size:10px;font-family:'IBM Plex Mono';color:var(--cyan);letter-spacing:0.08em;text-transform:uppercase;
}
.prose{font-size:14.5px;line-height:1.7;color:var(--paper);}
.prose p{margin:0 0 12px;}
.prose strong{color:var(--cyan);}

pre.codeblock{
  background:#081625;border:1px solid var(--grid);border-radius:8px;padding:14px 16px;
  font-size:13px;line-height:1.6;overflow-x:auto;color:#cfe8ee;
}
.kw{color:#f5a623;}.str{color:#6fcf97;}.com{color:#5a7086;}.type{color:#4fd1e8;}

.editorwrap{border:1px solid var(--grid);border-radius:8px;overflow:hidden;margin-top:10px;}
.editorbar{
  display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);
  padding:8px 12px;font-size:11px;color:var(--paper-dim);font-family:'IBM Plex Mono';
}
textarea.editor{
  width:100%;min-height:180px;background:#081625;color:#e6f2f5;border:none;padding:14px 16px;
  font-size:13px;line-height:1.6;resize:vertical;
}
textarea.editor:focus{outline:none;}

.btnrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.btn{
  padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;font-family:'IBM Plex Mono';
  border:1px solid var(--grid);background:var(--panel-2);color:var(--paper);
}
.btn:hover{border-color:var(--cyan);color:var(--cyan);}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#04141f;}
.btn.primary:hover{background:#6fe0f2;color:#04141f;}
.btn.ghost{background:transparent;}
.btn.amber{border-color:var(--amber);color:var(--amber);}
.btn.amber:hover{background:rgba(245,166,35,0.1);}
.btn.google{background:#fff;border-color:#fff;color:#3c4043;display:flex;align-items:center;gap:8px;}
.btn.google:hover{background:#f1f3f4;color:#3c4043;border-color:#f1f3f4;}
.btn.google svg{flex-shrink:0;}
.auth-toggle{font-size:11.5px;color:var(--cyan);cursor:pointer;margin-top:14px;text-decoration:underline;text-underline-offset:2px;}
.auth-toggle:hover{color:#6fe0f2;}
.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:10.5px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.06em;}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--grid);}
.auth-error{font-size:11.5px;color:var(--red);margin-top:8px;line-height:1.5;text-align:left;min-height:0;}

.modal-overlay{position:fixed;inset:0;background:rgba(6,14,26,0.72);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-card{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:22px 24px;width:320px;position:relative;}
.modal-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;border-radius:12px 12px 0 0;background:linear-gradient(90deg,var(--amber),var(--red));}
.modal-card h3{margin:0 0 8px;font-size:16px;color:var(--paper);}
.modal-card p{margin:0 0 6px;font-size:13px;color:var(--paper-dim);line-height:1.5;}

.console{
  background:#050d17;border:1px solid var(--grid);border-radius:8px;padding:12px 14px;margin-top:10px;
  font-size:12.5px;color:#9fe6b8;min-height:44px;white-space:pre-wrap;
}
.console.err{color:var(--red);}
.feedback{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:13px;border:1px solid;}
.feedback.pass{background:rgba(111,207,151,0.08);border-color:var(--green);color:var(--green);}
.feedback.fail{background:rgba(239,111,108,0.08);border-color:var(--red);color:var(--red);}

.checklist{list-style:none;padding:0;margin:10px 0;}
.checklist li{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:5px 0;color:var(--paper-dim);}
.checklist li.ok{color:var(--green);}
.checklist li .mark{font-family:'JetBrains Mono';width:16px;flex-shrink:0;}

.diagram-wrap{background:#081625;border:1px solid var(--grid);border-radius:8px;padding:10px;margin-top:12px;}
.diagram-wrap svg{width:100%;height:auto;display:block;}

/* ---------- mentor panel ---------- */
.mentorpanel{border-left:1px solid var(--grid);padding:18px 16px;overflow-y:auto;max-height:calc(100vh - 63px);}
.mentor-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.mentor-avatar{
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--cyan);
  display:flex;align-items:center;justify-content:center;background:var(--panel-2);flex-shrink:0;
}
.mentor-head h3{margin:0;font-size:13px;color:var(--paper);}
.mentor-head .sub{font-size:10.5px;color:var(--paper-dim);font-family:'IBM Plex Mono';}
.hint-card{
  background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:12px 14px;margin-bottom:10px;
  font-size:12.5px;line-height:1.55;color:var(--paper);
}
.hint-card .n{color:var(--cyan);font-family:'JetBrains Mono';font-size:10px;margin-bottom:5px;display:block;}
.mentor-empty{font-size:12px;color:var(--paper-dim);line-height:1.6;}
.streaknote{
  margin-top:18px;padding:12px;border:1px dashed var(--grid);border-radius:8px;font-size:11.5px;color:var(--paper-dim);
}
.streaknote b{color:var(--amber);}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;}
  .sidepanel,.mentorpanel{max-height:280px;border-right:none;border-bottom:1px solid var(--grid);}
  .mainpanel{max-height:none;}
}

/* ---------- landing page ---------- */
.landing{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;position:relative;
}
.landing-mark{
  width:64px;height:64px;border-radius:14px;border:1.5px solid var(--cyan);
  display:flex;align-items:center;justify-content:center;background:var(--panel-2);
  font-family:'JetBrains Mono';font-weight:800;font-size:26px;color:var(--cyan);
  margin:0 auto 18px;box-shadow:0 0 24px rgba(79,209,232,0.15);
}
.landing h1{font-size:34px;margin:0 0 8px;color:var(--paper);letter-spacing:0.01em;}
.landing .sub{font-size:14px;color:var(--paper-dim);max-width:480px;margin:0 auto 36px;line-height:1.6;}
.landing-grid{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:780px;margin:0 auto;}
.landing-card{
  background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:22px 24px;
  width:300px;text-align:left;position:relative;overflow:hidden;
}
.landing-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--cyan),transparent);
}
.landing-card.amber::before{background:linear-gradient(90deg,var(--amber),transparent);}
.landing-card h3{margin:0 0 6px;font-size:15px;color:var(--paper);font-family:'JetBrains Mono';}
.landing-card p{margin:0 0 16px;font-size:12.5px;color:var(--paper-dim);line-height:1.6;}
.landing-card .btn{width:100%;justify-content:center;}
.landing-stats{display:flex;gap:24px;margin-top:34px;flex-wrap:wrap;justify-content:center;}
.landing-stats .stat{align-items:center;}
.landing-foot{margin-top:38px;font-size:11px;color:var(--paper-dim);font-family:'IBM Plex Mono';letter-spacing:0.04em;}
.brand.clickable{cursor:pointer;}
.brand.clickable:hover .mark{border-color:var(--cyan);box-shadow:0 0 12px rgba(79,209,232,0.3);}

/* ---------- login screen ---------- */
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.login-card{
  background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:36px 34px;
  width:380px;text-align:center;position:relative;overflow:hidden;
}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--amber));}
.login-card input{
  width:100%;box-sizing:border-box;background:var(--ink);border:1px solid var(--grid);border-radius:8px;
  padding:11px 14px;color:var(--paper);font-family:'Inter';font-size:14px;margin:18px 0 6px;
}
.login-card input:focus{outline:none;border-color:var(--cyan);}
.login-note{font-size:11px;color:var(--paper-dim);line-height:1.6;margin-bottom:16px;}
.login-classmates{margin-top:22px;padding-top:18px;border-top:1px dashed var(--grid);}
.login-classmates .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--paper-dim);margin-bottom:10px;}
.avatar-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.mini-avatar{
  width:26px;height:26px;border-radius:50%;background:var(--panel-2);border:1px solid var(--grid);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--cyan);font-family:'JetBrains Mono';font-weight:700;
}

/* ---------- dashboard shell ---------- */
.dash-shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.dash-nav{border-right:1px solid var(--grid);padding:18px 14px;display:flex;flex-direction:column;}
.dash-profile{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--panel-2);
  cursor:pointer;margin-bottom:18px;
}
.dash-profile:hover{border:1px solid var(--cyan);}
.dash-profile .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--amber));flex-shrink:0;}
.dash-profile span{font-size:12.5px;color:var(--paper);font-family:'JetBrains Mono';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dash-navitem{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--paper-dim);
  font-size:13px;cursor:pointer;margin-bottom:2px;
}
.dash-navitem:hover{background:var(--panel-2);color:var(--paper);}
.dash-navitem.active{background:rgba(79,209,232,0.1);color:var(--cyan);}
.dash-nav-section{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--paper-dim);margin:16px 0 6px 10px;}
.dash-nav-foot{margin-top:auto;padding-top:14px;}
.dash-main{padding:30px 40px;overflow-y:auto;max-height:100vh;}
.dash-search{
  width:100%;max-width:520px;background:var(--panel);border:1px solid var(--grid);border-radius:9px;
  padding:11px 16px;color:var(--paper-dim);font-size:13.5px;margin-bottom:28px;display:flex;align-items:center;gap:8px;
}
.dash-search input{flex:1;background:transparent;border:none;outline:none;color:var(--paper);font-family:'Inter';font-size:13.5px;}
.dash-header h1{font-size:30px;margin:0 0 6px;color:var(--paper);}
.dash-header .sub{font-size:13.5px;color:var(--paper-dim);margin-bottom:22px;}
.mastery-hero{
  background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:18px 22px;margin-bottom:26px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.mastery-hero .ring{
  width:64px;height:64px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono';font-weight:700;font-size:14px;color:var(--cyan);
  background:conic-gradient(var(--cyan) calc(var(--pct)*1%), var(--grid) 0);
}
.mastery-hero .ring::before{content:"";position:absolute;}
.mastery-hero .ring-inner{
  width:50px;height:50px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;
}
.mastery-hero .txt{flex:1;min-width:200px;}
.mastery-hero .txt h4{margin:0 0 4px;font-size:13px;color:var(--paper);}
.mastery-hero .txt p{margin:0;font-size:11.5px;color:var(--paper-dim);}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--grid);margin-bottom:20px;}
.tab{
  padding:8px 2px 12px;font-size:13px;color:var(--paper-dim);cursor:pointer;border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:6px;
}
.tab .n{background:var(--panel-2);border-radius:10px;padding:1px 7px;font-size:10.5px;font-family:'JetBrains Mono';}
.tab.active{color:var(--paper);border-bottom-color:var(--cyan);}
.dash-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
.dash-card{
  background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:18px 20px;cursor:pointer;
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
.dash-card:hover{border-color:var(--cyan);}
.dash-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),transparent);}
.dash-card.done::before{background:linear-gradient(90deg,var(--green),transparent);}
.dash-card .toprow{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.dash-card h3{margin:0 0 6px;font-size:15px;color:var(--paper);}
.dash-card p{margin:0 0 14px;font-size:12px;color:var(--paper-dim);line-height:1.55;flex:1;}

<body>
<div id="app"></div>

<script>
/* =========================================================================
   FIREBASE AUTH (placeholder — fill in FIREBASE_CONFIG to enable)
   =========================================================================
   Leave FIREBASE_CONFIG empty and the app runs exactly as it does today: a
   typed display name, no password, progress keyed by that name in shared
   storage. Paste in a real Firebase project's config object (Project
   settings → your app → SDK setup and configuration) and the login screen
   switches automatically to real email/password accounts + Google sign-in,
   with progress keyed by the authenticated user's UID instead of a typed
   name.

   Note on Google sign-in: this app runs inside a sandboxed iframe when
   previewed in claude.ai. Google's OAuth popup/redirect flow is commonly
   blocked by browsers or by Google itself inside sandboxed third-party
   iframes — that's outside this app's control. Email/password will work
   fine in-preview; Google sign-in is most likely to work once this file is
   downloaded and opened directly, or hosted somewhere with a real origin.
*/
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC--D4VKQf07rPkFTeUw9p01YVWMy6DtWs",
  authDomain: "cppbro-23.firebaseapp.com",
  projectId: "cppbro-23",
  storageBucket: "cppbro-23.firebasestorage.app",
  messagingSenderId: "662822687783",
  appId: "1:662822687783:web:a40751e3b964397cb16a02"
};
const FIREBASE_ENABLED = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);

let firebaseActive = false;     // true only once the SDK has actually loaded + initialized
let fbAuth = null;
let fbDb = null;                // Firestore instance — the actual persistence backend once hosted for real
let fbUser = null;
let authMode = 'signin';        // 'signin' | 'signup', login-screen toggle
let pendingSignupName = null;   // set during sign-up so the stale pre-updateProfile onAuthStateChanged fire is ignored

function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('failed to load '+src));
    document.head.appendChild(s);
  });
}
// resolves true once check() passes, false if timeoutMs elapses first — used because
// the script's onload firing doesn't guarantee window.firebase is fully attached yet
function waitFor(check, timeoutMs, intervalMs){
  return new Promise(resolve=>{
    const start = Date.now();
    (function poll(){
      if(check()) return resolve(true);
      if(Date.now()-start >= timeoutMs) return resolve(false);
      setTimeout(poll, intervalMs);
    })();
  });
}

async function initFirebase(){
  if(!FIREBASE_ENABLED) return false;
  try{
    await Promise.all([
      loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'),
      loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js'),
      loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js')
    ]);
    const ready = await waitFor(()=>window.firebase && window.firebase.auth && window.firebase.firestore, 6000, 50);
    if(!ready) throw new Error('Firebase SDK did not become ready in time');
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    return true;
  }catch(e){
    console.warn('Firebase unavailable — falling back to name-only login.', e);
    return false;
  }
}

/* Firestore is the real persistence backend — one document per learner at
   progress/{uid}, holding the STATE object directly (no JSON-string wrapping
   needed; Firestore stores nested objects/arrays natively). */
async function progressGet(uid){
  if(!fbDb) return null;
  try{
    const doc = await fbDb.collection('progress').doc(uid).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.warn('progress read failed', e); return null; }
}
async function progressSet(uid, stateObj){
  if(!fbDb) return;
  try{ await fbDb.collection('progress').doc(uid).set(stateObj); }catch(e){ console.warn('progress save failed', e); }
}
async function progressListAll(){
  if(!fbDb) return [];
  try{
    const snap = await fbDb.collection('progress').get();
    return snap.docs.map(d=>({id:d.id, data:d.data()}));
  }catch(e){ console.warn('progress list failed', e); return []; }
}

async function loginWithFirebaseUser(user, displayNameOverride){
  fbUser = user;
  const name = displayNameOverride || user.displayName || (user.email ? user.email.split('@')[0] : 'learner');
  currentUser = name;
  activeStorageKey = user.uid; // Firestore doc id
  const data = await progressGet(activeStorageKey);
  STATE = data ? Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), data) : JSON.parse(JSON.stringify(DEFAULT_STATE));
  STATE.displayName = name;
  touchStreak();
  await flushSave();
  appScreen = 'dashboard';
  render();
}

function friendlyAuthError(e){
  const code = (e && e.code) || '';
  if(code.includes('email-already-in-use')) return 'That email already has an account — try signing in instead.';
  if(code.includes('weak-password')) return 'Password should be at least 6 characters.';
  if(code.includes('invalid-email')) return "That email address doesn't look right.";
  if(code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'Email or password is incorrect.';
  if(code.includes('popup-blocked') || code.includes('popup-closed') || code.includes('cancelled-popup-request')) return 'Google sign-in was closed or blocked before finishing.';
  if(code.includes('network-request-failed')) return "Couldn't reach the auth server — check your connection.";
  return (e && e.message) ? e.message : 'Something went wrong — try again.';
}

async function signUpEmail(email, password, displayName){
  const errEl = document.getElementById('auth-error');
  if(errEl) errEl.textContent = '';
  try{
    pendingSignupName = displayName || email.split('@')[0];
    const cred = await fbAuth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: pendingSignupName });
    // updateProfile has now resolved, so cred.user carries the confirmed name — log in
    // explicitly rather than waiting on onAuthStateChanged, which already fired once
    // with the pre-update (nameless) user object and is suppressed while this is set.
    const confirmedName = pendingSignupName;
    pendingSignupName = null;
    await loginWithFirebaseUser(cred.user, confirmedName);
  }catch(e){
    pendingSignupName = null;
    if(errEl) errEl.textContent = friendlyAuthError(e);
  }
}
async function signInEmail(email, password){
  const errEl = document.getElementById('auth-error');
  if(errEl) errEl.textContent = '';
  try{
    await fbAuth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged picks this up and logs in — no pending name involved here
  }catch(e){
    if(errEl) errEl.textContent = friendlyAuthError(e);
  }
}
async function signInGoogle(){
  const errEl = document.getElementById('auth-error');
  if(errEl) errEl.textContent = '';
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await fbAuth.signInWithPopup(provider);
  }catch(e){
    if(errEl) errEl.textContent = friendlyAuthError(e) + ' (Google sign-in often fails in a sandboxed preview — try email/password here, or open this file directly in a browser once downloaded.)';
  }
}
async function signOutFirebase(){
  try{ await flushSave(); }catch(e){}
  try{ await fbAuth.signOut(); }catch(e){}
  // onAuthStateChanged's signed-out branch resets state and renders the login screen
}

function toggleAuthMode(){
  authMode = authMode==='signin' ? 'signup' : 'signin';
  render();
}
function submitAuth(){
  const email = ((document.getElementById('auth-email')||{}).value||'').trim();
  const password = (document.getElementById('auth-password')||{}).value||'';
  const errEl = document.getElementById('auth-error');
  if(!email || !password){ if(errEl) errEl.textContent = 'Enter an email and password.'; return; }
  if(authMode==='signup'){
    const nameEl = document.getElementById('auth-name');
    const name = sanitizeUsername(nameEl ? nameEl.value : '') || email.split('@')[0];
    signUpEmail(email, password, name);
  } else {
    signInEmail(email, password);
  }
}

/* =========================================================================
   PERSISTENCE
   ========================================================================= */
const DEFAULT_STATE = { xp:0, streak:0, lastActiveDate:null, mastery:{}, completedLessons:[], completedProjects:[], attemptedLessons:[], currentView:{type:'lesson', id:'basics_1'}, hintIndex:{}, dailyChallenge:null, dailyStreak:0, lastDailyDate:null, recent:[], displayName:null, machineSolved:0, quizBest:{} };
let STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
let appScreen = 'login'; // 'login' | 'dashboard' | 'mastery' | 'leaderboard' | 'app'
let currentUser = null; // sanitized username string once logged in (typed name, or Firebase display name)
let activeStorageKey = null; // storage key backing the current session — name-based or fbUserKey(uid)

function sanitizeUsername(name){
  return (name||'').trim().slice(0,20).replace(/[^a-zA-Z0-9_\- ]/g,'').trim().replace(/\s+/g,' ');
}

async function boot(){
  initGlossaryTooltip();
  if(FIREBASE_ENABLED){
    const app = document.getElementById('app');
    if(app) app.innerHTML = renderAuthLoadingScreen();
    firebaseActive = await initFirebase();
    if(firebaseActive){
      fbAuth.onAuthStateChanged(async (user)=>{
        if(user){
          if(pendingSignupName) return; // stale pre-updateProfile fire during sign-up — signUpEmail logs in explicitly once the name is confirmed
          await loginWithFirebaseUser(user);
        } else {
          fbUser = null; currentUser = null; activeStorageKey = null;
          STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
          appScreen = 'login';
          render();
        }
      });
      return; // onAuthStateChanged renders the first screen once Firebase reports auth state
    }
    // Firebase configured but failed to load (offline, blocked domain, bad config) — fall through to name-only mode below
  }
  appScreen = 'login';
  render();
}

// Reached only when Firebase isn't configured/available at all. There's no real backend
// in this mode — progress lives in memory for the session only and won't survive a reload.
async function loginAs(name){
  const clean = sanitizeUsername(name);
  if(!clean) return;
  currentUser = clean;
  activeStorageKey = null;
  STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
  STATE.displayName = clean;
  touchStreak();
  appScreen = 'dashboard';
  render();
}

async function flushSave(){
  if(!activeStorageKey) return;
  clearTimeout(saveTimer);
  await progressSet(activeStorageKey, STATE);
}

function requestLogout(){
  showLogoutModal();
}
async function confirmLogout(){
  hideLogoutModal();
  if(firebaseActive) { await signOutFirebase(); return; }
  currentUser = null;
  activeStorageKey = null;
  STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
  appScreen = 'login';
  render();
}
function showLogoutModal(){
  if(document.getElementById('logout-modal-overlay')) return;
  const el = document.createElement('div');
  el.id = 'logout-modal-overlay';
  el.className = 'modal-overlay';
  el.innerHTML = `
    <div class="modal-card">
      <h3>Log out?</h3>
      <p>You'll need to sign back in to see your progress again.</p>
      <div class="btnrow" style="justify-content:flex-end;">
        <button class="btn" onclick="hideLogoutModal()">Cancel</button>
        <button class="btn amber" onclick="confirmLogout()">Log out</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
}
function hideLogoutModal(){
  const el = document.getElementById('logout-modal-overlay');
  if(el) el.remove();
}

let saveTimer=null;
function saveState(){
  if(!activeStorageKey) return;
  const key = activeStorageKey;      // snapshot now — not whatever activeStorageKey is 250ms from now
  const snapshot = JSON.parse(JSON.stringify(STATE));
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ progressSet(key, snapshot); }, 250);
}
function touchStreak(){
  // migrate old toDateString()-format values (e.g. "Thu Aug 06 2026") from before
  // this used a shared UTC-based todayKey(), so upgrading doesn't spuriously reset streaks
  if(STATE.lastActiveDate && !/^\d{4}-\d{2}-\d{2}$/.test(STATE.lastActiveDate)){
    const parsed = new Date(STATE.lastActiveDate);
    if(!isNaN(parsed)) STATE.lastActiveDate = parsed.toISOString().slice(0,10);
  }
  const today = todayKey();
  if(STATE.lastActiveDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  if(STATE.lastActiveDate === yesterday){ STATE.streak += 1; } else { STATE.streak = 1; }
  STATE.lastActiveDate = today;
  saveState();
}

/* =========================================================================
   GLOSSARY — every piece of jargon used anywhere in a lesson gets an entry
   here. Lesson text wraps the word in <span class="jterm" data-g="KEY"> and
   the hover/focus tooltip (wired up in initGlossaryTooltip) pulls the
   definition from this object. The dedicated Documentation page also reads
   straight from here, grouped by `cat`, so there's exactly one place to
   update a definition.
   ========================================================================= */
const GLOSSARY = {
  type:        {term:'Type', cat:'Basics', plain:`Every value in C++ has to say what *kind* of thing it is — a whole number, a decimal, text, etc. That kind is its type, and once you pick it for a variable, it can't change.`},
  variable:    {term:'Variable', cat:'Basics', plain:`A named spot in memory that holds a value you can use or change later — like a labeled box you can look inside or refill.`},
  int:         {term:'int', cat:'Basics', plain:`A type for whole numbers, no decimal point — ages, counts, scores. Example: <code>int age = 16;</code>`},
  double:      {term:'double', cat:'Basics', plain:`A type for numbers with a decimal point — prices, measurements, anything that isn't a clean whole number. Example: <code>double price = 4.5;</code>`},
  string:      {term:'string', cat:'Basics', plain:`A type for text, wrapped in double quotes. Example: <code>string name = "Ada";</code>`},
  bool:        {term:'bool', cat:'Basics', plain:`A type that can only be <code>true</code> or <code>false</code> — used for yes/no, on/off questions.`},
  declare:     {term:'Declare / Initialize', cat:'Basics', plain:`"Declaring" a variable means telling C++ it exists and what type it is. "Initializing" means giving it a starting value at the same time — <code>int age = 16;</code> does both in one line.`},
  cout:        {term:'cout', cat:'Basics', plain:`Short for "character output." It's how your program prints things to the screen. Pair it with <code>&lt;&lt;</code> to send something to it.`},
  cin:         {term:'cin', cat:'Basics', plain:`Short for "character input." It reads whatever the user types and stores it in a variable, using <code>&gt;&gt;</code>.`},
  streamop:    {term:'Stream operators (<< / >>)', cat:'Basics', plain:`<code>&lt;&lt;</code> pushes a value toward the screen (into <code>cout</code>). <code>&gt;&gt;</code> pulls a typed value in from the keyboard (into <code>cin</code>). Think of the arrows as showing which way the data is flowing.`},
  operator:    {term:'Operator', cat:'Basics', plain:`A symbol that does something with values, like <code>+</code> to add or <code>==</code> to compare two things for equality.`},
  modulo:      {term:'Modulo (%)', cat:'Basics', plain:`Gives you the *remainder* after division, not the answer itself. <code>7 % 2</code> is <code>1</code>, because 7 divided by 2 leaves 1 left over. Handy for "is this number even?" (<code>n % 2 == 0</code>).`},
  compound:    {term:'Compound assignment', cat:'Basics', plain:`A shortcut for "update this variable based on itself." <code>x += 5;</code> means the same thing as <code>x = x + 5;</code> — just shorter to type.`},
  condition:   {term:'Condition', cat:'Control Flow', plain:`An expression that evaluates to <code>true</code> or <code>false</code>, like <code>score >= 90</code>. Code that runs "if" something decides whether to run based on a condition.`},
  ifelse:      {term:'if / else', cat:'Control Flow', plain:`A fork in the road for your code. <code>if</code> runs a block only when its condition is true; <code>else</code> is the fallback path when it isn't.`},
  logicalops:  {term:'&& and ||', cat:'Control Flow', plain:`Ways to combine multiple conditions. <code>&&</code> means "and" — both sides must be true. <code>||</code> means "or" — at least one side must be true.`},
  loop:        {term:'Loop', cat:'Control Flow', plain:`A block of code that repeats automatically instead of you copy-pasting it over and over.`},
  forloop:     {term:'for loop', cat:'Control Flow', plain:`A loop built for when you know roughly how many times you want to repeat something. It packs "start here," "keep going while this is true," and "do this after each round" into one line.`},
  whileloop:   {term:'while loop', cat:'Control Flow', plain:`A loop that keeps repeating for as long as its condition stays true — good for when you don't know the exact number of repeats ahead of time.`},
  func:        {term:'Function', cat:'Functions', plain:`A named, reusable chunk of code you write once and can run ("call") as many times as you want, from anywhere in your program.`},
  parameter:   {term:'Parameter', cat:'Functions', plain:`A placeholder input listed in a function's parentheses. Each time you call the function you can hand it different real values (called "arguments") to fill that placeholder.`},
  returnval:   {term:'return', cat:'Functions', plain:`Sends a value back out of a function to wherever it was called from, and immediately stops the function — nothing after <code>return</code> in that function runs.`},
  voidkw:      {term:'void', cat:'Functions', plain:`Used in place of a type when a function doesn't hand anything back — it just *does* something (like printing) rather than producing a value.`},
  scope:       {term:'Scope', cat:'Functions', plain:`Where a variable is "visible" and usable. A variable created inside a function only exists while that function is running, and disappears the moment it finishes.`},
  array:       {term:'Array', cat:'Data', plain:`A fixed-size row of values, all the same type, sitting next to each other in memory. You reach any one of them by its position.`},
  index:       {term:'Index', cat:'Data', plain:`The position of an item inside an array or vector. Counting starts at 0, so the first item is <code>arr[0]</code>, not <code>arr[1]</code>.`},
  vector:      {term:'vector', cat:'Data', plain:`Like an array, but it can grow or shrink while your program runs — you don't have to know the size in advance. Part of the STL.`},
  stl:         {term:'STL', cat:'Data', plain:`Short for "Standard Template Library" — a set of ready-made, reusable tools (like <code>vector</code>) that ship with C++ so you don't have to build them yourself.`},
  classkw:     {term:'Class', cat:'OOP', plain:`A blueprint you design that bundles related data and the actions that work on that data into one custom type. You define it once, then create as many objects from it as you need.`},
  object:      {term:'Object / Instance', cat:'OOP', plain:`A real, usable "thing" built from a class blueprint. Each object has its own separate copy of the data the class describes — two <code>Dog</code> objects can have two different names.`},
  member:      {term:'Member', cat:'OOP', plain:`A piece of data that lives inside a class — each object gets its own copy. In <code>class Dog { string name; }</code>, <code>name</code> is a member.`},
  method:      {term:'Method / Member function', cat:'OOP', plain:`A function that belongs to a class and can read or change that class's own data without needing it passed in as a parameter.`},
  constructor: {term:'Constructor', cat:'OOP', plain:`A special method that runs automatically the moment an object is created — normally used to set up its starting values.`},
  encapsulation:{term:'Encapsulation', cat:'OOP', plain:`The practice of hiding a class's internal data (marking it <code>private</code>) so outside code can't reach in and change it directly — it has to go through the class's own methods, which keeps the data trustworthy.`},
  accessmod:   {term:'public / private', cat:'OOP', plain:`Labels that control who can touch a class's members. <code>public</code> means any outside code can use it. <code>private</code> means only the class's own methods can.`},
  inheritance: {term:'Inheritance', cat:'OOP', plain:`Lets one class (the derived class) automatically get all the members and methods of another class (the base class), then add or change its own on top — models "is-a" relationships, like a Dog is an Animal.`},
  virtualfn:   {term:'virtual function', cat:'OOP', plain:`A method on a base class marked so that derived classes can replace ("override") it with their own version — and C++ will automatically use the derived version even when working through the base type.`},
  polymorphism:{term:'Polymorphism', cat:'OOP', plain:`The result of virtual functions: one piece of code written against a base type can trigger different, specific behavior depending on which derived object is actually being used.`},
  template:    {term:'Template', cat:'OOP', plain:`A way to write one function or class that works with any type, decided at the moment it's used — it's why <code>vector&lt;int&gt;</code> and <code>vector&lt;string&gt;</code> can share the exact same underlying code.`},
};

// Wraps display text in a hoverable/focusable glossary term span.
// g(key) -> uses the term's own label from GLOSSARY as the visible text.
// g(key, 'custom text') -> use custom visible text (e.g. plural, different wording).
function g(key, label){
  const entry = GLOSSARY[key];
  if(!entry) return label || key;
  return `<span class="jterm" tabindex="0" data-g="${key}">${label || entry.term}</span>`;
}

// One-line, high-contrast takeaway at the top of a concept card — the thing a
// reader should walk away with even if they never finish the paragraphs below.
function tldr(text){
  return `<div class="tldr"><span class="tldr-label">TL;DR</span>${text}</div>`;
}
// A row of small hoverable pills, for when a lesson introduces several sibling
// terms at once (e.g. int/double/string/bool). Pulling them out of the running
// prose into a scannable legend avoids stacking a wall of underlines into one
// sentence — same tooltip behavior, much less visual noise.
function chip(key, label){
  const entry = GLOSSARY[key];
  if(!entry) return label || key;
  return `<span class="term-chip jterm" tabindex="0" data-g="${key}">${label || entry.term}</span>`;
}
function chipRow(...keys){
  return `<div class="chip-row">${keys.map(k=>chip(k)).join('')}</div>`;
}

/* One shared floating tooltip element + event delegation, so lesson cards,
   the docs page, and anywhere else jterms show up all just work without any
   extra wiring per-view. Wired up once in boot(). */
function initGlossaryTooltip(){
  let tip = document.getElementById('glossary-tooltip');
  if(!tip){
    tip = document.createElement('div');
    tip.id = 'glossary-tooltip';
    document.body.appendChild(tip);
  }
  function showFor(el){
    const entry = GLOSSARY[el.getAttribute('data-g')];
    if(!entry) return;
    tip.innerHTML = `<span class="gt-term">${escapeHtml(entry.term)}</span>${entry.plain}`;
    const r = el.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(window.innerWidth-268, r.left)) + 'px';
    const above = r.top > 140;
    tip.style.top = above ? '' : (r.bottom+8)+'px';
    tip.style.bottom = above ? (window.innerHeight-r.top+8)+'px' : '';
    tip.classList.add('show');
  }
  function hide(){ tip.classList.remove('show'); }
  document.addEventListener('mouseover', e=>{ const el = e.target.closest('.jterm'); if(el) showFor(el); });
  document.addEventListener('mouseout', e=>{ const el = e.target.closest('.jterm'); if(el) hide(); });
  document.addEventListener('focusin', e=>{ const el = e.target.closest('.jterm'); if(el) showFor(el); });
  document.addEventListener('focusout', e=>{ const el = e.target.closest('.jterm'); if(el) hide(); });
  document.addEventListener('scroll', hide, true);
}

 {id:'basics', title:'C++ Basics', lessons:[

 {id:'control', title:'Control Flow', lessons:[
   {id:'control_1', title:'If / Else', tag:'ifelse',
    concept:`${tldr(`if runs code only when a condition is true; else catches everything that isn't.`)}
      <p>Most real programs need to make decisions — "if the score is high enough, print an A." That's what ${g('ifelse')} does: it asks a yes/no question (a ${g('condition')}, like <code>score >= 90</code>) and only runs its block when the answer is true.</p>
      <p>Stack more questions with <code>else if</code>, and catch "none of the above" with a plain <code>else</code> at the end.</p>
      <p>To check more than one thing at once, ${g('logicalops')} combine conditions — <code>&&</code> means both must be true, <code>||</code> means either one is enough.</p>`,
    example:`int score = 82;\n// check the highest bar first\nif (score >= 90) {\n  cout << "A" << endl;\n// only checked if the first condition was false\n} else if (score >= 80) {\n  cout << "B" << endl;\n// catches everything else\n} else {\n  cout << "C or lower" << endl;\n}`},
   {id:'control_2', title:'For Loops', tag:'forloop',
    concept:`${tldr(`A for loop repeats code a set number of times so you're not copy-pasting the same lines.`)}
      <p>Imagine having to copy-paste <code>cout << i << endl;</code> five times just to count from 1 to 5 — that's exactly the tedious problem a ${g('loop')} solves.</p>
      <p>A ${g('forloop')} is the version to reach for when you know roughly how many times you want to repeat something. It packs three things into one line — where to start, how long to keep going, and what to do after each round: <code>for(int i=0; i&lt;n; i++)</code>.</p>

    example:`// running total, starts at 0\nint total = 0;\n// start at 1, keep going while i <= 5, add 1 each lap\nfor (int i = 1; i <= 5; i++) {\n  // add this lap's i to the running total\n  total += i;\n}\ncout << total << endl;`},

      <p>That's what a ${g('whileloop')} is for: it keeps repeating for as long as its condition stays true, with no built-in counter. Compare that to a <strong>for loop</strong>, which is better suited when you *do* know the repeat count ahead of time.</p>`,
    example:`int n = 8;\nint count = 0;\n// keep going as long as n is still above 1\nwhile (n > 1) {\n  // integer division: 8/2=4, no decimals\n  n = n / 2;\n  count = count + 1;\n}\ncout << count << endl;`}

 {id:'functions', title:'Functions', lessons:[
   {id:'func_1', title:'Writing Functions', tag:'functions',
    concept:`${tldr(`A function is code you write once, name, and reuse by calling that name.`)}
      <p>If you find yourself wanting to run the same few lines of code from several places in your program, that's the signal to write a ${g('func','function')}: package that logic once, give it a name, and just call the name whenever you need it instead of retyping it.</p>
      <p>The type written before the function's name tells C++ what kind of value it hands back when it's done. If it doesn't hand anything back — it just *does* something, like printing — you write ${g('voidkw')} instead of a type.</p>`,
    example:`// defined once, outside main, so main can call it\nint square(int x) {\n  return x * x;\n}\n\nint main() {\n  // calling square(6) runs the code above with x = 6\n  cout << square(6) << endl;\n  return 0;\n}`},

    concept:`${tldr(`Parameters are a function's inputs; return sends a value back out and exits immediately.`)}
      <p>A function is more useful if it's not stuck doing the exact same thing every time. ${g('parameter')}s are placeholder inputs you list in the parentheses when you write the function — each time you call it, you can hand it different real values to fill those placeholders.</p>
      <p>When the function is done working, ${g('returnval','return')} sends a value back out to wherever it was called from, and immediately stops the function right there — nothing written after it in that function runs.</p>`,
    example:`int max2(int a, int b) {\n  // return exits immediately if this is true\n  if (a > b) return a;\n  // only reached if a was not bigger\n  return b;\n}\n\nint main() {\n  // 4 and 9 fill in a and b for this call\n  cout << max2(4, 9) << endl;\n  return 0;\n}`},
   {id:'func_3', title:'Function Scope', tag:'scope',
    concept:`${tldr(`Variables inside a function only exist while it's running — then they're gone.`)}
      <p>Every variable you create inside a function is only "alive" while that function is running — the moment it finishes and returns, those variables disappear, as if the function packed up and took its boxes with it. That lifespan-and-visibility rule is called ${g('scope')}.</p>
      <p>It's actually a feature, not a limitation: two different functions can both safely use a variable named <code>result</code> without ever colliding, because each function's variables are sealed off from the others.</p>`,
    example:`int addOne(int x) {\n  // result only exists inside this function\n  int result = x + 1;\n  return result;\n}\n\nint main() {\n  // result from above is already gone -- only the returned value survives\n  cout << addOne(9) << endl;\n  return 0;\n}`}
 ]},
 {id:'arrays', title:'Arrays & Strings', lessons:[
   {id:'arr_1', title:'Arrays', tag:'arrays',
    concept:`${tldr(`An array is a row of same-typed boxes you reach by position, counting starts at 0.`)}
      <p>A single variable holds one value. But what if you need to hold five test scores? You could make five separate variables — or use an ${g('array')}: one row of same-typed boxes, sitting right next to each other, that you access by position instead of by separate names.</p>
      <p>That position is called the ${g('index')}, and C++ always starts counting from 0 — so the *first* item is <code>arr[0]</code>, not <code>arr[1]</code>. That off-by-one habit trips up almost every beginner at least once, so it's worth remembering early.</p>`,
    example:`// 5 boxes in a row, indexes 0 through 4\nint scores[5] = {90, 85, 77, 88, 95};\nint sum = 0;\n// visit every index from 0 up to (not including) 5\nfor (int i = 0; i < 5; i++) {\n  // scores[i] is whichever score sits at position i\n  sum += scores[i];\n}\ncout << sum << endl;`},

      <p>Add something to the end with <code>push_back</code>, and check how many items are currently in it with <code>.size()</code>. It comes from the ${g('stl')}, a toolbox of ready-made helpers that ships with C++ so you're not rebuilding this yourself.</p>`,
    example:`// starts completely empty, no size decided yet\nvector<int> nums;\n// each push_back grows it by one\nnums.push_back(4);\nnums.push_back(9);\nnums.push_back(1);\n// how many items are in it right now\ncout << nums.size() << endl;\n// index 1 is the 2nd item -- that's 9, not 4\ncout << nums[1] << endl;`}
 ]},
 {id:'oop1', title:'OOP Basics', lessons:[
   {id:'oop1_1', title:'Classes & Objects', tag:'classes',
    concept:`${tldr(`A class is a blueprint; an object is a real, usable thing built from it.`)}
      <p>Everything so far has been building single, separate variables. A ${g('classkw','class')} lets you design your *own* type from scratch — a blueprint that bundles related data (its members) together with the actions that work on that data (its methods).</p>
      <p>Once you've written the blueprint, you can stamp out as many real, usable ${g('object','objects')} from it as you want — and each one gets its own separate copy of the data. Two <code>Dog</code> objects can each have a different <code>name</code> without stepping on each other.</p>`,
    example:`// the blueprint -- no dog exists yet, just the design\nclass Dog {\n  public:\n  // every Dog object gets its own name\n  string name;\n  // every Dog object can bark using its own name\n  void bark() {\n    cout << name << " says woof" << endl;\n  }\n};\n\nint main() {\n  // this actually builds a real Dog object from the blueprint\n  Dog d;\n  d.name = "Rex";\n  d.bark();\n  return 0;\n}`},
   {id:'oop1_2', title:'Constructors & Encapsulation', tag:'constructors',
    concept:`${tldr(`A constructor sets an object up when it's made; private hides its data from outside code.`)}
      <p>Rather than building an object and then manually setting each piece of data on it, a ${g('constructor')} runs automatically the instant an object is created — the natural place to set its starting values.</p>
      <p>Separately, good class design usually hides internal data behind ${g('accessmod','private')}, so nothing outside the class can reach in and change it directly. That practice is called ${g('encapsulation')} — it forces all changes to go through the class's own methods, which is what keeps something like an account balance from being set to an invalid value by mistake.</p>`,
    example:`class Account {\n  private:\n  // hidden -- nothing outside this class can touch balance directly\n  int balance;\n  public:\n  // runs automatically when an Account is created\n  Account(int start) {\n    balance = start;\n  }\n  // the only way outside code can read balance\n  int getBalance() {\n    return balance;\n  }\n};\n\nint main() {\n  // 100 goes straight into the constructor above\n  Account a(100);\n  cout << a.getBalance() << endl;\n  return 0;\n}`},
   {id:'oop1_3', title:'Member Functions', tag:'methods',
    concept:`${tldr(`A method can read and change its own object's data without needing it passed in.`)}
      <p>Because a ${g('method')} belongs to a specific class, it can read and change that object's own data directly. You never have to pass the object's own data in as a parameter to its own method — C++ already knows which object it's working on.</p>`,
    example:`class Counter {\n  public:\n  int value;\n  // sets the starting value the moment a Counter is made\n  Counter() {\n    value = 0;\n  }\n  // reads and changes this object's own value, no parameter needed\n  void increment() {\n    value = value + 1;\n  }\n};\n\nint main() {\n  Counter c;\n  // each call bumps c's own value by one\n  c.increment();\n  c.increment();\n  cout << c.value << endl;\n  return 0;\n}`}
 ]},
 {id:'oop2', title:'OOP Advanced', lessons:[
   {id:'oop2_1', title:'Inheritance', tag:'inheritance',
    concept:`${tldr(`Inheritance lets one class get everything another class has, for free, plus its own additions.`)}
      <p>Say you've already built an <code>Animal</code> class, and now you want a <code>Dog</code> class that has everything Animal has, plus a bit more. Instead of rewriting it all, ${g('inheritance')} lets <code>Dog</code> extend <code>Animal</code> with <code>: public Base</code>, automatically getting all of Animal's members and methods on top of whatever new ones you add.</p>
      <p>This models real "is-a" relationships — a Dog *is an* Animal.</p>`,
    example:`class Animal {\n  public:\n  string name;\n  void speak() {\n    cout << name << " makes a sound" << endl;\n  }\n};\n\n// Dog gets name and speak() for free from Animal, then adds bark()\nclass Dog : public Animal {\n  public:\n  void bark() {\n    cout << name << " barks" << endl;\n  }\n};`},
   {id:'oop2_2', title:'Polymorphism & Virtual Functions', tag:'polymorphism',
    concept:`${tldr(`virtual lets a derived class swap in its own version of a method — automatically.`)}
      <p>Normally, if code is written to work with an <code>Animal</code>, it only knows about Animal's version of each method — even if the actual object underneath is really a <code>Dog</code>. Marking a base method ${g('virtualfn','virtual')} changes that: derived classes can replace it with their own version, and C++ always uses *their* version, even when you're only holding onto the base type.</p>
      <p>The payoff is ${g('polymorphism')} — one line of code that behaves differently depending on what kind of object it's actually pointed at.</p>`,
    example:`class Shape {\n  public:\n  // virtual = "derived classes are allowed to replace this"\n  virtual double area() {\n    return 0;\n  }\n};\n\n// Circle replaces area() with its own real formula\nclass Circle : public Shape {\n  public:\n  double r;\n  double area() {\n    return 3.14 * r * r;\n  }\n};`},
   {id:'oop2_3', title:'Intro to Templates', tag:'templates',
    concept:`${tldr(`A template writes one function or class that works with any type.`)}
      <p>You've already used <code>vector&lt;int&gt;</code> and could just as easily use <code>vector&lt;string&gt;</code> — same behavior, different type inside. That's only possible because vector isn't written separately for every type; it's written *once* as a ${g('template')}, with the real type filled in later, whenever it's actually used: <code>template&lt;typename T&gt;</code>.</p>
      <p>You can write your own functions and classes the same way, so you're not duplicating the same logic for every type you might need it for.</p>`,
    example:`// T stands in for whatever type gets used later -- int, double, anything\ntemplate <typename T>\nT maxVal(T a, T b) {\n  if (a > b) return a;\n  return b;\n}`}
 ]}
];

function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
// weighted so easy/medium come up more often than hard, matching the feel of pickDifficulty()
function pickMachineDiff(){ return pick(['easy','easy','easy','medium','medium','hard']); }
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* =========================================================================
   STRUCTURAL CHECKS (shared by project checkpoints and machine problems)
   Both grading paths use identical per-chapter structural signals — the
   `mode` param ('project' | 'machine') only distinguishes the handful of
   spots where the two paths historically diverged on the 4th requirement.
   ========================================================================= */
const CHAPTER_STRUCTURAL_CHECKS = {
  basics: (code, result)=> [
    ['int','double','float','string','bool'].filter(t=>code.includes(t+' ')).length>=3,
    /cout\s*<<[^;]*<<[^;]*<</.test(code),
    /(\+=|-=|\*=|\/=|[a-zA-Z_]\w*\s*[+\-*/]\s*[a-zA-Z_0-9])/.test(code),
    result.success
  ],
  control: (code, result)=> [
    /\bif\s*\(/.test(code) && /\belse\b/.test(code),
    /\bfor\s*\(/.test(code) || /\bwhile\s*\(/.test(code),
    result.success && result.output.length>0,
    result.success
  ],
  functions: (code, result)=>{
    const fnCount = (code.match(/\b(int|double|float|bool|string|void)\s+\w+\s*\([^)]*\)\s*\{/g)||[]).filter(f=>!/main/.test(f)).length;
    return [ fnCount>=3, /return\s+\w/.test(code), /cout/.test(code) && fnCount>=1, result.success ];
  },
  arrays: (code, result, mode)=>{
    const hasArr = /\[\s*\d*\s*\]|vector</.test(code);
    const hasLoop = /\bfor\s*\(|\bwhile\s*\(/.test(code);
    const third = mode==='project' ? (/average|total|sum/i.test(code) || result.success) : (result.success && result.output.length>0);
    return [ hasArr, hasLoop, third, result.success ];
  },
  oop1: (code, result, mode)=>{
    const hasClass = /\bclass\s+\w+/.test(code);
    const hasPrivate = /\bprivate\s*:/.test(code);
    const methodCount = (code.match(/\b\w+\s*\([^)]*\)\s*\{/g)||[]).length;
    const fourth = mode==='project' ? (/\w+\s+\w+;\s*$/m.test(code) || result.success) : result.success;
    return [ hasClass, hasPrivate, methodCount>=3, fourth ];
  },
  oop2: (code, result, mode)=>{
    const hasVirtual = /\bvirtual\b/.test(code);
    const derivedCount = (code.match(/:\s*public\s+\w+/g)||[]).length;
    const fourth = mode==='project' ? (derivedCount>=1) : result.success;
    return [ /\bclass\s+\w+/.test(code), derivedCount>=2, hasVirtual, fourth ];
  }
};

/* =========================================================================
   TINY C++-SUBSET INTERPRETER  (transpile-to-JS, sandboxed)
   ========================================================================= */
function splitCoutChain(rhs){
  // split on << respecting quotes
  const parts=[]; let cur=''; let inStr=false; let strCh='';
  for(let i=0;i<rhs.length;i++){
    const c=rhs[i];
    if(inStr){ cur+=c; if(c===strCh && rhs[i-1]!=='\\\\') inStr=false; continue; }
    if(c==='"'||c==="'"){ inStr=true; strCh=c; cur+=c; continue; }
    if(c==='<' && rhs[i+1]==='<'){ parts.push(cur.trim()); cur=''; i++; continue; }
    cur+=c;
  }
  if(cur.trim()) parts.push(cur.trim());
  return parts;
}

function transpileClasses(src, classNamesOut){
  // find class blocks: class Name [: public Base] { ... };
  const classRe = /class\s+(\w+)\s*(?::\s*public\s+(\w+))?\s*\{/g;
  let m;
  let out = src;
  const classes = [];
  while((m = classRe.exec(src))){
    classes.push({name:m[1], base:m[2]||null, start:m.index, braceStart: src.indexOf('{', m.index)});
  }
  if(classNamesOut){ classes.forEach(c=>classNamesOut.push(c.name)); }
  if(classes.length===0) return src;
  // process each class block by finding matching closing brace
  classes.forEach(cls=>{
    let depth=0, i=cls.braceStart, end=-1;
    for(; i<src.length; i++){
      if(src[i]==='{') depth++;
      if(src[i]==='}'){ depth--; if(depth===0){ end=i; break; } }
    }
    cls.end = end;
    cls.body = src.slice(cls.braceStart+1, end);
  });
  // rebuild source, replacing each class block text with JS class
  // process in order of appearance, using string splice via offsets (process from last to first to keep indices valid)
  classes.sort((a,b)=>b.start-a.start);
  classes.forEach(cls=>{
    let body = cls.body;
    // collect field names (lines like "type name;" or "type name = expr;", not method defs)
    const fieldNames = [];
    const fieldDeclLines = [];
    body = body.replace(/(public|private|protected)\s*:/g, '');
    // extract member fields: lines matching TYPE NAME; or TYPE NAME = EXPR; (no parens)
    body = body.split('\n').map(line=>{
      const fm = line.match(/^\s*(int|double|float|long|short|bool|string|char)\s+(\w+)\s*(=\s*([^;]+))?;\s*$/);
      if(fm){
        fieldNames.push(fm[2]);
        const type = fm[1];
        const defVal = fm[4]!==undefined ? fm[4].trim() : (type==='string' ? '""' : type==='bool' ? 'false' : '0');
        const declLine = `  ${fm[2]} = ${defVal};`;
        fieldDeclLines.push(declLine);
        return declLine;
      }
      return line;
    }).join('\n');
    // constructor: MethodName(...) matching class name, possibly with : init list (e.g. ": Base(args)")
    body = body.replace(new RegExp(cls.name+"\\s*\\(([^)]*)\\)\\s*(:\\s*\\w+\\s*\\(([^)]*)\\))?\\s*\\{", 'g'), (full, params, initFull, initArgs)=>{
      const cleanParams = params.replace(/\b(int|double|float|long|short|bool|string|char)\s+/g,'');
      const superCall = cls.base ? `super(${initArgs!==undefined?initArgs:''}); ` : '';
      return `constructor(${cleanParams}) { ${superCall}`;
    });
    // base constructor call inside init list becomes ignored (best effort) - handled loosely
    // other methods: strip return type before name(
    body = body.replace(/\b(int|double|float|long|short|bool|string|char|void)\s+(\w+)\s*\(([^)]*)\)\s*\{/g, (full, ret, name, params)=>{
      const cleanParams = params.replace(/\b(int|double|float|long|short|bool|string|char)\s+/g,'');
      return `${name}(${cleanParams}) {`;
    });
    // virtual keyword cleanup
    body = body.replace(/\bvirtual\s+/g, '');
    // strip remaining type decls for local vars inside methods (handled later globally too)
    // protect field declaration lines with placeholders so the this-prefix pass below doesn't touch them
    const placeholders = [];
    fieldNames.forEach((f,idx)=>{
      const marker = `__FIELDDECL_${idx}__`;
      const line = fieldDeclLines[idx];
      placeholders.push({marker, line});
      body = body.replace(line, marker);
    });
    // prefix bare field refs with this. (declaration lines are protected above)
    fieldNames.forEach(f=>{
      const re = new RegExp('(?<!this\\.)(?<!\\w)'+f+'(?!\\w)', 'g');
      body = body.replace(re, `this.${f}`);
    });
    placeholders.forEach(p=>{ body = body.replace(p.marker, p.line); });
    const extend = cls.base ? ` extends ${cls.base}` : '';
    const hasOwnConstructor = /(^|\s)constructor\s*\(/.test(body);
    const needsAutoSuper = cls.base && !hasOwnConstructor;
    const jsClass = `class ${cls.name}${extend} {\n${needsAutoSuper?`constructor(...args){ super(...args); }\n`:''}${body}\n}`;
    out = out.slice(0, cls.start) + jsClass + out.slice(cls.end+2); // +2 skips "};"
  });
  return out;
}

function transpile(src){
  src = src.replace(/\/\*[\s\S]*?\*\//g,'');
  src = src.split('\n').filter(l=>!/^\s*\/\//.test(l)).join('\n');
  src = src.replace(/#include\s*<[^>]+>\s*;?/g,'');
  src = src.replace(/using\s+namespace\s+std\s*;/g,'');
  src = src.replace(/std::/g,'');

  const __classNames = [];
  src = transpileClasses(src, __classNames);

  // generic templates: `template <typename T>` (optionally multiple params) is dropped, and
  // T (or whatever name(s) were used) is folded into the same "this is a type keyword" list
  // as int/double/etc for the rest of transpile — a template type placeholder behaves exactly
  // like any other type token syntactically, JS just doesn't need it at all.
  const templateTypeParams = [];
  src = src.replace(/template\s*<\s*typename\s+(\w+)(?:\s*,\s*typename\s+(\w+))*\s*>\s*\n?/g, (full, t1, t2)=>{
    if(t1) templateTypeParams.push(t1);
    if(t2) templateTypeParams.push(t2);
    return '';
  });
  const TYPE_KW = ['int','double','float','long','short','bool','string','char','void', ...templateTypeParams].join('|');

  // custom class object instantiation: ClassName var; / ClassName var(args);
  __classNames.forEach(name=>{
    const reArgs = new RegExp('\\b'+name+'\\s+(\\w+)\\s*\\(([^)]*)\\)\\s*;', 'g');
    src = src.replace(reArgs, (full, varName, args)=> `let ${varName} = new ${name}(${args});`);
    const reNoArgs = new RegExp('\\b'+name+'\\s+(\\w+)\\s*;', 'g');
    src = src.replace(reNoArgs, (full, varName)=> `let ${varName} = new ${name}();`);
  });

  // vector<...> declarations
  src = src.replace(/vector<[^>]+>\s+(\w+)\s*\(\s*(\d+)\s*\)\s*;/g, 'let $1 = new Array($2).fill(0);');
  src = src.replace(/vector<[^>]+>\s+(\w+)\s*;/g, 'let $1 = [];');

  // array decl with initializer: int arr[5] = {1,2,3};
  src = src.replace(/\b(int|double|float|long|short|bool|char)\s+(\w+)\s*\[\s*\d*\s*\]\s*=\s*\{([^}]*)\}\s*;/g, 'let $2 = [$3];');
  // array decl without initializer
  src = src.replace(/\b(int|double|float|long|short|bool|char)\s+(\w+)\s*\[\s*(\d+)\s*\]\s*;/g, 'let $2 = new Array($3).fill(0);');

  // strip return type from free function defs (not already handled by class transpile)
  src = src.replace(new RegExp('\\b('+TYPE_KW+')\\s+(\\w+)\\s*\\(([^)]*)\\)\\s*\\{', 'g'), (full, ret, name, params)=>{
    if(name==='if'||name==='for'||name==='while'||name==='switch'||name==='main') return full;
    const cleanParams = params.replace(new RegExp('\\b('+TYPE_KW+')\\s+', 'g'),'');
    return `function ${name}(${cleanParams}) {`;
  });

  // plain variable decl+init: TYPE name = expr;
  src = src.replace(new RegExp('\\b('+TYPE_KW+'|auto)\\s+(\\w+)\\s*=\\s*', 'g'), 'let $2 = ');
  // plain variable decl no init
  src = src.replace(new RegExp('\\b('+TYPE_KW+')\\s+(\\w+)\\s*;', 'g'), 'let $2;');

  // cin >> x >> y;
  src = src.replace(/cin\s*((?:>>\s*\w+\s*)+);/g, (full, chain)=>{
    const vars = [...chain.matchAll(/>>\s*(\w+)/g)].map(m=>m[1]);
    return vars.map(v=>`${v} = __input();`).join(' ');
  });

  // cout << a << b << endl;
  src = src.replace(/cout\s*<<([^;]+);/g, (full, rhs)=>{
    const parts = splitCoutChain(rhs);
    const jsParts = parts.map(p=> p.trim()==='endl' ? `"\\n"` : p);
    return `__print(${jsParts.join(', ')});`;
  });

  src = src.replace(/\bnullptr\b/g,'null').replace(/\bNULL\b/g,'null');
  src = src.replace(/->/g, '.');

  // STL / string method shims
  src = src.replace(/\.push_back\s*\(/g, '.push(');
  src = src.replace(/\.size\s*\(\s*\)/g, '.length');
  src = src.replace(/\.length\s*\(\s*\)/g, '.length');

  // main function extraction: replace "int main() {" with just "{" marker, drop trailing return 0;
  src = src.replace(/int\s+main\s*\(\s*\)\s*\{/, '__MAIN_START__');
  // remove a trailing "return 0;" followed by final closing brace of main - best effort: remove all standalone return 0;
  src = src.replace(/return\s+0\s*;/g, '');

  if(src.includes('__MAIN_START__')){
    const idx = src.indexOf('__MAIN_START__');
    const before = src.slice(0, idx); // function/class defs
    let rest = src.slice(idx + '__MAIN_START__'.length);
    // find matching close brace for main
    let depth=1, i=0;
    for(; i<rest.length; i++){
      if(rest[i]==='{') depth++;
      if(rest[i]==='}'){ depth--; if(depth===0) break; }
    }
    const mainBody = rest.slice(0,i);
    const after = rest.slice(i+1);
    src = before + '\n' + mainBody + '\n' + after;
  }

  return src;
}

function runCppSubset(code, inputs){
  inputs = inputs || [];
  let inputIdx = 0;
  const output = [];
  const __print = (...vals)=>{ output.push(vals.map(v=> typeof v==='boolean' ? (v?'true':'false') : String(v)).join('')); };
  const __input = ()=> inputs[inputIdx++];

  let transpiled;
  try{
    transpiled = transpile(code);
  }catch(e){
    return {success:false, error:'Parse error: '+e.message, output:''};
  }

  try{
    const fn = new Function('__print','__input', transpiled);
    fn(__print, __input);
    return {success:true, output: output.join(''), error:null};
  }catch(e){
    return {success:false, error: e.message, output: output.join('')};
  }
}

/* =========================================================================
   MASTERY / XP LOGIC
   ========================================================================= */
function getMastery(tag){ return STATE.mastery[tag] || 0; }
function updateMastery(tag, delta){
  const cur = getMastery(tag);
  STATE.mastery[tag] = Math.max(0, Math.min(100, cur + delta));
  saveState();
}
function pickDifficulty(tag){
  const m = getMastery(tag);
  if(m < 35) return 'easy';
  if(m < 70) return 'medium';
  return 'hard';
}
function addXP(n){ STATE.xp += n; saveState(); }
function levelFromXP(xp){ return Math.floor(xp/100)+1; }

function allTags(){
  const tags = [];
  CHAPTERS.forEach(ch=>ch.lessons.forEach(l=>{ if(!tags.includes(l.tag)) tags.push(l.tag); }));
  return tags;
}
function overallMastery(){
  const tags = allTags();
  if(tags.length===0) return 0;
  const sum = tags.reduce((a,t)=>a+getMastery(t), 0);
  return Math.round(sum/tags.length);
}
// average of best-ever quiz scores across chapters that have been attempted at least once;
// null (not 0) when nothing has been attempted yet, so callers can skip the stat cleanly
function avgQuizScore(){
  const entries = Object.entries(STATE.quizBest||{}).filter(([,v])=>v!=null);
  if(!entries.length) return null;
  return Math.round(entries.reduce((a,[,v])=>a+v,0)/entries.length);
}
function masteryLabel(pct){
  if(pct>=90) return 'Mastered';
  if(pct>=70) return 'Advanced';
  if(pct>=35) return 'Building';
  if(pct>0) return 'Started';
  return 'Not started';
}

async function fetchLeaderboard(){
  const docs = await progressListAll();
  const rows = docs.map(({id, data:s})=>({
    name: s.displayName || 'learner',
    xp: s.xp||0,
    streak: s.streak||0,
    dailyStreak: s.dailyStreak||0,
    completedLessons: (s.completedLessons||[]).length,
    mastery: allTags().length ? Math.round(allTags().reduce((a,t)=>a+((s.mastery&&s.mastery[t])||0),0)/allTags().length) : 0
  }));
  rows.sort((a,b)=>b.xp-a.xp);
  return rows;
}

/* =========================================================================
   DAILY CHALLENGE  (deterministic per-day problem, Wordle-style)
   ========================================================================= */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function dateSeed(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
  return h;
}
function todayKey(){ return new Date().toISOString().slice(0,10); }

function ensureDailyChallenge(){
  const today = todayKey();
  if(STATE.dailyChallenge && STATE.dailyChallenge.date===today) return STATE.dailyChallenge;

  // only draw from topics the learner has actually seen, so day 1 doesn't throw OOP at a beginner
  const introduced = new Set();
  CHAPTERS.forEach(ch=>ch.lessons.forEach(l=>{
    if(STATE.completedLessons.includes(l.id) || STATE.attemptedLessons.includes(l.id)) introduced.add(l.tag);
  }));
  let pool = [...introduced].filter(t=>PROBLEM_GENERATORS[t]);
  if(pool.length===0) pool = ['variables'];

  const seed = dateSeed(today);
  const pickRand = mulberry32(seed);
  const tag = pool[Math.floor(pickRand()*pool.length)] || 'variables';
  const diff = pickDifficulty(tag);

  // swap in a seeded RNG so the generated numbers are identical for everyone all day, then restore
  const origRandom = Math.random;
  Math.random = mulberry32(seed + 7);
  let problem;
  try{
    const gens = PROBLEM_GENERATORS[tag];
    const gen = (gens && gens[diff]) ? gens[diff] : gens.easy;
    problem = gen();
  } finally {
    Math.random = origRandom;
  }

  // streak: did they complete yesterday's challenge? if not, the streak resets
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  const priorCompleted = STATE.dailyChallenge && STATE.dailyChallenge.completed && STATE.dailyChallenge.date===yesterday;
  if(!priorCompleted && STATE.lastDailyDate !== today) { /* streak continuation only counted on completion, see checkProblem */ }

  STATE.dailyChallenge = Object.assign({date:today, tag, diff, completed:false}, problem);
  saveState();
  return STATE.dailyChallenge;
}

function openDailyChallenge(){
  const dc = ensureDailyChallenge();
  CURRENT_PROBLEM = Object.assign({isDaily:true}, dc);
  goTo('daily', 'today');
}

/* =========================================================================
   RENDER HELPERS
   ========================================================================= */
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function highlightCode(code){
  // Single-pass tokenizer: match comments, strings, and keywords against the
  // ORIGINAL source text, then build the HTML output as we go. Doing this in
  // separate sequential .replace() passes (the old approach) is unsafe: once
  // a string like "Ada" gets wrapped as <span class="str">, a later pass
  // hunting for the keyword "class" will match the word "class" inside that
  // freshly-inserted HTML tag's attribute and wrap it again, corrupting the
  // markup (this was the bug producing literal `class="str">` text in lessons).
  const pattern = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|\b(int|double|float|bool|string|char|void|class|public|private|return|if|else|for|while|virtual|template|typename|const|true|false|long|short)\b|\b(cout|cin|endl|vector)\b/gm;
  let out = '';
  let lastIndex = 0;
  let m;
  while((m = pattern.exec(code))){
    out += escapeHtml(code.slice(lastIndex, m.index));
    if(m[1] !== undefined) out += `<span class="com">${escapeHtml(m[1])}</span>`;
    else if(m[2] !== undefined) out += `<span class="str">${escapeHtml(m[2])}</span>`;
    else if(m[3] !== undefined) out += `<span class="kw">${m[3]}</span>`;
    else if(m[4] !== undefined) out += `<span class="type">${m[4]}</span>`;
    lastIndex = pattern.lastIndex;
  }
  out += escapeHtml(code.slice(lastIndex));
  return out;
}

function lessonById(id){

/* Blueprint memory diagram */
function renderDiagram(vars){
  const entries = Object.entries(vars||{}).filter(([k,v])=> typeof v !== 'function' && !k.startsWith('__'));
  if(entries.length===0){
    return `<div class="diagram-wrap"><svg viewBox="0 0 400 60"><text x="10" y="34" fill="#5a7086" font-family="IBM Plex Mono" font-size="12">no variables captured yet — click Run</text></svg></div>`;
  }
  const boxW = 116, boxH = 54, gap = 14, perRow = 3;
  const rows = Math.ceil(entries.length/perRow);
  const svgH = rows*(boxH+gap)+20;
  let items = '';
  entries.forEach(([name,val],i)=>{
    const col = i % perRow, row = Math.floor(i/perRow);
    const x = 16 + col*(boxW+gap), y = 16 + row*(boxH+gap);
    let display = Array.isArray(val) ? '['+val.slice(0,4).join(',')+(val.length>4?',…':'')+']' : (typeof val==='object' && val!==null) ? '{object}' : String(val);
    if(display.length>16) display = display.slice(0,14)+'…';
    items += `
      <g>
        <rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="4" fill="none" stroke="#4FD1E8" stroke-width="1.2" stroke-dasharray="3,2"/>
        <line x1="${x}" y1="${y+20}" x2="${x+boxW}" y2="${y+20}" stroke="#1D3A54" stroke-width="1"/>
        <text x="${x+8}" y="${y+14}" fill="#4FD1E8" font-family="JetBrains Mono" font-size="10" font-weight="700">${escapeHtml(name)}</text>
        <text x="${x+8}" y="${y+38}" fill="#EDEFF2" font-family="IBM Plex Mono" font-size="12">${escapeHtml(display)}</text>
      </g>`;
  });
  return `<div class="diagram-wrap"><svg viewBox="0 0 400 ${svgH}" xmlns="http://www.w3.org/2000/svg">${items}</svg></div>`;
}
