<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PolyBro · HTML &amp; CSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#0B1D33;
  --panel:#0F2440;
  --panel-2:#122a4a;
  --grid:#1D3A54;
  --cyan:#4FD1E8;
  --cyan-dim:#2b6b78;
  --paper:#EDEFF2;
  --paper-dim:#9FB2C6;
  --amber:#F5A623;
  --green:#6FCF97;
  --red:#EF6F6C;
  --purple:#b78cf5;
  --purple-dim:#5f4d85;
  --pink:#f2789f;
  --pink-dim:#7a4257;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/32px 32px,
    var(--ink);
  background-blend-mode: normal, normal, normal;
  opacity:1;
  color:var(--paper);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background: radial-gradient(circle at 15% 10%, rgba(79,209,232,0.06), transparent 40%);
  pointer-events:none;
}
h1,h2,h3,.mono-head{font-family:'JetBrains Mono',monospace; letter-spacing:0.02em;}
code, textarea, .console, .plex{font-family:'IBM Plex Mono',monospace;}

::selection{background:var(--cyan);color:var(--ink);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--panel);}
::-webkit-scrollbar-thumb{background:var(--grid);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--cyan-dim);}

button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
button:focus-visible, [tabindex]:focus-visible, a:focus-visible, textarea:focus-visible{
  outline:2px solid var(--cyan); outline-offset:2px;
}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;min-height:100vh;}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;border-bottom:1px solid var(--grid);
  background:rgba(11,29,51,0.85);backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{
  width:30px;height:30px;border:1.5px solid var(--cyan);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:var(--cyan);
  font-family:'JetBrains Mono';font-weight:800;font-size:14px;
  box-shadow:0 0 14px rgba(79,209,232,0.25) inset;
}
.brand h1{font-size:16px;margin:0;font-weight:700;color:var(--paper);}
.brand .tag{font-size:11px;color:var(--paper-dim);font-family:'IBM Plex Mono';margin-top:-2px;}

.stats{display:flex;align-items:center;gap:18px;}
.stat{display:flex;flex-direction:column;align-items:flex-end;}
.stat .v{font-family:'JetBrains Mono';font-weight:700;font-size:15px;color:var(--cyan);}
.stat .l{font-size:10px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.08em;}
.xpbar{width:120px;height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin-top:4px;}
.xpbar > div{height:100%;background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));}

.focusbtn{
  background:transparent;border:1px solid var(--grid);color:var(--paper-dim);
  padding:7px 12px;border-radius:6px;font-size:12px;font-family:'IBM Plex Mono';
}
.focusbtn:hover{border-color:var(--cyan);color:var(--cyan);}
.focusbtn.on{border-color:var(--amber);color:var(--amber);}

.layout{flex:1;display:grid;grid-template-columns:270px 1fr 300px;gap:0;min-height:0;}
.layout.focus{grid-template-columns:0px 1fr 0px;}
.layout.focus .sidepanel, .layout.focus .mentorpanel{display:none;}

/* ---------- side panel (skill tree) ---------- */
.sidepanel{
  border-right:1px solid var(--grid);padding:18px 14px;overflow-y:auto;
  max-height:calc(100vh - 63px);
}
.sidepanel h2{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--paper-dim);margin:4px 0 14px 2px;}
.chapter{margin-bottom:6px;}
.chapter-head{
  display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:6px;cursor:pointer;
  color:var(--paper);font-size:13px;font-weight:600;
}
.chapter-head:hover{background:var(--panel-2);}
.chapter-head .idx{
  width:20px;height:20px;border-radius:4px;border:1px solid var(--grid);
  display:flex;align-items:center;justify-content:center;font-size:10px;
  font-family:'JetBrains Mono';color:var(--paper-dim);flex-shrink:0;
}
.chapter-head.done .idx{border-color:var(--green);color:var(--green);}
.chapter-body{padding-left:26px;border-left:1px dashed var(--grid);margin-left:9px;}
.lesson-node{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;
  font-size:12.5px;color:var(--paper-dim);position:relative;
}
.lesson-node:hover{background:var(--panel-2);color:var(--paper);}
.lesson-node.active{background:rgba(79,209,232,0.12);color:var(--cyan);}
.lesson-node .dot{width:8px;height:8px;border-radius:50%;background:var(--grid);flex-shrink:0;}
.lesson-node.complete .dot{background:var(--green);}
.lesson-node.inprogress .dot{background:var(--amber);}
.project-node{
  display:flex;align-items:center;gap:8px;padding:7px 8px;margin:6px 0 10px;border-radius:5px;cursor:pointer;
  font-size:12px;color:var(--amber);border:1px dashed var(--cyan-dim);
}
.project-node:hover{background:rgba(245,166,35,0.08);}
.project-node.done{color:var(--green);border-color:var(--green);}
.project-node .dot{width:8px;height:8px;transform:rotate(45deg);background:var(--amber);flex-shrink:0;}
.project-node.done .dot{background:var(--green);}
.recap-node{
  display:flex;align-items:center;gap:8px;padding:6px 8px;margin:2px 0 8px;border-radius:5px;cursor:pointer;
  font-size:12px;color:var(--cyan);
}
.recap-node:hover{background:rgba(79,209,232,0.08);}
.recap-node.active{background:rgba(79,209,232,0.12);}
.recap-node .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--cyan);background:transparent;flex-shrink:0;}
.quiz-node{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;margin:2px 0 8px;border-radius:5px;cursor:pointer;
  font-size:12px;color:var(--pink);
}
.quiz-node:hover{background:rgba(242,120,159,0.08);}
.quiz-node.active{background:rgba(242,120,159,0.12);}
.quiz-node .left{display:flex;align-items:center;gap:8px;}
.quiz-node .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--pink);background:transparent;flex-shrink:0;}
.quiz-node .best{font-family:'IBM Plex Mono';font-size:10px;color:var(--paper-dim);}

/* ---------- main panel ---------- */
.mainpanel{padding:26px 34px;overflow-y:auto;max-height:calc(100vh - 63px);}
.crumbs{font-size:11px;color:var(--paper-dim);font-family:'IBM Plex Mono';margin-bottom:10px;text-transform:uppercase;letter-spacing:0.06em;}
.crumbs .cyan{color:var(--cyan);}
.view h2.title{font-size:26px;margin:0 0 4px;color:var(--paper);}
.badge{
  display:inline-block;font-size:10px;font-family:'IBM Plex Mono';padding:3px 8px;border-radius:20px;
  border:1px solid var(--grid);color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.06em;margin-right:6px;
}
.badge.easy{border-color:var(--green);color:var(--green);}
.badge.medium{border-color:var(--amber);color:var(--amber);}
.badge.hard{border-color:var(--red);color:var(--red);}

.card{
  background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:20px;margin:16px 0;
  position:relative;
}
.card::before{
  content:attr(data-tag);position:absolute;top:-9px;left:14px;background:var(--ink);
  padding:0 6px;font-size:10px;font-family:'IBM Plex Mono';color:var(--cyan);letter-spacing:0.08em;text-transform:uppercase;
}
.prose{font-size:14.5px;line-height:1.7;color:var(--paper);}
.prose p{margin:0 0 12px;}
.prose strong{color:var(--cyan);}

pre.codeblock{
  background:#081625;border:1px solid var(--grid);border-radius:8px;padding:14px 16px;
  font-size:13px;line-height:1.6;overflow-x:auto;color:#cfe8ee;
}
.kw{color:#f5a623;}.str{color:#6fcf97;}.com{color:#5a7086;}.type{color:#4fd1e8;}

.editorwrap{border:1px solid var(--grid);border-radius:8px;overflow:hidden;margin-top:10px;}
.editorbar{
  display:flex;justify-content:space-between;align-items:center;background:var(--panel-2);
  padding:8px 12px;font-size:11px;color:var(--paper-dim);font-family:'IBM Plex Mono';
}
textarea.editor{
  width:100%;min-height:180px;background:#081625;color:#e6f2f5;border:none;padding:14px 16px;
  font-size:13px;line-height:1.6;resize:vertical;
}
textarea.editor:focus{outline:none;}

.btnrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.btn{
  padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;font-family:'IBM Plex Mono';
  border:1px solid var(--grid);background:var(--panel-2);color:var(--paper);
}
.btn:hover{border-color:var(--cyan);color:var(--cyan);}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#04141f;}
.btn.primary:hover{background:#6fe0f2;color:#04141f;}
.btn.ghost{background:transparent;}
.btn.amber{border-color:var(--amber);color:var(--amber);}
.btn.amber:hover{background:rgba(245,166,35,0.1);}
.btn.google{background:#fff;border-color:#fff;color:#3c4043;display:flex;align-items:center;gap:8px;}
.btn.google:hover{background:#f1f3f4;color:#3c4043;border-color:#f1f3f4;}
.btn.google svg{flex-shrink:0;}
.auth-toggle{font-size:11.5px;color:var(--cyan);cursor:pointer;margin-top:14px;text-decoration:underline;text-underline-offset:2px;}
.auth-toggle:hover{color:#6fe0f2;}
.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:10.5px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.06em;}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--grid);}
.auth-error{font-size:11.5px;color:var(--red);margin-top:8px;line-height:1.5;text-align:left;min-height:0;}

.modal-overlay{position:fixed;inset:0;background:rgba(6,14,26,0.72);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-card{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:22px 24px;width:320px;position:relative;}
.modal-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;border-radius:12px 12px 0 0;background:linear-gradient(90deg,var(--amber),var(--red));}
.modal-card h3{margin:0 0 8px;font-size:16px;color:var(--paper);}
.modal-card p{margin:0 0 6px;font-size:13px;color:var(--paper-dim);line-height:1.5;}

.console{
  background:#050d17;border:1px solid var(--grid);border-radius:8px;padding:12px 14px;margin-top:10px;
  font-size:12.5px;color:#9fe6b8;min-height:44px;white-space:pre-wrap;
}
.console.err{color:var(--red);}
.console.htmlpreview{
  background:#ffffff;padding:0;min-height:180px;height:220px;white-space:normal;overflow:hidden;
}
.console.htmlpreview.err{border-color:var(--red);}
iframe.console{display:block;width:100%;box-sizing:border-box;}
.feedback{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:13px;border:1px solid;}
.feedback.pass{background:rgba(111,207,151,0.08);border-color:var(--green);color:var(--green);}
.feedback.fail{background:rgba(239,111,108,0.08);border-color:var(--red);color:var(--red);}

.checklist{list-style:none;padding:0;margin:10px 0;}
.checklist li{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:5px 0;color:var(--paper-dim);}
.checklist li.ok{color:var(--green);}
.checklist li .mark{font-family:'JetBrains Mono';width:16px;flex-shrink:0;}

.diagram-wrap{background:#081625;border:1px solid var(--grid);border-radius:8px;padding:10px;margin-top:12px;}
.diagram-wrap svg{width:100%;height:auto;display:block;}

/* ---------- mentor panel ---------- */
.mentorpanel{border-left:1px solid var(--grid);padding:18px 16px;overflow-y:auto;max-height:calc(100vh - 63px);}
.mentor-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.mentor-avatar{
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--cyan);
  display:flex;align-items:center;justify-content:center;background:var(--panel-2);flex-shrink:0;
}
.mentor-head h3{margin:0;font-size:13px;color:var(--paper);}
.mentor-head .sub{font-size:10.5px;color:var(--paper-dim);font-family:'IBM Plex Mono';}
.hint-card{
  background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:12px 14px;margin-bottom:10px;
  font-size:12.5px;line-height:1.55;color:var(--paper);
}
.hint-card .n{color:var(--cyan);font-family:'JetBrains Mono';font-size:10px;margin-bottom:5px;display:block;}
.mentor-empty{font-size:12px;color:var(--paper-dim);line-height:1.6;}
.streaknote{
  margin-top:18px;padding:12px;border:1px dashed var(--grid);border-radius:8px;font-size:11.5px;color:var(--paper-dim);
}
.streaknote b{color:var(--amber);}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;}
  .sidepanel,.mentorpanel{max-height:280px;border-right:none;border-bottom:1px solid var(--grid);}
  .mainpanel{max-height:none;}
}

/* ---------- landing page ---------- */
.landing{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;position:relative;
}
.landing-mark{
  width:64px;height:64px;border-radius:14px;border:1.5px solid var(--cyan);
  display:flex;align-items:center;justify-content:center;background:var(--panel-2);
  font-family:'JetBrains Mono';font-weight:800;font-size:26px;color:var(--cyan);
  margin:0 auto 18px;box-shadow:0 0 24px rgba(79,209,232,0.15);
}
.landing h1{font-size:34px;margin:0 0 8px;color:var(--paper);letter-spacing:0.01em;}
.landing .sub{font-size:14px;color:var(--paper-dim);max-width:480px;margin:0 auto 36px;line-height:1.6;}
.landing-grid{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:780px;margin:0 auto;}
.landing-card{
  background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:22px 24px;
  width:300px;text-align:left;position:relative;overflow:hidden;
}
.landing-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--cyan),transparent);
}
.landing-card.amber::before{background:linear-gradient(90deg,var(--amber),transparent);}
.landing-card h3{margin:0 0 6px;font-size:15px;color:var(--paper);font-family:'JetBrains Mono';}
.landing-card p{margin:0 0 16px;font-size:12.5px;color:var(--paper-dim);line-height:1.6;}
.landing-card .btn{width:100%;justify-content:center;}
.landing-stats{display:flex;gap:24px;margin-top:34px;flex-wrap:wrap;justify-content:center;}
.landing-stats .stat{align-items:center;}
.landing-foot{margin-top:38px;font-size:11px;color:var(--paper-dim);font-family:'IBM Plex Mono';letter-spacing:0.04em;}
.brand.clickable{cursor:pointer;}
.brand.clickable:hover .mark{border-color:var(--cyan);box-shadow:0 0 12px rgba(79,209,232,0.3);}

/* ---------- login screen ---------- */
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.login-card{
  background:var(--panel);border:1px solid var(--grid);border-radius:14px;padding:36px 34px;
  width:380px;text-align:center;position:relative;overflow:hidden;
}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--amber));}
.login-card input{
  width:100%;box-sizing:border-box;background:var(--ink);border:1px solid var(--grid);border-radius:8px;
  padding:11px 14px;color:var(--paper);font-family:'Inter';font-size:14px;margin:18px 0 6px;
}
.login-card input:focus{outline:none;border-color:var(--cyan);}
.login-note{font-size:11px;color:var(--paper-dim);line-height:1.6;margin-bottom:16px;}
.login-classmates{margin-top:22px;padding-top:18px;border-top:1px dashed var(--grid);}
.login-classmates .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--paper-dim);margin-bottom:10px;}
.avatar-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.mini-avatar{
  width:26px;height:26px;border-radius:50%;background:var(--panel-2);border:1px solid var(--grid);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--cyan);font-family:'JetBrains Mono';font-weight:700;
}

/* ---------- dashboard shell ---------- */
.dash-shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.dash-nav{border-right:1px solid var(--grid);padding:18px 14px;display:flex;flex-direction:column;}
.dash-profile{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--panel-2);
  cursor:pointer;margin-bottom:18px;
}
.dash-profile:hover{border:1px solid var(--cyan);}
.dash-profile .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--amber));flex-shrink:0;}
.dash-profile span{font-size:12.5px;color:var(--paper);font-family:'JetBrains Mono';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dash-navitem{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--paper-dim);
  font-size:13px;cursor:pointer;margin-bottom:2px;
}
.dash-navitem:hover{background:var(--panel-2);color:var(--paper);}
.dash-navitem.active{background:rgba(79,209,232,0.1);color:var(--cyan);}
.dash-nav-section{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--paper-dim);margin:16px 0 6px 10px;}
.dash-nav-foot{margin-top:auto;padding-top:14px;}
.dash-main{padding:30px 40px;overflow-y:auto;max-height:100vh;}
.dash-search{
  width:100%;max-width:520px;background:var(--panel);border:1px solid var(--grid);border-radius:9px;
  padding:11px 16px;color:var(--paper-dim);font-size:13.5px;margin-bottom:28px;display:flex;align-items:center;gap:8px;
}
.dash-search input{flex:1;background:transparent;border:none;outline:none;color:var(--paper);font-family:'Inter';font-size:13.5px;}
.dash-header h1{font-size:30px;margin:0 0 6px;color:var(--paper);}
.dash-header .sub{font-size:13.5px;color:var(--paper-dim);margin-bottom:22px;}
.mastery-hero{
  background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:18px 22px;margin-bottom:26px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.mastery-hero .ring{
  width:64px;height:64px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono';font-weight:700;font-size:14px;color:var(--cyan);
  background:conic-gradient(var(--cyan) calc(var(--pct)*1%), var(--grid) 0);
}
.mastery-hero .ring::before{content:"";position:absolute;}
.mastery-hero .ring-inner{
  width:50px;height:50px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;
}
.mastery-hero .txt{flex:1;min-width:200px;}
.mastery-hero .txt h4{margin:0 0 4px;font-size:13px;color:var(--paper);}
.mastery-hero .txt p{margin:0;font-size:11.5px;color:var(--paper-dim);}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--grid);margin-bottom:20px;}
.tab{
  padding:8px 2px 12px;font-size:13px;color:var(--paper-dim);cursor:pointer;border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:6px;
}
.tab .n{background:var(--panel-2);border-radius:10px;padding:1px 7px;font-size:10.5px;font-family:'JetBrains Mono';}
.tab.active{color:var(--paper);border-bottom-color:var(--cyan);}
.dash-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
.dash-card{
  background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:18px 20px;cursor:pointer;
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
.dash-card:hover{border-color:var(--cyan);}
.dash-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),transparent);}
.dash-card.done::before{background:linear-gradient(90deg,var(--green),transparent);}
.dash-card .toprow{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}

<body>
<div id="app"></div>

<script>
/* =========================================================================
   FIREBASE AUTH (placeholder — fill in FIREBASE_CONFIG to enable)
   =========================================================================
   Leave FIREBASE_CONFIG empty and the app runs exactly as it does today: a
   typed display name, no password, progress keyed by that name in shared
   storage. Paste in a real Firebase project's config object (Project
   settings → your app → SDK setup and configuration) and the login screen
   switches automatically to real email/password accounts + Google sign-in,
   with progress keyed by the authenticated user's UID instead of a typed
   name.

   Note on Google sign-in: this app runs inside a sandboxed iframe when
   previewed in claude.ai. Google's OAuth popup/redirect flow is commonly
   blocked by browsers or by Google itself inside sandboxed third-party
   iframes — that's outside this app's control. Email/password will work
   fine in-preview; Google sign-in is most likely to work once this file is
   downloaded and opened directly, or hosted somewhere with a real origin.
*/
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC--D4VKQf07rPkFTeUw9p01YVWMy6DtWs",
  authDomain: "cppbro-23.firebaseapp.com",
  projectId: "cppbro-23",
  storageBucket: "cppbro-23.firebasestorage.app",
  messagingSenderId: "662822687783",
  appId: "1:662822687783:web:a40751e3b964397cb16a02"
};
const FIREBASE_ENABLED = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);

let firebaseActive = false;     // true only once the SDK has actually loaded + initialized
let fbAuth = null;
let fbDb = null;                // Firestore instance — the actual persistence backend once hosted for real
let fbUser = null;
let authMode = 'signin';        // 'signin' | 'signup', login-screen toggle
let pendingSignupName = null;   // set during sign-up so the stale pre-updateProfile onAuthStateChanged fire is ignored

function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('failed to load '+src));
    document.head.appendChild(s);
  });
}
// resolves true once check() passes, false if timeoutMs elapses first — used because
// the script's onload firing doesn't guarantee window.firebase is fully attached yet
function waitFor(check, timeoutMs, intervalMs){
  return new Promise(resolve=>{
    const start = Date.now();
    (function poll(){
      if(check()) return resolve(true);
      if(Date.now()-start >= timeoutMs) return resolve(false);
      setTimeout(poll, intervalMs);
    })();
  });
}

async function initFirebase(){
  if(!FIREBASE_ENABLED) return false;
  try{
    await Promise.all([
      loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'),
      loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js'),
      loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js')
    ]);
    const ready = await waitFor(()=>window.firebase && window.firebase.auth && window.firebase.firestore, 6000, 50);
    if(!ready) throw new Error('Firebase SDK did not become ready in time');
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    return true;
  }catch(e){
    console.warn('Firebase unavailable — falling back to name-only login.', e);
    return false;
  }
}

/* Firestore is the real persistence backend — one document per learner at
   progress/{uid}, holding the STATE object directly (no JSON-string wrapping
   needed; Firestore stores nested objects/arrays natively). */
async function progressGet(uid){
  if(!fbDb) return null;
  try{
    const doc = await fbDb.collection('progress_htmlcss').doc(uid).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ console.warn('progress read failed', e); return null; }
}
async function progressSet(uid, stateObj){
  if(!fbDb) return;
  try{
    await fbDb.collection('progress_htmlcss').doc(uid).set(stateObj);
    await leaderboardSync(uid, stateObj);
  }catch(e){ console.warn('progress save failed', e); }
}
// Denormalized public snapshot for the Leaderboard screen — only the fields
// that screen actually displays. Own collection (leaderboard_htmlcss), same
// track-separation pattern as progress_htmlcss, so this track's board never
// mixes with the cpp track's. Keeps the leaderboard working without any
// learner needing read access to another learner's full progress doc (see
// firestore.rules: progress_htmlcss/{uid} list is admin-only,
// leaderboard_htmlcss/{uid} is readable by any signed-in learner).
async function leaderboardSync(uid, stateObj){
  if(!fbDb) return;
  try{
    await fbDb.collection('leaderboard_htmlcss').doc(uid).set({
      name: stateObj.displayName || 'learner',
      xp: stateObj.xp || 0,
      streak: stateObj.streak || 0,
      dailyStreak: stateObj.dailyStreak || 0,
      completedLessons: (stateObj.completedLessons||[]).length,
      mastery: allTags().length ? Math.round(allTags().reduce((a,t)=>a+((stateObj.mastery&&stateObj.mastery[t])||0),0)/allTags().length) : 0
    });
  }catch(e){ console.warn('leaderboard sync failed', e); }
}

async function loginWithFirebaseUser(user, displayNameOverride){
  fbUser = user;
  const name = displayNameOverride || user.displayName || (user.email ? user.email.split('@')[0] : 'learner');
  currentUser = name;
  activeStorageKey = user.uid; // Firestore doc id
  const data = await progressGet(activeStorageKey);
  STATE = data ? Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), data) : JSON.parse(JSON.stringify(DEFAULT_STATE));
  STATE.displayName = name;
  touchStreak();
  await flushSave();
  appScreen = 'dashboard';
  render();
}

function friendlyAuthError(e){
  const code = (e && e.code) || '';
  if(code.includes('email-already-in-use')) return 'That email already has an account — try signing in instead.';
  if(code.includes('weak-password')) return 'Password should be at least 6 characters.';
  if(code.includes('invalid-email')) return "That email address doesn't look right.";
  if(code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'Email or password is incorrect.';
  if(code.includes('popup-blocked') || code.includes('popup-closed') || code.includes('cancelled-popup-request')) return 'Google sign-in was closed or blocked before finishing.';
  if(code.includes('network-request-failed')) return "Couldn't reach the auth server — check your connection.";
  return (e && e.message) ? e.message : 'Something went wrong — try again.';
}

async function signUpEmail(email, password, displayName){
  const errEl = document.getElementById('auth-error');
  if(errEl) errEl.textContent = '';
  try{
    pendingSignupName = displayName || email.split('@')[0];
    const cred = await fbAuth.createUserWithEmailAndPassword(email, password);
    await cred.user.updateProfile({ displayName: pendingSignupName });
    // updateProfile has now resolved, so cred.user carries the confirmed name — log in
    // explicitly rather than waiting on onAuthStateChanged, which already fired once
    // with the pre-update (nameless) user object and is suppressed while this is set.
    const confirmedName = pendingSignupName;
    pendingSignupName = null;
    await loginWithFirebaseUser(cred.user, confirmedName);
  }catch(e){
    pendingSignupName = null;
    if(errEl) errEl.textContent = friendlyAuthError(e);
  }
}
async function signInEmail(email, password){
  const errEl = document.getElementById('auth-error');
  if(errEl) errEl.textContent = '';
  try{
    await fbAuth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged picks this up and logs in — no pending name involved here
  }catch(e){
    if(errEl) errEl.textContent = friendlyAuthError(e);
  }
}
async function signInGoogle(){
  const errEl = document.getElementById('auth-error');
  if(errEl) errEl.textContent = '';
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await fbAuth.signInWithPopup(provider);
  }catch(e){
    if(errEl) errEl.textContent = friendlyAuthError(e) + ' (Google sign-in often fails in a sandboxed preview — try email/password here, or open this file directly in a browser once downloaded.)';
  }
}
async function signOutFirebase(){
  try{ await flushSave(); }catch(e){}
  try{ await fbAuth.signOut(); }catch(e){}
  // onAuthStateChanged's signed-out branch resets state and renders the login screen
}

function toggleAuthMode(){
  authMode = authMode==='signin' ? 'signup' : 'signin';
  render();
}
function submitAuth(){
  const email = ((document.getElementById('auth-email')||{}).value||'').trim();
  const password = (document.getElementById('auth-password')||{}).value||'';
  const errEl = document.getElementById('auth-error');
  if(!email || !password){ if(errEl) errEl.textContent = 'Enter an email and password.'; return; }
  if(authMode==='signup'){
    const nameEl = document.getElementById('auth-name');
    const name = sanitizeUsername(nameEl ? nameEl.value : '') || email.split('@')[0];
    signUpEmail(email, password, name);
  } else {
    signInEmail(email, password);
  }
}

/* =========================================================================
   PERSISTENCE
   ========================================================================= */
const DEFAULT_STATE = { xp:0, streak:0, lastActiveDate:null, mastery:{}, completedLessons:[], completedProjects:[], attemptedLessons:[], currentView:{type:'lesson', id:'basics_1'}, hintIndex:{}, dailyChallenge:null, dailyStreak:0, lastDailyDate:null, recent:[], displayName:null, machineSolved:0, quizBest:{} };
let STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
let appScreen = 'login'; // 'login' | 'dashboard' | 'mastery' | 'leaderboard' | 'app'
let currentUser = null; // sanitized username string once logged in (typed name, or Firebase display name)
let activeStorageKey = null; // storage key backing the current session — name-based or fbUserKey(uid)

function sanitizeUsername(name){
  return (name||'').trim().slice(0,20).replace(/[^a-zA-Z0-9_\- ]/g,'').trim().replace(/\s+/g,' ');
}

async function boot(){
  initGlossaryTooltip();
  if(FIREBASE_ENABLED){
    const app = document.getElementById('app');
    if(app) app.innerHTML = renderAuthLoadingScreen();
    firebaseActive = await initFirebase();
    if(firebaseActive){
      fbAuth.onAuthStateChanged(async (user)=>{
        if(user){
          if(pendingSignupName) return; // stale pre-updateProfile fire during sign-up — signUpEmail logs in explicitly once the name is confirmed
          await loginWithFirebaseUser(user);
        } else {
          fbUser = null; currentUser = null; activeStorageKey = null;
          STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
          appScreen = 'login';
          render();
        }
      });
      return; // onAuthStateChanged renders the first screen once Firebase reports auth state
    }
    // Firebase configured but failed to load (offline, blocked domain, bad config) — fall through to name-only mode below
  }
  appScreen = 'login';
  render();
}

// Reached only when Firebase isn't configured/available at all. There's no real backend
// in this mode — progress lives in memory for the session only and won't survive a reload.
async function loginAs(name){
  const clean = sanitizeUsername(name);
  if(!clean) return;
  currentUser = clean;
  activeStorageKey = null;
  STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
  STATE.displayName = clean;
  touchStreak();
  appScreen = 'dashboard';
  render();
}

async function flushSave(){
  if(!activeStorageKey) return;
  clearTimeout(saveTimer);
  await progressSet(activeStorageKey, STATE);
}

function requestLogout(){
  showLogoutModal();
}
async function confirmLogout(){
  hideLogoutModal();
  if(firebaseActive) { await signOutFirebase(); return; }
  currentUser = null;
  activeStorageKey = null;
  STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
  appScreen = 'login';
  render();
}
function showLogoutModal(){
  if(document.getElementById('logout-modal-overlay')) return;
  const el = document.createElement('div');
  el.id = 'logout-modal-overlay';
  el.className = 'modal-overlay';
  el.innerHTML = `
    <div class="modal-card">
      <h3>Log out?</h3>
      <p>You'll need to sign back in to see your progress again.</p>
      <div class="btnrow" style="justify-content:flex-end;">
        <button class="btn" onclick="hideLogoutModal()">Cancel</button>
        <button class="btn amber" onclick="confirmLogout()">Log out</button>
      </div>
    </div>
  `;
  document.body.appendChild(el);
}
function hideLogoutModal(){
  const el = document.getElementById('logout-modal-overlay');
  if(el) el.remove();
}

let saveTimer=null;
function saveState(){
  if(!activeStorageKey) return;
  const key = activeStorageKey;      // snapshot now — not whatever activeStorageKey is 250ms from now
  const snapshot = JSON.parse(JSON.stringify(STATE));
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ progressSet(key, snapshot); }, 250);
}
function touchStreak(){
  // migrate old toDateString()-format values (e.g. "Thu Aug 06 2026") from before
  // this used a shared UTC-based todayKey(), so upgrading doesn't spuriously reset streaks
  if(STATE.lastActiveDate && !/^\d{4}-\d{2}-\d{2}$/.test(STATE.lastActiveDate)){
    const parsed = new Date(STATE.lastActiveDate);
    if(!isNaN(parsed)) STATE.lastActiveDate = parsed.toISOString().slice(0,10);
  }
  const today = todayKey();
  if(STATE.lastActiveDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  if(STATE.lastActiveDate === yesterday){ STATE.streak += 1; } else { STATE.streak = 1; }
  STATE.lastActiveDate = today;
  saveState();
}

/* =========================================================================
   GLOSSARY — every piece of jargon used anywhere in a lesson gets an entry
   here. Lesson text wraps the word in <span class="jterm" data-g="KEY"> and
   the hover/focus tooltip (wired up in initGlossaryTooltip) pulls the
   definition from this object. The dedicated Documentation page also reads
   straight from here, grouped by `cat`, so there's exactly one place to
   update a definition.
   ========================================================================= */
const GLOSSARY = {
  element:     {term:'Element', cat:'HTML Basics', plain:`A single building block of a web page — a heading, a paragraph, a link. Most elements are written as an opening tag, some content, and a closing tag: <code>&lt;p&gt;text&lt;/p&gt;</code>.`},
  tag:         {term:'Tag', cat:'HTML Basics', plain:`The angle-bracket markers that create an element, like <code>&lt;h1&gt;</code> (opening) and <code>&lt;/h1&gt;</code> (closing). The tag name tells the browser what kind of element it is.`},
  voidelement: {term:'Void element', cat:'HTML Basics', plain:`An element that never wraps content and has no closing tag, like <code>&lt;img&gt;</code> or <code>&lt;br&gt;</code> — it's just one self-contained tag.`},
  attribute:   {term:'Attribute', cat:'HTML Basics', plain:`Extra information added inside an opening tag as <code>name="value"</code> pairs, like <code>&lt;img src="cat.jpg" alt="A cat"&gt;</code>. Attributes configure an element without changing what kind it is.`},
  structure:   {term:'Document structure', cat:'HTML Basics', plain:`Every HTML page shares the same skeleton: <code>&lt;!DOCTYPE html&gt;</code> at the very top, then <code>&lt;html&gt;</code> wrapping a <code>&lt;head&gt;</code> (page info, not shown) and a <code>&lt;body&gt;</code> (everything visible).`},
  doctype:     {term:'<!DOCTYPE html>', cat:'HTML Basics', plain:`The very first line of an HTML file — it tells the browser "render this using modern HTML rules," not some legacy mode.`},
  semantic:    {term:'Semantic element', cat:'HTML Basics', plain:`A tag chosen for what its content *means*, not just how it looks — <code>&lt;h1&gt;</code> for a main heading rather than a plain <code>&lt;div&gt;</code> made to look big, for example.`},
  h1tag:       {term:'<h1>', cat:'HTML Basics', plain:`The main heading of a page — use exactly one per page for the single most important title.`},
  ptag:        {term:'<p>', cat:'HTML Basics', plain:`A paragraph of regular text.`},
  atag:        {term:'<a>', cat:'HTML Basics', plain:`A link. The destination goes in its href attribute: <code>&lt;a href="..."&gt;text&lt;/a&gt;</code>.`},
  imgtag:      {term:'<img>', cat:'HTML Basics', plain:`Displays an image. A void element — no closing tag, no content between tags.`},
  ultag:       {term:'<ul>/<li>', cat:'HTML Basics', plain:`A bulleted list. <ul> wraps the whole list; each item goes in its own <li>.`},
  selector:    {term:'Selector', cat:'CSS Basics', plain:`The part of a CSS rule that says *which* elements to style — a tag name, a class, an id, and more. It comes right before the <code>{ }</code> block of properties.`},
  classsel:    {term:'Class selector (.name)', cat:'CSS Basics', plain:`Targets every element carrying <code>class="name"</code>, no matter its tag. Written with a leading dot: <code>.highlight { }</code>. The same class can be reused on many elements.`},
  idsel:       {term:'ID selector (#name)', cat:'CSS Basics', plain:`Targets the one element with <code>id="name"</code> — ids are meant to be unique on a page. Written with a leading hash: <code>#title { }</code>.`},
  cascade:     {term:'The cascade', cat:'CSS Basics', plain:`CSS's rule for what happens when two rules could both apply to the same element: later rules beat earlier ones, and more specific selectors (like an id) beat less specific ones (like a tag name) — that's where the "C" in CSS comes from.`},
  property:    {term:'Property', cat:'CSS Basics', plain:`The specific thing you're setting inside a CSS rule, like <code>color</code> or <code>font-size</code>. Written as <code>property: value;</code> inside the selector's <code>{ }</code>.`},
  colorprop:   {term:'color', cat:'CSS Basics', plain:`Sets the color of an element's text.`},
  fontsizeprop:{term:'font-size', cat:'CSS Basics', plain:`Sets how large an element's text renders, usually in pixels (<code>px</code>) or other units.`},
  bgprop:      {term:'background', cat:'CSS Basics', plain:`Sets an element's background color (or image).`},
  boxmodel:    {term:'Box model', cat:'CSS Basics', plain:`Every HTML element is secretly a rectangular box made of four layers, from the inside out: content, padding, border, margin. Understanding this stack explains almost all CSS spacing.`},
  margin:      {term:'Margin', cat:'CSS Basics', plain:`Transparent space *outside* an element's border — it pushes other elements away, but isn't part of the element itself.`},
  padding:     {term:'Padding', cat:'CSS Basics', plain:`Space *inside* an element's border, between the border and its actual content — it's still "inside" the element, so background colors fill it too.`},
  border:      {term:'Border', cat:'CSS Basics', plain:`A visible line drawn right at the edge of an element's box, between its padding and its margin. Set with a width, style, and color: <code>border: 2px solid black;</code>.`},
  svgtag:      {term:'<svg>', cat:'Embedded Content', plain:`An inline container for vector drawing instructions — everything inside it is math, not pixels, so it scales losslessly to any size.`},
  svgshape:    {term:'SVG shape elements', cat:'Embedded Content', plain:`The building-block elements drawn inside an <code>&lt;svg&gt;</code>, like <code>&lt;circle&gt;</code>, <code>&lt;rect&gt;</code>, and <code>&lt;path&gt;</code> — together they describe what the graphic actually looks like.`},
  iframetag:   {term:'<iframe>', cat:'Embedded Content', plain:`Embeds an entire separate web page inline inside the current one, sized with width/height and described for accessibility with a required title attribute.`},
  srcsetattr:  {term:'srcset', cat:'Embedded Content', plain:`An <code>&lt;img&gt;</code> attribute listing several versions of the same image at different widths or pixel densities, letting the browser pick whichever one actually fits the viewer's screen.`},
  transformprop: {term:'transform', cat:'CSS Mastery', plain:`A CSS property that moves, rotates, or resizes an element visually — with <code>translate()</code>, <code>rotate()</code>, and <code>scale()</code> among its most common functions — without affecting the layout of surrounding elements the way changing width or position would.`},
  transformorigin: {term:'transform-origin', cat:'CSS Mastery', plain:`Sets the pivot point a <code>transform</code> rotates or scales around. Defaults to the element's center; change it (e.g. <code>transform-origin: top left;</code>) to pivot from a corner or edge instead.`},
  animationtiming: {term:'animation-timing-function', cat:'CSS Mastery', plain:`Controls the easing curve of an animation — how its speed changes over each step, like <code>ease-in-out</code> (slow start and end) versus <code>linear</code> (constant speed throughout).`},
  specificity:  {term:'Specificity', cat:'CSS Mastery', plain:`The rule CSS uses to decide which of two conflicting selectors wins, ranked by how precisely each one targets: an id selector beats a class selector, which beats a plain tag selector — regardless of which rule appears later in the file.`},
  bemnaming:   {term:'BEM', cat:'CSS Mastery', plain:`A class-naming convention — Block, Element, Modifier — written as <code>block__element--modifier</code>. Every class stays a single flat selector with the same low specificity, so rules stop fighting each other as a project grows.`},

  landmarktag: {term:'Landmark elements', cat:'Semantic HTML', plain:`Tags like <code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;footer&gt;</code>, and <code>&lt;aside&gt;</code> that mark out the major regions of a page, so both browsers and assistive tech know what each chunk is for.`},
  sectioningtag: {term:'<article> vs <section>', cat:'Semantic HTML', plain:`<code>&lt;article&gt;</code> wraps content that could stand alone and be republished elsewhere (a blog post, a product card); <code>&lt;section&gt;</code> groups related content within a page (a chapter, a themed block). A generic <code>&lt;div&gt;</code> is for when neither meaning applies and you just need a wrapper.`},
  ariabasics: {term:'Landmark navigation', cat:'Semantic HTML', plain:`Screen readers let users jump directly between landmark regions — nav, main, footer — the way a sighted user's eye skips straight to the header. Reaching for real landmark tags gives that navigation for free.`},
  altattr: {term:'alt (accessibility)', cat:'Semantic HTML', plain:`Beyond being a fallback for a broken image link, alt text is what a screen reader actually reads aloud in place of the image — write it to describe the image's content and purpose, not just "image" or the filename.`},
  formtag: {term:'<form>', cat:'Forms', plain:`Wraps a group of inputs meant to be submitted together. Its <code>action</code> attribute says where the data goes, and <code>method</code> says how (<code>get</code> appends it to the URL, <code>post</code> sends it in the request body).`},
  inputattr: {term:'type attribute', cat:'Forms', plain:`Set on <code>&lt;input&gt;</code>, it decides what kind of control renders and what the browser validates — text, email, password, checkbox, radio, number, and more all come from the same tag with a different type.`},
  labelfor: {term:'<label for="">', cat:'Forms', plain:`Pairs a label's <code>for</code> attribute with an input's <code>id</code>, so clicking the label text focuses the input and screen readers announce the label when the input receives focus.`},
  requiredattr: {term:'required', cat:'Forms', plain:`A boolean attribute on a form control that stops the form from submitting until the field has a value — enforced by the browser itself, no JavaScript needed.`},
  colorvalue: {term:'Color formats', cat:'CSS Typography', plain:`CSS colors can be written as a hex code (<code>#ff6600</code>), a keyword (<code>orange</code>), <code>rgb()</code> for red/green/blue values, or <code>hsl()</code> for hue/saturation/lightness — all interchangeable, pick whichever is easiest to reason about for the situation.`},
  bgshorthand: {term:'background shorthand', cat:'CSS Typography', plain:`The <code>background</code> property packs several <code>background-</code> longhands (color, image, position, repeat, size) into one declaration, in a flexible order — handy once a background needs more than a single color.`},
  fontstack: {term:'Font stack', cat:'CSS Typography', plain:`A comma-separated list given to <code>font-family</code>, tried in order until the browser finds one installed on the visitor's device, ending in a generic fallback like <code>sans-serif</code> so text never renders in nothing at all.`},
  linkstates: {term:'Link pseudo-classes', cat:'CSS Typography', plain:`<code>:link</code>, <code>:visited</code>, <code>:hover</code>, and <code>:active</code> style an <code>&lt;a&gt;</code> differently depending on its state. Order matters — write them in that order (remember "LVHA") or a later rule can accidentally cancel an earlier one out.`},
  flexdisplay: {term:'display: flex', cat:'Flexbox', plain:`Turns an element into a flex container, laying its direct children out in a single row (or column) that can grow, shrink, and align in ways block layout can't do on its own.`},
  flexdirection: {term:'flex-direction', cat:'Flexbox', plain:`Sets which way a flex container's main axis runs — <code>row</code> (default, left to right) or <code>column</code> (top to bottom) — which in turn decides what "main axis" means for every other flex property.`},
  justifycontent: {term:'justify-content / align-items', cat:'Flexbox', plain:`<code>justify-content</code> spaces items along the main axis (e.g. <code>space-between</code>); <code>align-items</code> aligns them along the cross axis (e.g. <code>center</code>) — together they cover most flex alignment questions.`},
  flexshorthand: {term:'flex shorthand', cat:'Flexbox', plain:`Sets <code>flex-grow</code>, <code>flex-shrink</code>, and <code>flex-basis</code> on a flex item in one declaration, e.g. <code>flex: 1 1 200px;</code> — controlling whether an item grows into extra space, shrinks under pressure, and its starting size.`},
  griddisplay: {term:'display: grid', cat:'CSS Grid', plain:`Turns an element into a grid container, letting its children be placed on a two-dimensional row-and-column grid instead of flexbox's single axis.`},
  gridtemplate: {term:'grid-template-columns/rows', cat:'CSS Grid', plain:`Defines how many rows and columns the grid has and how big each one is — using fixed sizes, <code>fr</code> units (a flexible fraction of remaining space), or a mix of both.`},
  gridarea: {term:'grid-template-areas', cat:'CSS Grid', plain:`Names regions of the grid as a visual ASCII-art layout in the container, then assigns each child to a named area with <code>grid-area</code> — a very readable way to lay out a page.`},
  gridgap: {term:'gap', cat:'CSS Grid', plain:`Sets the space between grid (or flex) tracks, without adding margin to the edge items — cleaner than margin for even spacing between a set of items.`},
  viewportmeta: {term:'viewport meta tag', cat:'Responsive Design', plain:`<code>&lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;</code> tells mobile browsers to render the page at the device's actual width instead of quietly zooming out to fake a desktop-sized page.`},
  mediaquery: {term:'@media', cat:'Responsive Design', plain:`A CSS block that only applies its rules when a condition holds, most often a screen width breakpoint like <code>@media (min-width: 768px) { ... }</code> — the mechanism behind responsive layouts.`},
  relativeunit: {term:'Relative units', cat:'Responsive Design', plain:`<code>%</code> sizes relative to a parent, <code>em</code> relative to the current font-size, <code>rem</code> relative to the root font-size, and <code>vw</code>/<code>vh</code> relative to the viewport's width/height — all scale with context, unlike a fixed <code>px</code> value.`},
  mobilefirst: {term:'Mobile-first', cat:'Responsive Design', plain:`Writing base CSS for the smallest screen first, then layering on <code>min-width</code> media queries to add complexity as the viewport grows — usually simpler than the reverse, since small screens tend to need the fewest overrides.`},
  displayvalue: {term:'display values', cat:'Display & Position', plain:`Block elements start a new line and fill their container's width; inline elements flow within text and ignore width/height; inline-block flows inline but still respects width, height, and vertical margin.`},
  positioncontext: {term:'position: relative/absolute', cat:'Display & Position', plain:`position: relative nudges an element from its normal spot while keeping its original space reserved. position: absolute removes it from flow entirely and positions it against its nearest ancestor that itself has a non-static position — that ancestor is its positioning context.`},
  stickypos: {term:'position: sticky', cat:'Display & Position', plain:`Acts like position: relative until the page scrolls past a set threshold (usually top: 0), then switches to acting like position: fixed until its parent container scrolls out of view.`},
  zindexstack: {term:'z-index', cat:'Display & Position', plain:`Decides which positioned element draws on top when two overlap — a higher number wins. Only affects elements whose position is something other than static.`},
  boxsizing: {term:'box-sizing: border-box', cat:'CSS Basics', plain:`Changes what width and height measure: by default (content-box) they set only the content area, with padding and border added on top; border-box makes them include padding and border instead, so the box's total size matches the number you wrote. Most stylesheets set this globally on *.`},
  combinatorsel: {term:'Descendant & child selectors', cat:'CSS Basics', plain:`.card p (a space) selects any matching element nested anywhere inside .card, at any depth. .card > p (a greater-than sign) narrows that to only direct children. Combining selectors this way avoids needing a class on every element.`},
  transitionprop: {term:'transition', cat:'Transitions & Pseudo-Elements', plain:`Animates a property smoothly from its old value to its new one over a set duration, instead of jumping instantly — e.g. <code>transition: background 0.2s ease;</code>. It only plays when the property's value actually changes, usually triggered by a state like <code>:hover</code> or a class toggle.`},
  pseudoelement: {term:'::before / ::after', cat:'Transitions & Pseudo-Elements', plain:`Inserts a virtual extra element just inside an element's opening or closing tag, styled with CSS but requiring a <code>content</code> property (even if empty: <code>content: "";</code>) to actually render. Meant for decorative content, not information a user needs — real content belongs in HTML.`},
  flexcentering: {term:'Centering with flexbox', cat:'Transitions & Pseudo-Elements', plain:`<code>display: flex;</code> plus <code>justify-content: center;</code> and <code>align-items: center;</code> on a container centers a single child both horizontally and vertically — the answer to what used to be one of CSS's most fought-over problems.`},
  aligncontent: {term:'align-content', cat:'Flexbox', plain:`Aligns a flex container's *lines* along the cross axis once <code>flex-wrap: wrap;</code> creates more than one — align-items aligns items within a line, align-content aligns the lines themselves relative to each other (e.g. <code>space-between</code>, <code>center</code>).`},
  minmaxfn: {term:'minmax()', cat:'Responsive Grid Patterns', plain:`Sets a track's size as a range instead of one fixed value: <code>minmax(200px, 1fr)</code> means "never shrink smaller than 200px, but grow to fill whatever space is available beyond that." Solves the problem where a plain <code>1fr</code> column can shrink so far its content overflows or wraps badly.`},
  autofitfill: {term:'repeat(auto-fit, ...)', cat:'Responsive Grid Patterns', plain:`Paired with minmax(), lets the grid decide on its own how many columns fit at the current width — <code>repeat(auto-fit, minmax(200px, 1fr))</code> fills a row with as many 200px-or-wider columns as fit, then wraps, with zero @media queries needed.`},
  videoaudio: {term:'<video>/<audio>', cat:'Embedded Content', plain:`Embed native media playback with built-in browser controls. Add the <code>controls</code> attribute so viewers get play/pause/volume UI for free, and provide one or more <code>&lt;source&gt;</code> elements (or a plain src) plus fallback text for browsers that can't play any of the given formats.`},
  fieldsetlegend: {term:'<fieldset>/<legend>', cat:'Forms', plain:`<code>&lt;fieldset&gt;</code> groups a set of related controls with a visible border, and its first child <code>&lt;legend&gt;</code> gives that group a caption — e.g. wrapping a set of radio buttons for "Shipping method" so screen readers announce the group's purpose before reading each option.`},
  validationattrs: {term:'pattern / minlength / maxlength', cat:'Forms', plain:`Built-in browser validation beyond required: <code>pattern</code> takes a regular expression the value must match (e.g. a ZIP code format), and <code>minlength</code>/<code>maxlength</code> cap how many characters are accepted — all enforced with zero JavaScript.`},
  figuretag: {term:'<figure>/<figcaption>', cat:'Semantic HTML', plain:`<code>&lt;figure&gt;</code> wraps self-contained media — an image, a diagram, a code sample — together with its <code>&lt;figcaption&gt;</code>, a caption describing it. The pairing keeps the caption programmatically tied to its media instead of just floating nearby as an unrelated paragraph.`},
  lineheight: {term:'line-height', cat:'CSS Typography', plain:`Sets the vertical space a line of text occupies, usually written unitless (e.g. <code>line-height: 1.5;</code>) as a multiple of the element's font-size — a unitless value scales correctly even if a child element sets a different font-size, unlike a fixed px value.`},
  fontface: {term:'@font-face', cat:'CSS Typography', plain:`Loads a custom font file so it's usable in font-family even if it isn't installed on the visitor's device — give it a font-family name and a src pointing at the font file, then reference that same name anywhere in your CSS.`},
};

// Wraps display text in a hoverable/focusable glossary term span.
// g(key) -> uses the term's own label from GLOSSARY as the visible text.
// g(key, 'custom text') -> use custom visible text (e.g. plural, different wording).
function g(key, label){
  const entry = GLOSSARY[key];
  if(!entry) return label || key;
  return `<span class="jterm" tabindex="0" data-g="${key}">${escapeHtml(label || entry.term)}</span>`;
}

// One-line, high-contrast takeaway at the top of a concept card — the thing a
// reader should walk away with even if they never finish the paragraphs below.
function tldr(text){
  return `<div class="tldr"><span class="tldr-label">TL;DR</span>${text}</div>`;
}
// A row of small hoverable pills, for when a lesson introduces several sibling
// terms at once (e.g. int/double/string/bool). Pulling them out of the running
// prose into a scannable legend avoids stacking a wall of underlines into one
// sentence — same tooltip behavior, much less visual noise.
function chip(key, label){
  const entry = GLOSSARY[key];
  if(!entry) return label || key;
  return `<span class="term-chip jterm" tabindex="0" data-g="${key}">${escapeHtml(label || entry.term)}</span>`;
}
function chipRow(...keys){
  return `<div class="chip-row">${keys.map(k=>chip(k)).join('')}</div>`;
}

/* One shared floating tooltip element + event delegation, so lesson cards,
   the docs page, and anywhere else jterms show up all just work without any
   extra wiring per-view. Wired up once in boot(). */
function initGlossaryTooltip(){
  let tip = document.getElementById('glossary-tooltip');
  if(!tip){
    tip = document.createElement('div');
    tip.id = 'glossary-tooltip';
    document.body.appendChild(tip);
  }
  function showFor(el){
    const entry = GLOSSARY[el.getAttribute('data-g')];
    if(!entry) return;
    tip.innerHTML = `<span class="gt-term">${escapeHtml(entry.term)}</span>${entry.plain}`;
    const r = el.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(window.innerWidth-268, r.left)) + 'px';
    const above = r.top > 140;
    tip.style.top = above ? '' : (r.bottom+8)+'px';
    tip.style.bottom = above ? (window.innerHeight-r.top+8)+'px' : '';
    tip.classList.add('show');
  }
  function hide(){ tip.classList.remove('show'); }
  document.addEventListener('mouseover', e=>{ const el = e.target.closest('.jterm'); if(el) showFor(el); });
  document.addEventListener('mouseout', e=>{ const el = e.target.closest('.jterm'); if(el) hide(); });
  document.addEventListener('focusin', e=>{ const el = e.target.closest('.jterm'); if(el) showFor(el); });
  document.addEventListener('focusout', e=>{ const el = e.target.closest('.jterm'); if(el) hide(); });
  document.addEventListener('scroll', hide, true);
}
