const CHAPTERS = [
 {id:'html-basics', title:'HTML Basics', lessons:[
   {id:'html_1', title:'Elements & Tags', tag:'tags',
    concept:`${tldr(`Most elements are an opening tag, some content, and a matching closing tag — a few "void" elements are just one self-contained tag.`)}
      <p>A web page is really just ${g('element','elements')} nested inside each other. Each one starts with an opening ${g('tag')} like <code>&lt;h1&gt;</code>, wraps around some content, and ends with a matching closing tag that adds a slash: <code>&lt;/h1&gt;</code>.</p>
      <p>A handful of tags cover most of what you'll write early on:</p>
      ${chipRow('h1tag','ptag','atag','imgtag','ultag')}
      <p>Notice <code>&lt;img&gt;</code> never gets a closing tag — it's a ${g('voidelement')}, since an image doesn't wrap around any content to close around.</p>`,
    example:`<h1>Hello, world!</h1>\n<p>This is a paragraph of regular text.</p>\n<ul>\n  <li>First item</li>\n  <li>Second item</li>\n</ul>\n<a href="https://example.com">Visit example.com</a>`},
   {id:'html_2', title:'Attributes', tag:'attributes',
    concept:`${tldr(`Attributes live inside the opening tag as name="value" pairs — they configure an element without changing what kind of element it is.`)}
      <p>Tags alone only say *what kind* of thing an element is. ${g('attribute','Attributes')} add the specifics — where a link goes, which image file to show, backup text for screen readers. They're written right inside the opening tag: <code>&lt;a href="https://example.com"&gt;</code>.</p>
      <p>Some of the most common ones: <code>href</code> (a link's destination), <code>src</code> (an image's file), <code>alt</code> (backup text if an image can't load), and <code>class</code>/<code>id</code> (hooks CSS uses to target an element, covered next chapter).</p>
      <p>You can stack several attributes on one tag, separated by spaces — order between them doesn't matter.</p>`,
    example:`<a href="https://example.com">Visit</a>\n<img src="dog.jpg" alt="A golden retriever" width="200">\n<p class="intro">A paragraph with a class attribute on it.</p>`},
   {id:'html_3', title:'Document Structure', tag:'structure',
    concept:`${tldr(`Every HTML page shares the same skeleton: DOCTYPE, then html wrapping a head and a body.`)}
      <p>Beyond individual tags, a complete HTML file follows one fixed ${g('structure','skeleton')}. ${g('doctype')} always comes first, telling the browser to use modern rules. Then one <code>&lt;html&gt;</code> element wraps everything else, split into two parts: <code>&lt;head&gt;</code> holds information about the page (like its <code>&lt;title&gt;</code>, shown in the browser tab) that isn't itself visible, and <code>&lt;body&gt;</code> holds everything a visitor actually sees.</p>
      <p>Reach for ${g('semantic','semantic tags')} like <code>&lt;h1&gt;</code> over a generic <code>&lt;div&gt;</code> whenever one fits — it tells both browsers and other developers what the content actually *means*, not just how big to draw it.</p>`,
    example:`<!DOCTYPE html>\n<html>\n<head>\n  <title>My Page</title>\n</head>\n<body>\n  <h1>Welcome</h1>\n  <p>This is the visible part of the page.</p>\n</body>\n</html>`}
 ]},
 {id:'css-basics', title:'CSS Basics', lessons:[
   {id:'css_1', title:'Selectors', tag:'selectors',
    concept:`${tldr(`A selector says which elements to style; the most common are by tag name, by class (.name), or by id (#name).`)}
      <p>HTML says *what* is on the page; CSS says *how it looks*. A CSS rule pairs a ${g('selector')} — which elements to target — with a block of styling in <code>{ }</code>. Drop a <code>&lt;style&gt;</code> block in your page's <code>&lt;head&gt;</code> (or right in the body for quick examples) to hold your rules.</p>
      <p>Three selector types cover almost everything at first: a bare tag name styles every element of that kind, a ${g('classsel','class selector')} (<code>.name</code>) styles every element carrying that class, and an ${g('idsel','id selector')} (<code>#name</code>) styles the one element with that id.</p>
      <p>Selectors can also be combined to target elements by their relationship to each other. A space between two selectors, like <code>.card p</code>, targets any <code>&lt;p&gt;</code> nested anywhere inside a <code>.card</code> — a ${g('combinatorsel','descendant selector')}. A <code>&gt;</code>, like <code>.card &gt; p</code>, narrows that to only *direct* children, skipping anything nested deeper. These get used constantly in real stylesheets to avoid adding a class to every single element.</p>`,
    example:`<style>\n  h1 { color: blue; }\n  .highlight { background: yellow; }\n  #title { font-size: 24px; }\n</style>\n<h1 id="title">Hello</h1>\n<p class="highlight">This paragraph is highlighted.</p>`},
   {id:'css_2', title:'Properties & the Cascade', tag:'properties',
    concept:`${tldr(`Rules are property: value pairs; when two rules could both apply, later rules and more specific selectors win — that's the cascade.`)}
      <p>Inside a rule's <code>{ }</code>, each line is a ${g('property')} paired with a value: <code>${'color: navy;'}</code> sets the ${g('colorprop','color')} property to navy. Some common ones to know early: ${g('colorprop')}, ${g('fontsizeprop')}, and ${g('bgprop')}.</p>
      <p>What happens when two rules target the same element with different values for the same property? That's ${g('cascade')} — think of it as two tie-breakers: a later rule in the file wins over an earlier one, and a more specific selector (like an id) wins over a less specific one (like a bare tag name), regardless of order.</p>`,
    example:`<style>\n  p { color: gray; font-size: 16px; }\n  /* this rule comes later, so navy wins for color */\n  p { color: navy; }\n</style>\n<p>This text renders navy, not gray.</p>`},
   {id:'css_3', title:'The Box Model', tag:'boxmodel',
    concept:`${tldr(`Every element is a box made of four layers, inside out: content, padding, border, margin.`)}
      <p>Here's the single most useful mental model in CSS: every element, no matter how it looks, is secretly a rectangular box. The ${g('boxmodel','box model')} describes it in four layers from the inside out — the content itself, then ${g('padding')} (space inside the border), then the ${g('border')} itself, then ${g('margin')} (space outside the border, pushing other elements away).</p>
      <p>Almost every layout question — "why is there a gap here," "why isn't this touching that" — comes back to which of these four layers is doing it.</p>
      <p>One default catches almost everyone off guard: by default (<code>box-sizing: content-box;</code>), <code>width</code> and <code>height</code> set only the content area — padding and border get added on *top* of that, so a 200px-wide box with 20px of padding and a 2px border actually takes up 244px on screen. ${g('boxsizing','box-sizing: border-box;')} changes the rule so <code>width</code> and <code>height</code> include padding and border instead, which is why almost every real stylesheet starts with <code>*, *::before, *::after { box-sizing: border-box; }</code> — it makes sizing math behave the way most people expect on the first try.</p>`,
    example:`<style>\n  .box {\n    width: 120px;\n    padding: 10px;\n    border: 2px solid black;\n    margin: 20px;\n  }\n</style>\n<div class="box">Content</div>\n<div class="box">Another box</div>`}
 ]},
 {id:'css-layout-flow', title:'Display & Position', lessons:[
   {id:'layout_1', title:'Display: Block, Inline & Inline-Block', tag:'displayvalues',
    concept:`${tldr(`display controls whether an element behaves as a block (own line, full width) or inline (flows within text); inline-block gets both a set size and inline flow.`)}
      <p>Every element has a default ${g('displayvalue','display')} value baked in by the browser. Block-level elements like <code>&lt;div&gt;</code>, <code>&lt;p&gt;</code>, and <code>&lt;h1&gt;</code> start on a new line and stretch to fill their container's width, and they respect <code>width</code>/<code>height</code>. Inline elements like <code>&lt;span&gt;</code>, <code>&lt;a&gt;</code>, and <code>&lt;strong&gt;</code> flow right in the middle of surrounding text, only take up as much width as their content needs, and ignore <code>width</code>/<code>height</code> entirely.</p>
      <p><code>display: inline-block;</code> is the middle ground: the element flows inline like text, but now respects <code>width</code>, <code>height</code>, and vertical <code>margin</code> — handy for something like a row of same-sized buttons that still need to sit next to each other.</p>
      <p><code>display: none;</code> removes an element completely — it takes up no space at all, as if it were never in the HTML. That's different from <code>visibility: hidden;</code>, which hides an element visually but still leaves its space reserved in the layout. flex and grid, covered in the next chapters, are really just two more values this same property can take.</p>`,
    example:`<style>\n  span { background: yellow; }\n  .box { display: inline-block; width: 80px; height: 40px; background: #4FD1E8; margin: 4px; }\n</style>\n<p>Some text with a <span>highlighted word</span> inline.</p>\n<div class="box">A</div>\n<div class="box">B</div>`},
   {id:'layout_2', title:'Position: Relative & Absolute', tag:'positionrelabs',
    concept:`${tldr(`position: relative nudges an element from its normal spot without pulling it out of the flow; position: absolute removes it from flow and positions it against its nearest positioned ancestor.`)}
      <p>Every element starts with <code>position: static</code> — the default, normal flow, where <code>top</code>/<code>right</code>/<code>bottom</code>/<code>left</code> have no effect. <code>position: relative;</code> changes that just enough to let you nudge the element with those offsets, while the space it originally occupied stays reserved — nothing else on the page moves to fill the gap.</p>
      <p><code>position: absolute;</code> is a bigger jump: the element is pulled completely out of the normal flow (other elements act like it isn't there) and positioned using <code>top</code>/<code>right</code>/<code>bottom</code>/<code>left</code> relative to its nearest ancestor that itself has a <code>position</code> other than <code>static</code> — its ${g('positioncontext','positioning context')}. If no ancestor qualifies, it falls back to positioning against the whole page.</p>
      <p>This is why "absolutely positioned" elements almost always come paired with a parent set to <code>position: relative;</code> and nothing else — the parent just exists to give the child something to measure offsets from, like a badge pinned to the corner of a card.</p>`,
    example:`<style>\n  .card { position: relative; width: 200px; padding: 16px; border: 1px solid #ccc; }\n  .badge { position: absolute; top: 8px; right: 8px; background: crimson; color: white; padding: 2px 6px; border-radius: 4px; }\n</style>\n<div class="card">\n  <span class="badge">New</span>\n  <p>Card content</p>\n</div>`},
   {id:'layout_3', title:'Position: Fixed, Sticky & Stacking', tag:'positionfixedsticky',
    concept:`${tldr(`position: fixed pins an element to the viewport regardless of scrolling; sticky toggles between relative and fixed once a scroll threshold is crossed; z-index breaks ties when positioned elements overlap.`)}
      <p><code>position: fixed;</code> positions an element relative to the browser viewport instead of any ancestor, and it stays glued in place as the page scrolls — the classic use is a header or a "back to top" button that's always visible.</p>
      <p>${g('stickypos','position: sticky')} is a hybrid: the element behaves like <code>relative</code> until the page scrolls past a threshold you set (usually <code>top: 0;</code>), at which point it switches to acting like <code>fixed</code> and sticks — until its parent container scrolls out of view, at which point it unsticks again. It's the mechanism behind a table header that stays visible while its rows scroll underneath it.</p>
      <p>Once elements are positioned (anything other than <code>static</code>) and start overlapping, ${g('zindexstack','z-index')} decides which one draws on top — a higher number wins. <code>z-index</code> only has an effect on positioned elements; setting it on a plain static element does nothing.</p>`,
    example:`<style>\n  .topbar { position: fixed; top: 0; left: 0; width: 100%; background: #0B1D33; color: white; padding: 8px; z-index: 10; }\n  .tooltip { position: absolute; z-index: 20; background: black; color: white; padding: 4px 8px; }\n</style>\n<div class="topbar">Always visible header</div>`}
 ]},
 {id:'html-embed', title:'Embedded & Vector Content', lessons:[
   {id:'embed_1', title:'Inline SVG Basics', tag:'svgbasics',
    concept:`${tldr(`Inline &lt;svg&gt; embeds vector artwork directly in the page — because it's math instead of pixels, it stays crisp at any size.`)}
      <p>${g('svgtag')} is a container element, just like <code>&lt;div&gt;</code>, except everything inside it is vector drawing instructions instead of regular markup. Add a <code>viewBox</code> attribute (like <code>viewBox="0 0 100 100"</code>) to define its internal coordinate system, and the whole graphic scales to fill however big or small you draw it on the page.</p>
      <p>Inside an <code>&lt;svg&gt;</code>, ${g('svgshape','shape elements')} like <code>&lt;circle&gt;</code>, <code>&lt;rect&gt;</code>, and <code>&lt;path&gt;</code> describe what to draw — a circle takes a center and radius, a rect takes a position and size, and a path takes a string of drawing commands for anything more complex.</p>
      <p>Because it's math instead of a fixed pixel grid, an inline SVG icon looks identical on a phone screen and a 4K monitor — a raster <code>&lt;img&gt;</code> blown up past its native size just gets blurry.</p>`,
    example:`<svg viewBox="0 0 100 100" width="80" height="80">\n  <circle cx="50" cy="50" r="40" fill="#4FD1E8" />\n  <rect x="20" y="70" width="60" height="10" fill="#0B1D33" />\n</svg>`},
   {id:'embed_2', title:'Embedding External Content', tag:'iframe',
    concept:`${tldr(`&lt;iframe&gt; embeds another full page inline — always give it a src, a title for accessibility, and explicit width/height.`)}
      <p>${g('iframetag')} drops an entirely separate web page — a map, a video, a payment form — inside a rectangle on your own page. The page to load goes in <code>src</code>, exactly like an <code>&lt;img&gt;</code>'s <code>src</code> points at an image file.</p>
      <p>Unlike an image, an iframe's content can be interactive and even has its own scroll bar, so screen reader users need a plain-language <code>title</code> attribute describing what's embedded — "Store location map," not "iframe 3." Treat <code>title</code> as required, not optional.</p>
      <p>Always set explicit <code>width</code> and <code>height</code> (or size it with CSS) so the embed doesn't collapse to zero height before it loads, leaving a jarring layout jump.</p>`,
    example:`<iframe\n  src="https://example.com/widget"\n  title="Example interactive widget"\n  width="400"\n  height="300">\n</iframe>`},
   {id:'embed_3', title:'Choosing the Right Media Format', tag:'mediaformats',
    concept:`${tldr(`Use &lt;img&gt; for photos, inline &lt;svg&gt; for icons/logos that need to scale, and &lt;iframe&gt; for embedding someone else's whole page.`)}
      <p>All three tools put visual content on a page, but they solve different problems. <code>&lt;img&gt;</code> is the right call for photos and anything raster — real cameras don't produce clean vector math. Inline ${g('svgtag','<svg>')} wins for icons, logos, and diagrams, since those are usually drawn from simple shapes and benefit from staying crisp at any size. ${g('iframetag','<iframe>')} is for embedding content you don't own or control — someone else's whole page, with its own scripts and styling.</p>
      <p>Even within <code>&lt;img&gt;</code>, one file rarely fits every screen. The ${g('srcsetattr')} attribute lists several versions of the same image at different sizes or pixel densities, and the browser picks whichever one it actually needs — a phone downloads a smaller file than a widescreen monitor, without you writing any JavaScript.</p>
      <p>A <code>&lt;picture&gt;</code> element takes this further, wrapping multiple <code>&lt;source&gt;</code> candidates (different formats, different crops) around a fallback <code>&lt;img&gt;</code> — useful once "responsive" needs to mean more than just "smaller file."</p>
      <p>For actual audio and video, reach for ${g('videoaudio','<video>/<audio>')} instead of an <code>&lt;iframe&gt;</code> to a third-party player. Both accept a <code>controls</code> attribute for a free, built-in play/pause/volume UI, and can wrap one or more <code>&lt;source&gt;</code> elements offering different formats — the browser plays the first one it supports — with plain text after them as a fallback for browsers that can't play any.</p>`,
    example:`<img\n  src="hero-800.jpg"\n  srcset="hero-800.jpg 800w, hero-1600.jpg 1600w"\n  alt="A mountain landscape at sunset">\n\n<video controls width="400">\n  <source src="clip.mp4" type="video/mp4">\n  Your browser doesn't support embedded video.\n</video>`}
 ]},
 {id:'css-mastery', title:'Transforms, Animation & Architecture', lessons:[
   {id:'mstr_1', title:'Transforms', tag:'transforms',
    concept:`${tldr(`transform moves, rotates, or resizes an element without disturbing the page's layout; transform-origin sets the point it pivots around.`)}
      <p>${g('transformprop')} lets you move, spin, or resize an element purely visually — the browser draws it somewhere else, but the space it originally occupied in the layout doesn't change, so nothing around it reflows. The three functions you'll reach for most: <code>translate(x, y)</code> shifts an element, <code>rotate(deg)</code> spins it, and <code>scale(n)</code> grows or shrinks it.</p>
      <p>You can chain several functions in one declaration, space-separated: <code>transform: translate(20px, 0) rotate(15deg);</code> applies both. Order matters — each function transforms the coordinate system left over by the one before it.</p>
      <p>By default, <code>rotate()</code> and <code>scale()</code> pivot around an element's exact center. ${g('transformorigin')} moves that pivot point — set it to a corner or edge (<code>transform-origin: top left;</code>) when you want a rotation or scale to hinge from somewhere other than the middle.</p>`,
    example:`<style>\n  .card {\n    transition: transform 0.2s ease;\n  }\n  .card:hover {\n    transform: translateY(-6px) scale(1.03);\n    transform-origin: bottom center;\n  }\n</style>\n<div class="card">Hover me</div>`},
   {id:'mstr_2', title:'Advanced Keyframe Animation', tag:'advanimation',
    concept:`${tldr(`@keyframes with more than two stops choreographs a multi-step animation; timing-function sets the easing, delay/iteration-count set when and how often it plays.`)}
      <p>A basic <code>@keyframes</code> block only needs a <code>from</code> and a <code>to</code>, but nothing stops you from adding as many percentage stops as the motion needs: <code>0%</code>, <code>25%</code>, <code>60%</code>, <code>100%</code>, each with its own styles. The browser smoothly interpolates between whichever two stops the animation is currently between.</p>
      <p>${g('animationtiming')} shapes how the motion feels between those stops — <code>ease-in-out</code> reads as natural and physical, <code>linear</code> reads as mechanical, which is exactly right for something like a spinning loader.</p>
      <p>Two more properties round out the timing picture: <code>animation-delay</code> waits before the animation starts at all (handy for staggering several elements), and <code>animation-iteration-count</code> sets how many times it plays — a number, or <code>infinite</code> for something like a spinner that should never stop.</p>`,
    example:`<style>\n  @keyframes pulse {\n    0%   { transform: scale(1);    opacity: 1; }\n    50%  { transform: scale(1.15); opacity: 0.7; }\n    100% { transform: scale(1);    opacity: 1; }\n  }\n  .dot {\n    animation: pulse 1.2s ease-in-out infinite;\n    animation-delay: 0.3s;\n  }\n</style>\n<div class="dot"></div>`},
   {id:'mstr_3', title:'Specificity & CSS Architecture', tag:'architecture',
    concept:`${tldr(`Specificity ranks id > class > tag when rules conflict; avoid !important, and use a naming convention like BEM to keep every selector equally, predictably specific.`)}
      <p>${g('cascade','The cascade')} breaks ties partly by order, but mostly by ${g('specificity')} — the browser scores each selector by what it's made of, and the higher score wins regardless of where it sits in the file. Roughly: an id selector outweighs a class selector, which outweighs a plain tag selector. That's why <code>#nav a</code> beats <code>.nav-link</code> even if <code>.nav-link</code> is defined later.</p>
      <p><code>!important</code> looks like a shortcut past all of this — it overrides normal specificity entirely — but it's a trap: once one rule uses it, the only way to override *that* rule is another <code>!important</code> with higher priority, and specificity wars spiral from there. Treat it as a last resort, not a first move.</p>
      <p>${g('bemnaming')} sidesteps the whole problem by convention rather than force: every class is a single flat selector — <code>.card</code>, <code>.card__title</code>, <code>.card--featured</code> — so nothing ever needs an id or a nested selector to win a specificity fight in the first place.</p>`,
    example:`<style>\n  .card { border: 1px solid #ccc; }\n  .card__title { font-weight: bold; }\n  .card--featured { border-color: gold; }\n</style>\n<div class="card card--featured">\n  <h3 class="card__title">Featured Item</h3>\n</div>`}
 ]},
 {id:'html-semantics', title:'Semantic HTML & Page Landmarks', lessons:[
   {id:'sem_1', title:'Landmarks & Page Regions', tag:'landmarks',
    concept:`${tldr(`Landmark elements like &lt;header&gt;, &lt;nav&gt;, &lt;main&gt;, &lt;footer&gt;, and &lt;aside&gt; mark out a page's major regions, instead of generic &lt;div&gt;s for everything.`)}
      <p>${g('landmarktag','Landmark elements')} give the big regions of a page real names instead of leaving everything as anonymous <code>&lt;div&gt;</code>s. <code>&lt;header&gt;</code> usually holds a site's logo and top navigation, <code>&lt;nav&gt;</code> wraps a block of navigation links, <code>&lt;main&gt;</code> wraps the one primary content area unique to that page, <code>&lt;footer&gt;</code> holds closing info like copyright or contact links, and <code>&lt;aside&gt;</code> holds tangential content like a sidebar or a pull quote.</p>
      <p>A page typically uses exactly one <code>&lt;main&gt;</code> and one <code>&lt;footer&gt;</code>, but can have several <code>&lt;nav&gt;</code> or <code>&lt;aside&gt;</code> elements — a top nav and a footer nav are both valid uses of the same tag.</p>
      <p>None of these change how content looks by default; the payoff is entirely in meaning — for search engines, for other developers reading the markup, and for assistive tech, covered in lesson 3.</p>`,
    example:`<header>\n  <h1>My Site</h1>\n  <nav>\n    <a href="#home">Home</a>\n    <a href="#about">About</a>\n  </nav>\n</header>\n<main>\n  <h2>Welcome</h2>\n  <p>This is the main content of the page.</p>\n</main>\n<aside>\n  <p>Related links go here.</p>\n</aside>\n<footer>\n  <p>&copy; 2026 My Site</p>\n</footer>`},
   {id:'sem_2', title:'Article vs. Section vs. Div', tag:'sectioning',
    concept:`${tldr(`Use &lt;article&gt; for standalone content that could be republished elsewhere, &lt;section&gt; for a themed grouping within the page, and a plain &lt;div&gt; when neither meaning applies.`)}
      <p>${g('sectioningtag','<article> and <section>')} both group content, but for different reasons. <code>&lt;article&gt;</code> is for a chunk of content that makes sense pulled out on its own — a blog post, a news story, a single product card in a grid. If you could copy it into an RSS feed or another site and it would still make sense, it's an article.</p>
      <p><code>&lt;section&gt;</code> is for grouping related content *within* a page that doesn't stand alone the same way — a "Features" block on a landing page, a chapter within a longer article. A good rule of thumb: a section usually deserves its own heading.</p>
      <p>When neither meaning fits — you just need a box to apply layout or styling to, with no semantic weight — a plain <code>&lt;div&gt;</code> is still the right tool. Semantic tags aren't meant to replace every <code>&lt;div&gt;</code> on a page, just the ones that actually carry meaning.</p>
      <p>${g('figuretag','<figure>/<figcaption>')} round out the semantic-grouping picture for media specifically: <code>&lt;figure&gt;</code> wraps something self-contained like an image, chart, or code sample, and <code>&lt;figcaption&gt;</code> gives it a real caption tied to that specific piece of content — rather than a plain paragraph sitting nearby that a screen reader has no way to associate with the image it's describing.</p>`,
    example:`<article>\n  <h2>Blog Post Title</h2>\n  <p>This post could be pulled into an RSS feed and still make sense on its own.</p>\n</article>\n<section>\n  <h2>Features</h2>\n  <p>A themed group of content within this page, not meant to stand alone.</p>\n</section>\n<figure>\n  <img src="chart.png" alt="Bar chart of quarterly sales">\n  <figcaption>Quarterly sales, 2025</figcaption>\n</figure>`},
   {id:'sem_3', title:'Semantics & Accessibility', tag:'a11ybasics',
    concept:`${tldr(`Screen reader users can jump straight between landmark regions, and alt text is what gets read aloud in place of an image — not just a broken-image fallback.`)}
      <p>Semantic tags aren't just a style preference — they're a navigation tool. A screen reader user can pull up a list of a page's ${g('ariabasics','landmarks')} and jump straight to <code>&lt;nav&gt;</code> or <code>&lt;main&gt;</code>, the same way a sighted visitor's eyes skip straight to the header. A page built entirely out of <code>&lt;div&gt;</code>s offers no such shortcuts — everything reads as one flat, undifferentiated block.</p>
      <p>You'll also see <code>aria-label</code> used on a landmark sometimes, like <code>&lt;nav aria-label="Main"&gt;</code> in the example below — it gives that specific landmark a spoken name, which matters once a page has more than one <code>&lt;nav&gt;</code> (a header nav and a footer nav, say) and a screen reader needs a way to tell them apart.</p>
      <p>${g('altattr','alt text')} deserves the same rethink. It's easy to think of <code>alt</code> as just a fallback for a broken image link, but a screen reader reads it aloud in place of the image every time, broken or not. Write it to describe what the image shows and why it's there — "Golden retriever catching a frisbee," not "dog.jpg" or "image" — and leave it empty (<code>alt=""</code>) only for purely decorative images that carry no information.</p>
      <p>Together, real landmarks and real alt text cost almost nothing extra to write, and they're the difference between a page that's usable with a screen reader and one that isn't.</p>`,
    example:`<nav aria-label="Main">\n  <a href="#home">Home</a>\n  <a href="#shop">Shop</a>\n</nav>\n<main>\n  <img src="retriever.jpg" alt="A golden retriever catching a frisbee mid-air">\n  <img src="divider.png" alt="">\n</main>`}
 ]},
 {id:'html-forms', title:'Forms & User Input', lessons:[
   {id:'frm_1', title:'Forms & Labels', tag:'formbasics',
    concept:`${tldr(`A &lt;form&gt; groups inputs to submit together; pairing a &lt;label&gt;'s for with an &lt;input&gt;'s id makes clicking the label focus the input.`)}
      <p>${g('formtag')} wraps a group of controls meant to be submitted as one unit. Its <code>action</code> attribute says where the data goes when submitted, and <code>method</code> says how — <code>get</code> appends the data to the URL (fine for a search box), <code>post</code> sends it in the request body (better for anything sensitive or lengthy, like a signup form).</p>
      <p>Every input deserves a matching <code>&lt;label&gt;</code>. ${g('labelfor')} connects the two: give the input an <code>id</code>, and set the label's <code>for</code> to that same value. Now clicking the label text focuses the input, and a screen reader announces the label whenever the input gets focus — without that pairing, a visually-obvious label means nothing to assistive tech.</p>
      <p>A form doesn't need a real backend to practice with — <code>action="#"</code> is a fine placeholder while you're just working on the markup.</p>`,
    example:`<form action="/submit" method="post">\n  <label for="email">Email</label>\n  <input type="text" id="email" name="email">\n  <button type="submit">Submit</button>\n</form>`},
   {id:'frm_2', title:'Input Types & Validation', tag:'inputtypes',
    concept:`${tldr(`The type attribute on &lt;input&gt; decides what control renders and what the browser validates for free.`)}
      <p>The same <code>&lt;input&gt;</code> tag renders completely different controls depending on its ${g('inputattr','type')}: <code>type="text"</code> is a plain text box, <code>type="email"</code> validates for an @ and a domain, <code>type="password"</code> masks what's typed, <code>type="checkbox"</code> and <code>type="radio"</code> toggle on/off (radios sharing a <code>name</code> become mutually exclusive), and <code>type="number"</code> restricts input to numeric values and adds up/down steppers.</p>
      <p><code>placeholder</code> shows faint hint text inside an empty input — useful for an example format, but it disappears the moment someone types, so it's never a substitute for a real <code>&lt;label&gt;</code>.</p>
      <p>${g('requiredattr')} is a boolean attribute — just the word <code>required</code>, no value needed — that stops the form from submitting at all until that field has something in it, enforced by the browser with zero JavaScript.</p>
      <p><code>required</code> only checks "is there a value" — ${g('validationattrs','pattern, minlength, and maxlength')} check what that value actually looks like. <code>minlength</code>/<code>maxlength</code> cap how many characters are accepted, and <code>pattern</code> takes a regular expression the value has to match, like <code>pattern="[0-9]{5}"</code> for a 5-digit ZIP code — all still enforced by the browser itself, no JavaScript needed.</p>`,
    example:`<label for="pw">Password</label>\n<input type="password" id="pw" name="pw" placeholder="At least 8 characters" required minlength="8">\n<label for="zip">ZIP Code</label>\n<input type="text" id="zip" name="zip" pattern="[0-9]{5}">`},
   {id:'frm_3', title:'Selects, Textareas & Buttons', tag:'formcontrols',
    concept:`${tldr(`&lt;select&gt;/&lt;option&gt; makes a dropdown, &lt;textarea&gt; is a multi-line text box, and &lt;button&gt; is more flexible than &lt;input type="submit"&gt;.`)}
      <p>Not every control fits an <code>&lt;input&gt;</code>. A <code>&lt;select&gt;</code> wraps a list of <code>&lt;option&gt;</code> elements into a dropdown — give each option a <code>value</code>, and whichever one is chosen becomes the form's submitted value for that field. A <code>&lt;textarea&gt;</code> is a resizable, multi-line text box, sized with <code>rows</code> and <code>cols</code> instead of the single-line <code>&lt;input type="text"&gt;</code>.</p>
      <p>For submitting, <code>&lt;input type="submit"&gt;</code> works, but a plain <code>&lt;button&gt;</code> is usually the better choice: it can hold any markup as its label (not just plain text), and defaults to <code>type="submit"</code> inside a form anyway — just be explicit with <code>type="button"</code> for a button that shouldn't submit anything.</p>
      <p>When several controls belong together — a set of radio buttons, or just a logical section of a longer form — wrap them in ${g('fieldsetlegend','<fieldset>/<legend>')}. <code>&lt;fieldset&gt;</code> draws a group with a visible border by default, and its first child <code>&lt;legend&gt;</code> captions that group, so a screen reader announces "Shipping method" before reading each radio option inside it.</p>`,
    example:`<fieldset>\n  <legend>Shipping method</legend>\n  <label><input type="radio" name="ship" value="standard"> Standard</label>\n  <label><input type="radio" name="ship" value="express"> Express</label>\n</fieldset>\n<label for="topic">Topic</label>\n<select id="topic" name="topic">\n  <option value="general">General</option>\n  <option value="support">Support</option>\n</select>\n<label for="msg">Message</label>\n<textarea id="msg" name="msg" rows="4"></textarea>\n<button type="submit">Send</button>`}
 ]},
 {id:'css-typography', title:'Color, Text & Fonts', lessons:[
   {id:'typo_1', title:'Color & Backgrounds', tag:'colorbg',
    concept:`${tldr(`Colors can be written as a hex code, a keyword, rgb(), or hsl(); the background shorthand packs several background- properties into one declaration.`)}
      <p>CSS accepts several interchangeable ${g('colorvalue','color formats')}: a keyword like <code>orange</code>, a hex code like <code>#ff6600</code>, <code>rgb(255, 102, 0)</code>, or <code>hsl(24, 100%, 50%)</code>. Hex and keywords are the quickest to write; <code>hsl()</code> is often the easiest to *adjust*, since sliding just the lightness value lightens or darkens a color predictably.</p>
      <p><code>background-color</code> sets a flat color, and <code>background-image</code> sets an image (usually with <code>url(...)</code>). Once a background needs more than one of these — color, image, position, repeat, size — the ${g('bgshorthand','background shorthand')} rolls them into a single line, e.g. <code>background: #222 url(hero.jpg) center/cover no-repeat;</code>.</p>`,
    example:`<style>\n  .hero {\n    background: #0b1d33 url("stars.png") center/cover no-repeat;\n    color: hsl(190, 90%, 60%);\n  }\n</style>\n<div class="hero">Welcome</div>`},
   {id:'typo_2', title:'Text & Font Styling', tag:'textfonts',
    concept:`${tldr(`text-align, text-decoration, and text-transform style how text looks; a font-family stack with a generic fallback keeps text from ever rendering in nothing.`)}
      <p>A handful of properties cover most everyday text styling: <code>text-align</code> (left/center/right/justify), <code>text-decoration</code> (underline, line-through, or none — useful for removing a link's default underline), <code>text-transform</code> (uppercase, lowercase, capitalize), and <code>letter-spacing</code>/<code>word-spacing</code> for loosening or tightening how characters and words sit.</p>
      <p>${g('fontstack','font-family')} takes a comma-separated list, tried in order until the browser finds one actually installed: <code>font-family: "Helvetica Neue", Arial, sans-serif;</code> falls back gracefully instead of leaving text in the browser's raw default. End every stack with a generic keyword like <code>sans-serif</code>, <code>serif</code>, or <code>monospace</code> so there's always something to land on.</p>
      <p><code>font-size</code> and <code>font-weight</code> round out the basics, and the <code>font</code> shorthand can combine size, weight, and family in one line, e.g. <code>font: bold 18px/1.4 Arial, sans-serif;</code> — that <code>1.4</code> after the slash is ${g('lineheight','line-height')}, the vertical space each line of text takes up. Written unitless like that, it means "1.4 times this element's own font-size," which is why unitless is usually the right choice: a child with a different font-size still gets a proportional line-height instead of inheriting a fixed pixel value that no longer matches.</p>
      <p>A font stack only helps if the browser already has one of those fonts installed. ${g('fontface','@font-face')} is how you ship a font that isn't: it defines a custom <code>font-family</code> name pointing at an actual font file with <code>src: url(...)</code>, and once defined, that name can be used in <code>font-family</code> anywhere else in the stylesheet exactly like a system font — with the same generic fallback still worth keeping at the end of the stack in case the file fails to load.</p>`,
    example:`<style>\n  @font-face {\n    font-family: "Brand Sans";\n    src: url("brand-sans.woff2") format("woff2");\n  }\n  h1 {\n    font-family: "Brand Sans", "Helvetica Neue", Arial, sans-serif;\n    text-transform: uppercase;\n    letter-spacing: 1px;\n  }\n  p {\n    text-align: justify;\n    font: 16px/1.6 Georgia, serif;\n  }\n</style>\n<h1>Heading</h1>\n<p>Body text styled with the font shorthand.</p>`},
   {id:'typo_3', title:'Link States & List Styling', tag:'linkslists',
    concept:`${tldr(`Style links by state with :link, :visited, :hover, :active — written in that order — and customize bullets with list-style-type.`)}
      <p>${g('linkstates','Link pseudo-classes')} let a link look different depending on what's happening to it: <code>:link</code> (unvisited), <code>:visited</code> (already clicked), <code>:hover</code> (mouse over it), and <code>:active</code> (being clicked right now). Write them in that order — remembered as "LVHA" — because later rules override earlier ones on a tie, and getting the order wrong can silently cancel out the hover or active state.</p>
      <p>Lists get their own styling hook: <code>list-style-type</code> swaps the default bullet or number for something else — <code>disc</code>, <code>circle</code>, <code>square</code> for unordered lists, or <code>decimal</code>, <code>upper-roman</code> for ordered ones — and <code>list-style-type: none;</code> strips markers entirely, common when a <code>&lt;ul&gt;</code> is really being used as a nav bar rather than a visible list.</p>`,
    example:`<style>\n  a:link    { color: steelblue; }\n  a:visited { color: purple; }\n  a:hover   { text-decoration: underline; }\n  a:active  { color: crimson; }\n  ul { list-style-type: square; }\n</style>\n<a href="#">Hover or click me</a>\n<ul>\n  <li>First</li>\n  <li>Second</li>\n</ul>`}
 ]},
 {id:'css-effects', title:'Transitions & Pseudo-Elements', lessons:[
   {id:'fx_1', title:'Transitions', tag:'transitions',
    concept:`${tldr(`transition animates a property smoothly from its old value to its new one instead of jumping instantly — but it needs a state change, like :hover, to actually trigger.`)}
      <p>Without any help, a CSS change is instant: hover a button and its background snaps straight to the new color in one frame. ${g('transitionprop')} smooths that snap into an animation. <code>transition: background 0.2s ease;</code> tells the browser "whenever background changes on this element, animate it over 0.2 seconds instead of jumping."</p>
      <p>That declaration is really four longhands rolled into one, in order: <code>transition-property</code> (which property to animate, or <code>all</code> for every animatable property), <code>transition-duration</code>, <code>transition-timing-function</code> (the same easing curves as <code>animation-timing-function</code> — <code>ease</code>, <code>linear</code>, <code>ease-in-out</code>), and an optional <code>transition-delay</code> before it starts.</p>
      <p>Crucially, <code>transition</code> by itself does nothing — it only plays when the property's value actually changes, which means it needs to be paired with something that changes that value: a <code>:hover</code> rule, a <code>:focus</code> rule, or a class toggled on by JavaScript. This is also why <code>transform</code>, introduced back in the CSS Mastery chapter's hover-card example, animated smoothly there — it had a <code>transition: transform 0.2s ease;</code> declaration sitting quietly on the base rule the whole time.</p>`,
    example:`<style>\n  .btn {\n    background: steelblue;\n    color: white;\n    padding: 10px 20px;\n    transition: background 0.2s ease, transform 0.2s ease;\n  }\n  .btn:hover {\n    background: crimson;\n    transform: translateY(-2px);\n  }\n</style>\n<button class="btn">Hover me</button>`},
   {id:'fx_2', title:'Pseudo-Elements: ::before & ::after', tag:'pseudoelements',
    concept:`${tldr(`::before and ::after insert a virtual extra element inside a tag, but only render once you set a content property — meant for decoration, not real information.`)}
      <p>${g('pseudoelement','::before and ::after')} let a single element get one or two extra "virtual" children, purely through CSS — no extra markup in the HTML. <code>.card::before { }</code> targets a spot just inside the start of <code>.card</code>'s content; <code>::after</code> targets a spot just inside the end.</p>
      <p>The catch: neither one renders at all until you set a <code>content</code> property, even if that value is just an empty string — <code>content: "";</code>. Once content is set, the pseudo-element becomes a normal styleable box: give it a <code>background</code>, size it with <code>width</code>/<code>height</code>, position it with <code>position: absolute;</code> against the real element, whatever the effect calls for.</p>
      <p>Because a screen reader has no way to "see" CSS-generated content the way it reads real HTML, treat <code>::before</code>/<code>::after</code> as strictly decorative — a colored corner ribbon, a small arrow icon next to a link, an underline that grows on hover. Never put content in there that a user actually needs to read; that belongs in real HTML, the same caution already covered for decorative <code>alt=""</code> images.</p>
      <p>A classic use combines this with transitions from the previous lesson: an <code>::after</code> underline that starts at <code>width: 0;</code> and grows to <code>width: 100%;</code> on <code>:hover</code>, animated by a <code>transition</code> on the pseudo-element itself.</p>`,
    example:`<style>\n  .link {\n    position: relative;\n    text-decoration: none;\n    color: inherit;\n  }\n  .link::after {\n    content: "";\n    position: absolute;\n    left: 0;\n    bottom: -2px;\n    width: 0;\n    height: 2px;\n    background: crimson;\n    transition: width 0.2s ease;\n  }\n  .link:hover::after {\n    width: 100%;\n  }\n</style>\n<a class="link" href="#">Hover to underline</a>`},
   {id:'fx_3', title:'Centering, the Modern Way', tag:'centering',
    concept:`${tldr(`display: flex with justify-content: center and align-items: center centers a single child both ways — align-content aligns whole lines when a flex container wraps.`)}
      <p>"How do I center a div?" used to be a running joke — old approaches leaned on <code>margin: 0 auto;</code> (horizontal only, and only if the child had a fixed width) or awkward <code>display: table-cell;</code> hacks just to center something vertically too. None of those are worth learning today.</p>
      <p>${g('flexcentering','Flexbox centering')} solves both axes at once with three lines on the parent: <code>display: flex;</code>, <code>justify-content: center;</code> (centers along the main axis), and <code>align-items: center;</code> (centers along the cross axis). For a single child in a container, that's it — no fixed widths, no margin math, no table hacks.</p>
      <p>While you're centering flex content, it's worth knowing the sibling property to ${g('justifycontent','align-items')}: once <code>flex-wrap: wrap;</code> makes a container's items spill onto more than one line, ${g('aligncontent')} controls how those *lines* sit relative to each other on the cross axis — <code>align-items</code> only affects alignment *within* a line. A single-line container has nothing for <code>align-content</code> to do, which is why it rarely comes up until wrapping enters the picture.</p>`,
    example:`<style>\n  .hero {\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    height: 200px;\n    background: #0B1D33;\n  }\n  .wrap {\n    display: flex;\n    flex-wrap: wrap;\n    align-content: space-between;\n    height: 200px;\n  }\n</style>\n<div class="hero">\n  <h2 style="color:white;">Perfectly centered</h2>\n</div>`}
 ]},
 {id:'css-flexbox', title:'Flexbox Layout', lessons:[
   {id:'flex_1', title:'The Flex Container', tag:'flexcontainer',
    concept:`${tldr(`display: flex lays a container's direct children out in a row (or column) that can wrap, justify, and align in ways block layout can't do alone.`)}
      <p>${g('flexdisplay')} turns an element into a flex container — its direct children (flex items) line up along a single axis instead of stacking block by block. By default that axis is horizontal, but ${g('flexdirection')} can flip it to <code>column</code>, which then flips what "main axis" means for every other flex property.</p>
      <p><code>flex-wrap: wrap;</code> lets items that don't fit on one line drop to a new line instead of overflowing or shrinking forever — flex containers don't wrap by default.</p>
      <p>${g('justifycontent')} handle alignment on the two axes: <code>justify-content</code> (e.g. <code>space-between</code>, <code>center</code>) spaces items along the main axis, and <code>align-items</code> (e.g. <code>center</code>, <code>stretch</code>) aligns them along the cross axis.</p>`,
    example:`<style>\n  .row {\n    display: flex;\n    flex-wrap: wrap;\n    justify-content: space-between;\n    align-items: center;\n    gap: 12px;\n  }\n</style>\n<div class="row">\n  <div>Item 1</div>\n  <div>Item 2</div>\n  <div>Item 3</div>\n</div>`},
   {id:'flex_2', title:'Sizing & Ordering Items', tag:'flexitems',
    concept:`${tldr(`flex-grow, flex-shrink, and flex-basis (usually written as the flex shorthand) control how one item behaves; order and align-self override a single item on its own.`)}
      <p>Flex properties apply to the container; a second set applies to individual items. <code>flex-grow</code> says how eagerly an item grows to fill leftover space (0 by default, so items only grow if told to), <code>flex-shrink</code> says how eagerly it shrinks under pressure, and <code>flex-basis</code> sets its starting size before growing or shrinking kicks in. The ${g('flexshorthand')} sets all three at once: <code>flex: 1 1 200px;</code> means "grow, shrink, start at 200px."</p>
      <p><code>order</code> changes an item's visual position without touching the HTML source order — handy for reflowing on smaller screens. <code>align-self</code> overrides <code>align-items</code> for one specific item, when every other sibling should align one way and this one needs to align differently.</p>`,
    example:`<style>\n  .row { display: flex; gap: 10px; }\n  .sidebar { flex: 0 0 200px; }\n  .content { flex: 1 1 auto; }\n  .featured { order: -1; align-self: flex-start; }\n</style>\n<div class="row">\n  <div class="sidebar">Sidebar</div>\n  <div class="content featured">Content</div>\n</div>`},
   {id:'flex_3', title:'Responsive Flex Patterns', tag:'flexresponsive',
    concept:`${tldr(`Combining flex-wrap (or a media query that switches flex-direction) is the classic pattern for reflowing a row into a column on small screens.`)}
      <p>A very common real-world pattern: a horizontal nav bar that should become a vertical stack once the screen gets too narrow to fit everything comfortably. The simplest version just relies on <code>flex-wrap: wrap;</code> — items that don't fit drop to a new line automatically, no media query required.</p>
      <p>For a more deliberate reflow, pair flexbox with an <code>@media</code> query (covered fully in the responsive-design chapter): set <code>flex-direction: row;</code> as the default, then switch it to <code>column</code> inside a <code>@media (max-width: 600px)</code> block, so the same markup lays out completely differently depending on viewport width.</p>
      <p>Either approach keeps the HTML untouched — the same flat list of nav links reflows purely through CSS, which is the whole point of flexbox over manually calculating widths.</p>`,
    example:`<style>\n  .navbar { display: flex; flex-direction: row; gap: 16px; }\n  @media (max-width: 600px) {\n    .navbar { flex-direction: column; }\n  }\n</style>\n<nav class="navbar">\n  <a href="#">Home</a>\n  <a href="#">About</a>\n  <a href="#">Contact</a>\n</nav>`}
 ]},
 {id:'css-grid', title:'CSS Grid Layout', lessons:[
   {id:'grid_1', title:'The Grid Container', tag:'gridcontainer',
    concept:`${tldr(`display: grid plus grid-template-columns/rows lays children onto a two-dimensional grid; gap spaces the tracks without adding edge margin.`)}
      <p>${g('griddisplay')} turns an element into a grid container, and ${g('gridtemplate')} defines the grid itself — how many columns and rows it has, and how big each one is. <code>grid-template-columns: 200px 1fr 1fr;</code> creates three columns: a fixed 200px column, then two flexible ones that split whatever space is left evenly (the <code>fr</code> unit means "a fraction of remaining space").</p>
      <p>Unlike flexbox's single axis, grid places children on both rows and columns at once — you're designing the whole layout up front, not just a single line of items.</p>
      <p>${g('gridgap')} sets space between the grid's tracks (rows and columns alike, or set separately with <code>row-gap</code>/<code>column-gap</code>) without adding margin to the outer edge items — usually cleaner than margin for even, consistent spacing.</p>`,
    example:`<style>\n  .grid {\n    display: grid;\n    grid-template-columns: 200px 1fr 1fr;\n    gap: 16px;\n  }\n</style>\n<div class="grid">\n  <div>Sidebar</div>\n  <div>Main</div>\n  <div>Extra</div>\n</div>`},
   {id:'grid_2', title:'Placing Grid Items', tag:'griditems',
    concept:`${tldr(`grid-column and grid-row place and span items across tracks; grid-template-areas names regions for a very readable layout.`)}
      <p>By default, grid items fill in one per cell in source order, but you can place one deliberately with <code>grid-column</code> and <code>grid-row</code>. <code>grid-column: 1 / 3;</code> spans an item from grid line 1 to grid line 3 (covering the first two columns); <code>grid-row: span 2;</code> makes an item take up two rows instead of one.</p>
      <p>${g('gridarea')} offers a more visual way to do the same thing: name each region of the grid as an ASCII-art layout right in the container — <code>grid-template-areas: "sidebar main main" "sidebar footer footer";</code> — then assign each child to a name with <code>grid-area: sidebar;</code>. It reads almost like a diagram of the page.</p>`,
    example:`<style>\n  .grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr 1fr;\n    grid-template-areas:\n      "sidebar main main"\n      "sidebar footer footer";\n    gap: 12px;\n  }\n  .sidebar { grid-area: sidebar; }\n  .main    { grid-area: main; }\n  .footer  { grid-area: footer; }\n</style>\n<div class="grid">\n  <div class="sidebar">Sidebar</div>\n  <div class="main">Main</div>\n  <div class="footer">Footer</div>\n</div>`},
   {id:'grid_3', title:'Building a Page Layout', tag:'gridlayout',
    concept:`${tldr(`A "12-column-style" page layout is just grid-template-columns with many equal tracks, and items spanning however many columns they need.`)}
      <p>A common pattern borrowed from print design and older frameworks is a 12-column grid: <code>grid-template-columns: repeat(12, 1fr);</code> creates twelve equal flexible columns (the <code>repeat()</code> function saves writing <code>1fr</code> twelve times). Any item can then span however many columns it needs with <code>grid-column: span 4;</code> for a third-width block, <code>span 6;</code> for a half-width block, and so on.</p>
      <p>This scales well for real pages: a hero banner might span all 12 columns, a three-card row might each span 4, and a sidebar-plus-content split might be <code>span 3</code> and <code>span 9</code>. The math stays simple because every column is an equal fraction of the same total.</p>`,
    example:`<style>\n  .grid {\n    display: grid;\n    grid-template-columns: repeat(12, 1fr);\n    gap: 12px;\n  }\n  .hero    { grid-column: span 12; }\n  .card    { grid-column: span 4; }\n</style>\n<div class="grid">\n  <div class="hero">Hero Banner</div>\n  <div class="card">Card 1</div>\n  <div class="card">Card 2</div>\n  <div class="card">Card 3</div>\n</div>`}
 ]},
 {id:'css-grid-responsive', title:'Responsive Grid Patterns', lessons:[
   {id:'gridr_1', title:'minmax(): A Flexible Column With a Floor', tag:'gridminmax',
    concept:`${tldr(`minmax(min, max) gives a track a floor and a ceiling — 1fr alone can shrink a column past the point its content still looks right.`)}
      <p>A plain <code>1fr</code> column is flexible, but it has no lower limit — squeeze the viewport narrow enough and it keeps shrinking, wrapping text into an unreadably thin sliver or forcing an image to overflow. ${g('minmaxfn')} fixes that by giving a track a *range* instead of one fixed size: <code>minmax(200px, 1fr)</code> means "don't go below 200px, but grow to take up to a full flexible share of whatever's left beyond that."</p>
      <p>It slots directly into <code>grid-template-columns</code> anywhere a size would normally go: <code>grid-template-columns: minmax(150px, 1fr) 2fr;</code> gives the first column a 150px floor while the second stays a plain flexible <code>2fr</code>. Think of it as "flexible, but with a floor" — the column a card grid's sidebar needs, the column body text needs so a paragraph never gets crushed to three characters wide.</p>
      <p>On its own, <code>minmax()</code> still needs a fixed number of columns declared — it doesn't yet solve "how many columns should there even be." That's what the next lesson's <code>auto-fit</code> adds on top.</p>`,
    example:`<style>\n  .grid {\n    display: grid;\n    grid-template-columns: minmax(150px, 1fr) 2fr;\n    gap: 12px;\n  }\n</style>\n<div class="grid">\n  <div class="sidebar">Sidebar</div>\n  <div class="content">Never gets crushed below 150px</div>\n</div>`},
   {id:'gridr_2', title:'auto-fit and Zero Media Queries', tag:'gridautofit',
    concept:`${tldr(`repeat(auto-fit, minmax(200px, 1fr)) lets the grid decide how many columns fit and reflow on its own — no @media breakpoints needed.`)}
      <p>The responsive-design chapter's approach — pick breakpoints, write an <code>@media</code> query for each, manually change <code>grid-template-columns</code> at every one — works, but it's reactive: it only handles the specific widths you thought to test. ${g('autofitfill','repeat(auto-fit, minmax(...))')} takes a different approach entirely: instead of telling the grid a fixed number of columns, you tell it a *minimum* column width and let it figure out the column count itself, at every width, automatically.</p>
      <p><code>grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));</code> reads as "fit as many 200px-or-wider columns as will fit in the row, and stretch them evenly to fill any leftover space; when a column no longer fits, wrap it to a new row." Resize the browser and the column count just changes — three columns, then two, then one — with no breakpoint written anywhere.</p>
      <p><code>auto-fill</code> is the close sibling: it behaves the same while there's content to fill columns with, but keeps reserving empty tracks for columns that *could* exist rather than letting existing items stretch into that space. For a typical card grid where items should grow to fill an incomplete last row, <code>auto-fit</code> is almost always the one you want.</p>`,
    example:`<style>\n  .cards {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));\n    gap: 16px;\n  }\n</style>\n<div class="cards">\n  <div class="card">Card 1</div>\n  <div class="card">Card 2</div>\n  <div class="card">Card 3</div>\n  <div class="card">Card 4</div>\n</div>`}
 ]},
 {id:'css-responsive', title:'Responsive Design', lessons:[
   {id:'resp_1', title:'Media Queries & Mobile-First', tag:'mediaqueries',
    concept:`${tldr(`The viewport meta tag renders mobile pages at true device width; write base styles for small screens first, then add min-width @media queries as the screen grows.`)}
      <p>Without ${g('viewportmeta','the viewport meta tag')}, mobile browsers quietly render the page at a fake desktop-ish width and zoom out to fit it — <code>&lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;</code> in the <code>&lt;head&gt;</code> turns that off, so the page actually renders at the phone's real width. Every responsive page needs this line; nothing else in this chapter works right without it.</p>
      <p>${g('mediaquery')} is the mechanism that then lets CSS respond to that width: <code>@media (min-width: 768px) { ... }</code> only applies its rules once the viewport is at least 768px wide.</p>
      <p>${g('mobilefirst','Mobile-first')} means writing your base, unqualified CSS for the smallest screen, then layering <code>min-width</code> queries on top to add complexity as the screen grows — usually simpler than starting from a desktop layout and fighting it back down with <code>max-width</code> overrides.</p>`,
    example:`<head>\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n</head>\n<style>\n  .card { padding: 12px; }\n  @media (min-width: 768px) {\n    .card { padding: 24px; }\n  }\n</style>`},
   {id:'resp_2', title:'Relative Units', tag:'responsiveunits',
    concept:`${tldr(`%, em, rem, and vw/vh all scale with some context; a fixed px value doesn't, which is why relative units usually win for responsive sizing.`)}
      <p>${g('relativeunit','Relative units')} each scale against something different: <code>%</code> against a parent's size, <code>em</code> against the current element's own <code>font-size</code> (which compounds if nested), <code>rem</code> against the root <code>&lt;html&gt;</code> font-size (predictable, no compounding), and <code>vw</code>/<code>vh</code> against 1% of the viewport's width/height.</p>
      <p>A fixed <code>px</code> value stays exactly the same size no matter what — fine for something like a 1px border, but rigid for text or spacing that should adapt to a user's zoom level or screen size. Most modern CSS leans on <code>rem</code> for font sizes and spacing (so everything scales together if the root size ever changes) and reserves <code>px</code> for details that genuinely shouldn't scale.</p>`,
    example:`<style>\n  html { font-size: 16px; }\n  h1 { font-size: 2rem; }\n  .banner { width: 100%; height: 40vh; padding: 1.5rem; }\n</style>\n<div class="banner"><h1>Hello</h1></div>`},
   {id:'resp_3', title:'Putting It Together', tag:'responsivelayout',
    concept:`${tldr(`Putting it together: a mobile-first layout, in relative units, that reflows at breakpoints using flexbox or grid.`)}
      <p>A real responsive layout combines everything so far. Start with the ${g('viewportmeta','viewport meta tag')} in place. Write the mobile layout first — usually flexbox or grid stacked in a single column, sized in <code>rem</code>/<code>%</code> rather than fixed pixels. Then add ${g('mediaquery','@media')} breakpoints that switch the layout wider: a flex container's <code>flex-direction</code> from <code>column</code> to <code>row</code>, or a grid's <code>grid-template-columns</code> from one column to several.</p>
      <p>This is the same reflow pattern introduced in the flexbox chapter's nav-bar example — the difference here is doing it deliberately, mobile-first, with relative units throughout, rather than relying on wrapping alone.</p>`,
    example:`<style>\n  .layout { display: flex; flex-direction: column; gap: 1rem; }\n  @media (min-width: 768px) {\n    .layout { flex-direction: row; }\n    .sidebar { flex: 0 0 12rem; }\n  }\n</style>\n<div class="layout">\n  <div class="sidebar">Sidebar</div>\n  <div class="content">Content</div>\n</div>`}
 ]}
];

const PROJECTS = {
 'html-basics': {title:'Personal Bio Page', tag:'tags', chapterTitle:'HTML Basics',

/* =========================================================================
   ADAPTIVE PROBLEM GENERATORS  (parameterized -> feels like an infinite bank)
   ========================================================================= */
function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
// weighted so easy/medium come up more often than hard, matching the feel of pickDifficulty()
function pickMachineDiff(){ return pick(['easy','easy','easy','medium','medium','hard']); }
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

const CHAPTER_STRUCTURAL_CHECKS = {
  'html-basics': (code, result)=>{
    const hasStructure = /<!DOCTYPE html>/i.test(code) && /<html/i.test(code) && /<body/i.test(code);
    const hasHeadingAndPara = /<h[1-6][\s>]/i.test(code) && /<p[\s>]/i.test(code);
    const listItemCount = (code.match(/<li[\s>]/gi)||[]).length;
    const hasLink = /<a\s+[^>]*href\s*=/i.test(code);
    return [ hasStructure, hasHeadingAndPara, listItemCount>=2, hasLink && result.success ];
  },
  'css-basics': (code, result)=>{
    const hasStyleBlock = /<style[\s>]/i.test(code);
    const hasClassOrId = /\.[a-zA-Z][\w-]*\s*\{/.test(code) || /#[a-zA-Z][\w-]*\s*\{/.test(code);
    const propNames = new Set([...code.matchAll(/([a-zA-Z-]+)\s*:\s*[^;{}]+;/g)].map(m=>m[1].toLowerCase()));
    const hasBoxModelProp = /\b(margin|padding|border)\b\s*:/.test(code);
    return [ hasStyleBlock, hasClassOrId, propNames.size>=3, hasBoxModelProp && result.success ];
  },
  'html-embed': (code, result)=>{
    const hasSvgShape = /<svg[\s>][\s\S]*?<(circle|rect|path)[\s\/>]/i.test(code);
    const hasIframeSrcAndTitle = /<iframe\b[^>]*\bsrc\s*=\s*["'][^"']+["'][^>]*\btitle\s*=\s*["'][^"']+["']/i.test(code) || /<iframe\b[^>]*\btitle\s*=\s*["'][^"']+["'][^>]*\bsrc\s*=\s*["'][^"']+["']/i.test(code);
    const hasSrcset = /<img\b[^>]*\bsrcset\s*=\s*["'][^,"']+,[^"']+["']/i.test(code);
    const hasViewBox = /<svg\b[^>]*\bviewBox\s*=\s*["'][^"']+["']/i.test(code);
    return [ hasSvgShape, hasIframeSrcAndTitle, hasSrcset, hasViewBox && result.success ];
  },
  'css-mastery': (code, result)=>{
    const hasTransform = /transform\s*:\s*[^;]*\b(translate|rotate|scale)\w*\s*\(/i.test(code);
    const stopMatches = code.match(/(?:^|[\s;{])(\d{1,3}%|from|to)\s*\{/g) || [];
    const hasMultiStepKeyframes = /@keyframes\s+[\w-]+/i.test(code) && stopMatches.length>=3;
    const hasAnimationApplied = /\banimation(-name)?\s*:\s*[^;]+;/i.test(code);
    const hasBEM = /class\s*=\s*["'][^"']*[a-zA-Z][\w-]*__[a-zA-Z][\w-]*(--[a-zA-Z][\w-]*)?[^"']*["']/i.test(code) || /\.[a-zA-Z][\w-]*__[a-zA-Z][\w-]*(--[a-zA-Z][\w-]*)?\s*\{/.test(code);
    return [ hasTransform, hasMultiStepKeyframes, hasAnimationApplied, hasBEM && result.success ];
  },
  'css-layout-flow': (code, result)=>{
    const hasInlineBlock = /display\s*:\s*inline-block\s*;/i.test(code);
    const hasRelative = /position\s*:\s*relative\s*;/i.test(code);
    const hasAbsolute = /position\s*:\s*absolute\s*;/i.test(code);
    const hasFixedOrSticky = /position\s*:\s*(fixed|sticky)\s*;/i.test(code);
    const hasZIndex = /z-index\s*:/i.test(code);
    return [ hasInlineBlock, hasRelative && hasAbsolute, hasFixedOrSticky, hasZIndex && result.success ];
  },
  'html-semantics': (code, result)=>{
    const hasLandmarks = /<header[\s>]/i.test(code) && /<nav[\s>]/i.test(code) && /<main[\s>]/i.test(code) && /<footer[\s>]/i.test(code);
    const hasSectioning = /<article[\s>]/i.test(code) || /<section[\s>]/i.test(code);
    const hasAside = /<aside[\s>]/i.test(code);
    const hasAltText = /<img\b[^>]*\balt\s*=\s*["'][^"']+["']/i.test(code);
    return [ hasLandmarks, hasSectioning, hasAside, hasAltText && result.success ];
  },
  'html-forms': (code, result)=>{
    const hasForm = /<form\b[^>]*\baction\s*=/i.test(code);
    const hasLabelFor = /<label\b[^>]*\bfor\s*=\s*["']([^"']+)["'][^>]*>[\s\S]*?<input\b[^>]*\bid\s*=\s*["']\1["']/i.test(code);
    const hasSelectOrTextarea = /<select[\s>]/i.test(code) || /<textarea[\s>]/i.test(code);
    const hasRequired = /\brequired\b/i.test(code);
    return [ hasForm, hasLabelFor, hasSelectOrTextarea, hasRequired && result.success ];
  },
  'css-typography': (code, result)=>{
    const hasColorFormat = /#[0-9a-fA-F]{3,6}\b/.test(code) || /\b(rgb|hsl)a?\(/i.test(code);
    const hasFontStack = /font-family\s*:\s*[^;]*,[^;]*;/i.test(code);
    const hasLinkHover = /a\s*:\s*hover/i.test(code);
    const hasListStyle = /list-style-type\s*:/i.test(code);
    return [ hasColorFormat, hasFontStack, hasLinkHover, hasListStyle && result.success ];
  },
  'css-effects': (code, result)=>{
    const hasTransition = /transition(-property)?\s*:\s*[^;]+;/i.test(code);
    const hasHoverTrigger = /:hover\s*[^{]*\{[^}]*\}/is.test(code) || /\.[\w-]+--\w[\w-]*\s*\{/.test(code);
    const hasPseudoWithContent = /::(before|after)\s*\{[^}]*content\s*:\s*["'][^"']*["'][^}]*\}/is.test(code);
    const hasFlexCentering = /justify-content\s*:\s*center\s*;/i.test(code) && /align-items\s*:\s*center\s*;/i.test(code) && /display\s*:\s*flex\s*;/i.test(code);
    return [ hasTransition, hasHoverTrigger, hasPseudoWithContent, hasFlexCentering && result.success ];
  },
  'css-grid-responsive': (code, result)=>{
    const hasGridDisplay = /display\s*:\s*grid\s*;/i.test(code);
    const hasMinmax = /minmax\s*\(\s*[^,()]+,\s*[^,()]+\)/i.test(code);
    const hasAutoFitFill = /repeat\s*\(\s*auto-(fit|fill)\s*,/i.test(code);
    const hasNoMediaQuery = !/@media/i.test(code);
    return [ hasGridDisplay, hasMinmax, hasAutoFitFill, hasNoMediaQuery && result.success ];
  },
  'css-flexbox': (code, result)=>{
    const hasFlexContainer = /display\s*:\s*flex\s*;/i.test(code);
    const hasAlignment = /\b(justify-content|align-items)\s*:/i.test(code);
    const hasItemControl = /\bflex\s*:\s*[^;]+;/i.test(code) || /\b(flex-grow|flex-shrink|flex-basis|order|align-self)\s*:/i.test(code);
    const hasMediaReflow = /@media[^{]*\{[\s\S]*flex-direction\s*:/i.test(code);
    return [ hasFlexContainer, hasAlignment, hasItemControl, hasMediaReflow && result.success ];
  },
  'css-grid': (code, result)=>{
    const hasGridDisplay = /display\s*:\s*grid\s*;/i.test(code);
    const hasTemplateColumns = /grid-template-columns\s*:/i.test(code);
    const hasGap = /\b(gap|row-gap|column-gap)\s*:/i.test(code);
    const hasSpanOrArea = /grid-(column|row)\s*:\s*[^;]*\bspan\b/i.test(code) || (/grid-template-areas\s*:/i.test(code) && /grid-area\s*:/i.test(code));
    return [ hasGridDisplay, hasTemplateColumns, hasGap, hasSpanOrArea && result.success ];
  },
  'css-responsive': (code, result)=>{
    const hasViewportMeta = /<meta\b[^>]*name\s*=\s*["']viewport["'][^>]*>/i.test(code);
    const hasMinWidthQuery = /@media\s*\([^)]*min-width[^)]*\)/i.test(code);
    const hasRelativeUnit = /\b\d+(\.\d+)?(rem|em|vw|vh|%)\b/i.test(code);
    const mediaBlockMatch = code.match(/@media\s*\([^)]*min-width[^)]*\)\s*\{([\s\S]*?)\}\s*\}/i);
    const hasReflow = !!mediaBlockMatch && /(flex-direction|grid-template-columns)\s*:/i.test(mediaBlockMatch[1]);
    return [ hasViewportMeta, hasMinWidthQuery, hasRelativeUnit, hasReflow && result.success ];
  }
};

    {type:'mc', tag:'architecture', q:'Why is !important best treated as a last resort?', options:['it overrides normal specificity and is hard to override again later','it only works on id selectors','it slows down page rendering','it is not supported in modern browsers'], answer:0, explain:"!important overrides normal specificity rules, so once it's used, overriding it again later requires another !important or rewriting the original rule — which is why it's a last resort."},
    {type:'enum', tag:'architecture', q:'Name the naming convention written as block__element--modifier.', answers:['bem','BEM'], explain:"BEM (Block, Element, Modifier) is the naming convention written block__element--modifier."},
    {type:'dragdrop', tag:'architecture', q:'Arrange these lines into BEM-style markup for a featured card with a title.', items:['<div class="card card--featured">','  <h3 class="card__title">Featured</h3>','</div>'], explain:"BEM markup nests the element class (card__title) inside the block, with modifier classes (card--featured) added alongside the block's own class."}
