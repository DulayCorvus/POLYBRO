  'css-layout-flow': [
    {type:'mc', tag:'displayvalues', q:"Which display value makes an element start on a new line and fill its container's width?", options:['block','inline','inline-block','none'], answer:0, explain:"block elements start on a new line and stretch to fill their container's width; inline elements do neither."},
    {type:'mc', tag:'displayvalues', q:'Which display value flows an element within surrounding text and ignores width/height?', options:['inline','block','inline-block','flex'], answer:0, explain:"inline elements flow within surrounding text and ignore width/height settings entirely — that's the defining inline-vs-block difference."},
    {type:'enum', tag:'displayvalues', q:'Which display value removes an element completely, taking up no space at all?', answers:['none'], explain:"display: none removes an element from the page entirely, taking up zero space — unlike visibility: hidden, which still reserves the space."},
    {type:'dragdrop', tag:'displayvalues', q:'Arrange these lines into an inline-block box rule.', items:['.box {','  display: inline-block;','  width: 80px;','  height: 40px;','}'], explain:"An inline-block rule sets display: inline-block; and then width/height inside the same declaration block."},
    {type:'mc', tag:'positionrelabs', q:'What is the default position value every element starts with?', options:['static','relative','absolute','fixed'], answer:0, explain:"static is the default position value every element starts with — offset properties like top/left do nothing until you change it."},
    {type:'mc', tag:'positionrelabs', q:'What does position: relative do to the space an element originally occupied?', options:['keeps it reserved, nothing else moves to fill it','removes it from the page entirely','doubles it','centers it automatically'], answer:0, explain:"position: relative shifts an element visually but keeps its original space reserved in the layout, unlike absolute which removes it from flow."},
    {type:'enum', tag:'positionrelabs', q:'An absolutely positioned element is positioned relative to its nearest ancestor with what property set to something other than static?', answers:['position'], explain:"An absolutely positioned element positions itself relative to its nearest ancestor with position set to something other than static — usually position: relative."},
    {type:'dragdrop', tag:'positionrelabs', q:'Arrange these lines into a card with an absolutely positioned badge.', items:['.card { position: relative; }','.badge { position: absolute; top: 8px; right: 8px; }'], explain:"The card gets position: relative to become the positioning context, then the badge is placed with position: absolute and offsets relative to that card."},
    {type:'mc', tag:'positionfixedsticky', q:'Which position value keeps an element glued to the viewport even while the page scrolls?', options:['fixed','relative','static','sticky'], answer:0, explain:"position: fixed pins an element to the viewport itself, so it stays put even as the page scrolls; sticky only behaves that way after a scroll threshold."},
    {type:'mc', tag:'positionfixedsticky', q:'Which position value acts relative until a scroll threshold, then switches to acting fixed?', options:['sticky','fixed','absolute','static'], answer:0, explain:"sticky is the value that acts relative until a scroll point, then switches to fixed-like behavior — that's what separates it from plain fixed."},
    {type:'enum', tag:'positionfixedsticky', q:'Which property decides which positioned element draws on top when two overlap?', answers:['z-index'], explain:"z-index decides which positioned element draws on top when two overlap."},
    {type:'dragdrop', tag:'positionfixedsticky', q:'Arrange these lines into a fixed top bar with a z-index.', items:['.topbar {','  position: fixed;','  top: 0;','  z-index: 10;','}'], explain:"position: fixed pins the bar to the viewport, top: 0 sets it against the top edge, and z-index keeps it above other overlapping content."}
  ],
  'css-effects': [
    {type:'mc', tag:'transitions', q:'What does transition do by itself, with no other rule involved?', options:['nothing — it only plays when the property it covers actually changes','it animates every property on page load','it makes the element flash once','it deletes the element after the duration'], answer:0, explain:"transition only animates a property when its value actually changes — by itself, with nothing changing it, it does nothing at all."},
    {type:'mc', tag:'transitions', q:"Which piece of the transition shorthand controls the easing curve, like ease-in-out vs linear?", options:['transition-timing-function','transition-delay','transition-property','transition-duration'], answer:0, explain:"transition-timing-function is the piece of the shorthand that sets the easing curve; transition-delay only affects when the animation starts."},
    {type:'enum', tag:'transitions', q:'Which pseudo-class most commonly triggers a transition by changing a property value?', answers:['hover',':hover'], explain:":hover is the pseudo-class most commonly used to change a property value and trigger a transition."},
    {type:'dragdrop', tag:'transitions', q:'Arrange these lines into a button with a background transition on hover.', items:['.btn {','  background: steelblue;','  transition: background 0.2s ease;','}','.btn:hover {','  background: crimson;','}'], explain:"The base .btn rule sets the starting background and transition, then the separate :hover rule changes the background — the transition animates between those two states."},
    {type:'mc', tag:'pseudoelements', q:'What property must be set for ::before or ::after to render at all?', options:['content','display','visibility','position'], answer:0, explain:"Neither ::before nor ::after renders at all until a content property is set, even if it's just an empty string."},
    {type:'mc', tag:'pseudoelements', q:'Why should ::before/::after content stay decorative rather than carry real information?', options:['a screen reader has no reliable way to read CSS-generated content','they are not supported in modern browsers','they always render invisible text','they can only hold numbers'], answer:0, explain:"Screen readers have no reliable way to read CSS-generated pseudo-element content, so it should stay decorative rather than carry information a user needs."},
    {type:'enum', tag:'pseudoelements', q:'Which pseudo-element targets a spot just inside the end of an element\'s content?', answers:['after','::after'], explain:"::after targets a spot just inside the end of an element's content; ::before targets the start."},
    {type:'dragdrop', tag:'pseudoelements', q:'Arrange these lines into an ::after underline that renders (has content set).', items:['.link::after {','  content: "";','  width: 0;','  transition: width 0.2s ease;','}'], explain:"The ::after rule needs content set (even empty) before its other properties like width and transition can actually render and animate."},
    {type:'mc', tag:'centering', q:'Which two flex properties together center a single child both horizontally and vertically?', options:['justify-content: center; and align-items: center;','margin: 0 auto; and text-align: center;','display: block; and float: center;','position: center; and top: 50%;'], answer:0, explain:"display: flex plus justify-content: center and align-items: center together center a single child on both axes — the modern fix for what used to be a hard problem."},
    {type:'mc', tag:'centering', q:"What does align-content control that align-items doesn't?", options:["how a flex container's wrapped lines align relative to each other","the color of flex items","the order flex items appear in","whether flex-wrap is enabled"], answer:0, explain:"align-content aligns a flex container's wrapped lines relative to each other; align-items only aligns items within a single line."},
    {type:'enum', tag:'centering', q:'Which display value must a container have before justify-content/align-items centering works?', answers:['flex'], explain:"A container needs display: flex before justify-content/align-items centering has any effect at all."},
    {type:'dragdrop', tag:'centering', q:'Arrange these lines into a container that centers its child both ways.', items:['.hero {','  display: flex;','  justify-content: center;','  align-items: center;','}'], explain:"display: flex must be set first, then justify-content: center and align-items: center center the child on both axes."}
  ],
  'css-grid-responsive': [
    {type:'mc', tag:'gridminmax', q:'What does minmax(200px, 1fr) mean for a grid track?', options:['never shrink below 200px, but grow to fill remaining space beyond that','always exactly 200px wide','never wider than 200px','200px on mobile, 1fr on desktop'], answer:0, explain:"minmax(200px, 1fr) sets a 200px floor and lets the track grow to fill remaining space beyond that — it's a range, not one fixed size."},
    {type:'mc', tag:'gridminmax', q:'What problem does a plain 1fr column have that minmax() fixes?', options:['it can shrink with no lower limit, crushing its content','it never shrinks at all','it only works with two columns','it ignores gap'], answer:0, explain:"A plain 1fr column has no lower limit, so it can shrink past the point its content still looks right; minmax() adds a floor to prevent that."},
    {type:'enum', tag:'gridminmax', q:'Which function takes a minimum and maximum size for a single grid track?', answers:['minmax','minmax()'], explain:"minmax() is the function that takes a minimum and maximum size for a single grid track."},
    {type:'dragdrop', tag:'gridminmax', q:'Arrange these lines into a grid with a flexible sidebar that has a floor.', items:['.grid {','  display: grid;','  grid-template-columns: minmax(150px, 1fr) 2fr;','}'], explain:"grid-template-columns lists minmax(150px, 1fr) for the flexible-with-a-floor sidebar, followed by the plain 2fr second column."},
    {type:'mc', tag:'gridautofit', q:'What does repeat(auto-fit, minmax(200px, 1fr)) let the grid do on its own?', options:['decide how many columns fit at the current width, with no @media needed','automatically add borders to every cell','fix the column count at exactly 3','disable gap entirely'], answer:0, explain:"repeat(auto-fit, minmax(200px, 1fr)) lets the grid figure out how many columns fit at the current width on its own, with zero @media queries."},
    {type:'mc', tag:'gridautofit', q:'For a typical card grid where items should stretch to fill an incomplete last row, which keyword usually fits better than the alternative?', options:['auto-fit','auto-fill','auto-stretch','auto-grow'], answer:0, explain:"auto-fit lets existing items stretch to fill an incomplete last row; auto-fill instead reserves empty tracks for columns that could exist."},
    {type:'enum', tag:'gridautofit', q:'Which CSS function wraps auto-fit/auto-fill so a track pattern doesn\'t need to be typed out by hand?', answers:['repeat','repeat()'], explain:"repeat() is the function that wraps a track pattern like auto-fit/minmax so you don't have to type it out by hand."},
    {type:'dragdrop', tag:'gridautofit', q:'Arrange these lines into a self-sizing card grid with no media query.', items:['.cards {','  display: grid;','  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));','  gap: 16px;','}'], explain:"grid-template-columns uses repeat(auto-fit, minmax(200px, 1fr)) so the grid reflows on its own, with gap set separately in the same rule."},
    {type:'mc', tag:'gridminmax', q:'Inside grid-template-columns, where does minmax() go?', options:['anywhere a track size would normally go, alongside fixed or fr values','only as the very first column','only inside a @media query','it cannot be combined with fr values'], answer:0, explain:"minmax() slots in anywhere a track size would normally go inside grid-template-columns, mixed freely with fixed or fr values."},
    {type:'mc', tag:'gridautofit', q:'Compared to the media-query approach from the responsive-design chapter, what is different about auto-fit?', options:['it reflows automatically at every width instead of only at chosen breakpoints','it only works on mobile devices','it requires JavaScript','it replaces display: grid entirely'], answer:0, explain:"auto-fit reflows automatically at every width, while the media-query approach only reacts at the specific breakpoints you wrote by hand."},
    {type:'enum', tag:'gridminmax', q:'In minmax(150px, 1fr), which value acts as the floor a track cannot shrink below?', answers:['150px','150'], explain:"In minmax(150px, 1fr), 150px is the floor — the track never shrinks below that value."},
    {type:'dragdrop', tag:'gridautofit', q:'Arrange these lines into a gallery grid using auto-fill instead of auto-fit.', items:['.gallery {','  display: grid;','  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));','}'], explain:"auto-fill behaves like auto-fit while filling columns, but keeps reserving empty tracks instead of letting existing items stretch into that space."}
  ],
  'html-semantics': [
    {type:'mc', tag:'landmarks', q:'Which element should wrap the primary navigation links of a site?', options:['<nav>','<aside>','<footer>','<article>'], answer:0, explain:"<nav> is the landmark specifically meant for a site's primary navigation links."},

    {type:'enum', tag:'landmarks', q:'Name the landmark element used for tangential content like a sidebar.', answers:['aside','<aside>'], explain:"<aside> is the landmark used for tangential content like a sidebar."},

    {type:'mc', tag:'sectioning', q:'Which element fits content that could stand alone and be republished elsewhere, like a blog post?', options:['<article>','<section>','<div>','<aside>'], answer:0, explain:"<article> is for content that could stand alone and be republished elsewhere, like a blog post; <section> groups related content without needing to stand alone."},
    {type:'mc', tag:'sectioning', q:"Which element groups related content within a page without necessarily standing alone?", options:['<section>','<article>','<nav>','<header>'], answer:0, explain:"<section> groups related content within a page without necessarily standing alone the way <article> does."},
    {type:'enum', tag:'sectioning', q:'When neither <article> nor <section> carries real meaning, which plain wrapper tag should you use?', answers:['div','<div>'], explain:"When neither <article> nor <section> carries real meaning, a plain <div> is the honest choice — semantic tags shouldn't be forced where they don't apply."},
    {type:'dragdrop', tag:'sectioning', q:'Arrange these lines into a standalone article.', items:['<article>','  <h2>Blog Post</h2>','  <p>Standalone content.</p>','</article>'], explain:"An <article> wraps a heading and its own standalone content, closing after that content."},
    {type:'mc', tag:'a11ybasics', q:'What does alt text actually do for a screen reader user?', options:['it gets read aloud in place of the image','it only shows if the image is broken','it changes the image size','it has no effect on screen readers'], answer:0, explain:"Screen readers read alt text aloud in place of the image itself — it isn't just a fallback shown when the image is broken."},
    {type:'mc', tag:'a11ybasics', q:"What can a screen reader user do with real landmark elements that they can't with an all-div page?", options:['jump directly between named regions of the page',"change the site's colors",'submit forms faster','resize images automatically'], answer:0, explain:"Real landmark elements let screen reader users jump directly between named regions of a page, something an all-<div> page can't offer."},
    {type:'enum', tag:'a11ybasics', q:'What should alt text be set to for a purely decorative image that carries no information?', answers:['alt=""','empty string','""'], explain:"A purely decorative image should get alt=\"\" — an empty string — so screen readers skip announcing it instead of reading a meaningless description."},
    {type:'dragdrop', tag:'a11ybasics', q:'Arrange these lines into an <img> with descriptive alt text.', items:['<img','  src="dog.jpg"','  alt="A golden retriever catching a frisbee">'], explain:"The src loads the image and a descriptive alt describes what's actually in the picture, both on the same <img> tag."}

    {type:'mc', tag:'inputtypes', q:"Which attribute stops a form from submitting until a field has a value?", options:['required','placeholder','disabled','readonly'], answer:0, explain:"required is the boolean attribute that stops a form from submitting until that field has a value, enforced by the browser with no JavaScript needed."},

    {type:'mc', tag:'formcontrols', q:'Which element wraps a list of <option> elements to create a dropdown?', options:['select','textarea','datalist','fieldset'], answer:0, explain:"<select> wraps a list of <option> elements to create a dropdown; the other elements listed serve different purposes."},

/* =========================================================================
   HTML/CSS LIVE-PREVIEW ENGINE
   Unlike the C++ track (which has to fake a compiler), HTML/CSS is real
   markup the browser already knows how to run — so "running" code here
   means parsing it and reading back what actually rendered, not simulating
   execution. `runHtmlCss` returns the same {success, output, error} shape
   the rest of the engine (grading, checklists, etc.) expects, where
   `output` is the page's rendered *visible text* (used for expectedContains
   checks) and callers separately hand the raw code straight to an
   <iframe srcdoc> for the actual live visual preview.
   ========================================================================= */
function runHtmlCss(code){
  if(!code || !code.trim()){
    return {success:false, error:'No code yet — write some HTML to see it render.', output:''};
  }
  try{
    const doc = new DOMParser().parseFromString(code, 'text/html');
    const text = (doc.body ? doc.body.textContent : '').replace(/\s+/g,' ').trim();
    return {success:true, output:text, error:null, doc};
  }catch(e){
    return {success:false, error:String((e&&e.message)||e), output:''};
  }
}

/* =========================================================================
   MASTERY / XP LOGIC
   ========================================================================= */
function getMastery(tag){ return STATE.mastery[tag] || 0; }
function updateMastery(tag, delta){
  const cur = getMastery(tag);
  STATE.mastery[tag] = Math.max(0, Math.min(100, cur + delta));
  saveState();
}
function pickDifficulty(tag){
  const m = getMastery(tag);
  if(m < 35) return 'easy';
  if(m < 70) return 'medium';
  return 'hard';
}
function addXP(n){ STATE.xp += n; saveState(); }
function levelFromXP(xp){ return Math.floor(xp/100)+1; }

function allTags(){
  const tags = [];
  CHAPTERS.forEach(ch=>ch.lessons.forEach(l=>{ if(!tags.includes(l.tag)) tags.push(l.tag); }));
  return tags;
}
function overallMastery(){
  const tags = allTags();
  if(tags.length===0) return 0;
  const sum = tags.reduce((a,t)=>a+getMastery(t), 0);
  return Math.round(sum/tags.length);
}
// average of best-ever quiz scores across chapters that have been attempted at least once;
// null (not 0) when nothing has been attempted yet, so callers can skip the stat cleanly
function avgQuizScore(){
  const entries = Object.entries(STATE.quizBest||{}).filter(([,v])=>v!=null);
  if(!entries.length) return null;
  return Math.round(entries.reduce((a,[,v])=>a+v,0)/entries.length);
}
function masteryLabel(pct){
  if(pct>=90) return 'Mastered';
  if(pct>=70) return 'Advanced';
  if(pct>=35) return 'Building';
  if(pct>0) return 'Started';
  return 'Not started';
}

/* =========================================================================
   DAILY CHALLENGE  (deterministic per-day problem, Wordle-style)
   ========================================================================= */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function dateSeed(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
  return h;
}
function todayKey(){ return new Date().toISOString().slice(0,10); }

function ensureDailyChallenge(){
  const today = todayKey();
  if(STATE.dailyChallenge && STATE.dailyChallenge.date===today) return STATE.dailyChallenge;

  // only draw from topics the learner has actually seen, so day 1 doesn't throw OOP at a beginner
  const introduced = new Set();
  CHAPTERS.forEach(ch=>ch.lessons.forEach(l=>{
    if(STATE.completedLessons.includes(l.id) || STATE.attemptedLessons.includes(l.id)) introduced.add(l.tag);
  }));
  let pool = [...introduced].filter(t=>PROBLEM_GENERATORS[t]);
  if(pool.length===0) pool = ['tags'];

  const seed = dateSeed(today);
  const pickRand = mulberry32(seed);
  const tag = pool[Math.floor(pickRand()*pool.length)] || 'tags';
  const diff = pickDifficulty(tag);

  // swap in a seeded RNG so the generated numbers are identical for everyone all day, then restore
  const origRandom = Math.random;
  Math.random = mulberry32(seed + 7);
  let problem;
  try{
    const gens = PROBLEM_GENERATORS[tag];
    const gen = (gens && gens[diff]) ? gens[diff] : gens.easy;
    problem = gen();
  } finally {
    Math.random = origRandom;
  }

  // streak: did they complete yesterday's challenge? if not, the streak resets
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  const priorCompleted = STATE.dailyChallenge && STATE.dailyChallenge.completed && STATE.dailyChallenge.date===yesterday;
  if(!priorCompleted && STATE.lastDailyDate !== today) { /* streak continuation only counted on completion, see checkProblem */ }

  STATE.dailyChallenge = Object.assign({date:today, tag, diff, completed:false}, problem);
  saveState();
  return STATE.dailyChallenge;
}

function openDailyChallenge(){
  const dc = ensureDailyChallenge();
  CURRENT_PROBLEM = Object.assign({isDaily:true}, dc);
  goTo('daily', 'today');
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// Code-completion for the editors (IntelliJ/Emmet-lite): a dropdown of

  li: '<li>\u00a6</li>',
  button: '<button>\u00a6</button>',
  section: '<section>\u00a6</section>',

  rect: '<rect x="0" y="0" width="\u00a6" height="20" />',
  path: '<path d="\u00a6" />',
  iframe: '<iframe src="\u00a6" title="" width="400" height="300"></iframe>',
  picture: '<picture>\n  <source srcset="\u00a6">\n  <img src="" alt="">\n</picture>',
  keyframes: '@keyframes \u00a6 {\n  0% {  }\n  100% {  }\n}',
  html: '<!DOCTYPE html>\n<html>\n<head>\n  <title>\u00a6</title>\n</head>\n<body>\n\n</body>\n</html>'
};
// Plain-word completions: CSS properties/values and extra tags/attributes
// that don't need a special expansion, just finishing the identifier.
const EDITOR_WORDS = [
  'transform','translate','rotate','scale','transform-origin',
  'animation','animation-name','animation-duration','animation-timing-function',
  'animation-delay','animation-iteration-count','ease-in-out','ease-in','ease-out','linear','infinite',
  'color','background','background-color','font-size','font-weight','font-family',
  'margin','padding','border','border-radius','width','height','display','position',
  'flex','grid','align-items','justify-content','opacity','box-shadow','important',
  'class','id','href','src','alt','title','viewBox','srcset','width','height',
  'html','head','body','title','meta','link','script','table','tr','td','th',
  'form','input','label','textarea','select','option','strong','em','br','hr'
];
function buildEditorSuggestItems(){
  const items = [];
  const seen = new Set();
  Object.keys(EDITOR_SNIPPETS).forEach(k=>{
    items.push({trigger:k, kind:'snippet', detail:'expands to <'+k+'>'});
    seen.add(k);
  });
  EDITOR_WORDS.forEach(w=>{
    if(!seen.has(w)){ items.push({trigger:w, kind:'word', detail:''}); seen.add(w); }
  });
  return items;
}
const EDITOR_SUGGEST_ITEMS = buildEditorSuggestItems();
let ES_STATE = { el:null, matches:[], index:0, wordStart:0 };

function ensureEditorSuggestBox(){
  let box = document.getElementById('editor-suggest');
  if(!box){
    box = document.createElement('div');
    box.id = 'editor-suggest';
    document.body.appendChild(box);
    box.addEventListener('mousedown', (e)=>{
      const item = e.target.closest('.es-item');
      if(!item) return;
      e.preventDefault(); // keep focus in the textarea, don't blur it
      const idx = Number(item.dataset.idx);
      acceptEditorSuggestion(ES_STATE.el, idx);
    });
  }
  return box;
}

function getEditorWordBeforeCaret(el){
  const before = el.value.slice(0, el.selectionStart);
  const m = before.match(/([a-zA-Z][\w-]*)$/);
  return m ? {word:m[1], start:el.selectionStart - m[1].length} : {word:'', start:el.selectionStart};
}

// Positions the dropdown just under the caret using the standard
// mirror-element technique (a hidden div replicating the textarea's font
// metrics, with a marker span dropped in at the caret position).
function positionEditorSuggestBox(el, box, caretPos){
  const mirror = document.createElement('div');
  const cs = getComputedStyle(el);
  ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','padding','border','boxSizing','whiteSpace','wordWrap'].forEach(p=>{
    mirror.style[p] = cs[p];
  });
  mirror.style.position = 'absolute';
  mirror.style.visibility = 'hidden';
  mirror.style.whiteSpace = 'pre-wrap';
  mirror.style.wordWrap = 'break-word';
  mirror.style.width = el.clientWidth + 'px';
  mirror.textContent = el.value.slice(0, caretPos);
  const marker = document.createElement('span');
  marker.textContent = '\u200b';
  mirror.appendChild(marker);
  document.body.appendChild(mirror);
  const rect = el.getBoundingClientRect();
  const markerRect = marker.getBoundingClientRect();
  const mirrorRect = mirror.getBoundingClientRect();
  const top = rect.top + (markerRect.top - mirrorRect.top) - el.scrollTop + 20;
  const left = rect.left + (markerRect.left - mirrorRect.left) - el.scrollLeft;
  document.body.removeChild(mirror);
  const maxLeft = window.innerWidth - 290;
  box.style.top = Math.min(top, window.innerHeight - 60) + 'px';
  box.style.left = Math.max(8, Math.min(left, maxLeft)) + 'px';
}

function renderEditorSuggestBox(){
  const box = ensureEditorSuggestBox();
  box.innerHTML = ES_STATE.matches.map((it,i)=>
    `<div class="es-item ${i===ES_STATE.index?'sel':''}" data-idx="${i}">
       <span class="es-trig">${it.trigger}</span>
       <span class="es-detail">${it.detail}</span>
     </div>`
  ).join('');

function showEditorSuggest(el){
  const {word, start} = getEditorWordBeforeCaret(el);
  if(word.length < 1){ hideEditorSuggest(); return; }
  const lower = word.toLowerCase();
  const matches = EDITOR_SUGGEST_ITEMS
    .filter(it=>it.trigger.toLowerCase().startsWith(lower))
    .sort((a,b)=> a.trigger.length - b.trigger.length)
    .slice(0, 8);
  if(matches.length === 0 || (matches.length===1 && matches[0].trigger.toLowerCase()===lower)){
    hideEditorSuggest();
    return;
  }
  ES_STATE = { el, matches, index:0, wordStart:start };
  const box = ensureEditorSuggestBox();
  renderEditorSuggestBox();
  positionEditorSuggestBox(el, box, el.selectionStart);
  box.classList.add('show');
}

function hideEditorSuggest(){
  const box = document.getElementById('editor-suggest');
  if(box) box.classList.remove('show');
  ES_STATE = { el:null, matches:[], index:0, wordStart:0 };
}

function acceptEditorSuggestion(el, idx){
  const item = ES_STATE.matches[idx];
  if(!el || !item) { hideEditorSuggest(); return; }
  const end = el.selectionStart;
  const wordStart = ES_STATE.wordStart;
  let insertText, cursorOffset;
  if(item.kind === 'snippet'){
    const snippet = EDITOR_SNIPPETS[item.trigger];
    cursorOffset = snippet.indexOf('\u00a6');
    insertText = snippet.replace('\u00a6', '');
  } else {
    insertText = item.trigger;
    cursorOffset = -1;
  }
  el.value = el.value.slice(0, wordStart) + insertText + el.value.slice(end);
  const newPos = wordStart + (cursorOffset === -1 ? insertText.length : cursorOffset);
  el.selectionStart = el.selectionEnd = newPos;
  hideEditorSuggest();
  el.focus();
  el.dispatchEvent(new Event('input', {bubbles:true}));
}

// Called on every keystroke in an editor textarea: refreshes the
// suggestion dropdown to match whatever's now typed before the caret.
function editorOnInput(el){
  showEditorSuggest(el);
}

// Combined keydown handler: when the suggestion dropdown is open, arrow
// keys/Tab/Enter/Escape drive it; otherwise Tab falls back to exact-match
// snippet expansion or plain indentation.
function handleEditorTab(e, el){
  const suggestOpen = ES_STATE.el === el && ES_STATE.matches.length > 0
    && document.getElementById('editor-suggest') && document.getElementById('editor-suggest').classList.contains('show');
  if(suggestOpen){
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      ES_STATE.index = (ES_STATE.index + 1) % ES_STATE.matches.length;
      renderEditorSuggestBox();
      return;
    }
    if(e.key === 'ArrowUp'){
      e.preventDefault();
      ES_STATE.index = (ES_STATE.index - 1 + ES_STATE.matches.length) % ES_STATE.matches.length;
      renderEditorSuggestBox();
      return;
    }
    if(e.key === 'Tab' || e.key === 'Enter'){
      e.preventDefault();
      acceptEditorSuggestion(el, ES_STATE.index);
      return;
    }
    if(e.key === 'Escape'){
      e.preventDefault();
      hideEditorSuggest();
      return;
    }
  }
  if(e.key !== 'Tab') return;
  e.preventDefault();
  const INDENT = '  ';
  const start = el.selectionStart, end = el.selectionEnd;
  if(!e.shiftKey && start === end){
    const before = el.value.slice(0, start);
    const wordMatch = before.match(/([a-zA-Z][\w-]*)$/);
    const snippet = wordMatch ? EDITOR_SNIPPETS[wordMatch[1]] : null;
    if(snippet){
      const wordStart = start - wordMatch[1].length;
      const cursorOffset = snippet.indexOf('\u00a6');
      const expansion = snippet.replace('\u00a6', '');
      el.value = el.value.slice(0, wordStart) + expansion + el.value.slice(end);
      const newPos = wordStart + (cursorOffset === -1 ? expansion.length : cursorOffset);
      el.selectionStart = el.selectionEnd = newPos;
      el.dispatchEvent(new Event('input', {bubbles:true}));
      return;
    }
  }
  if(e.shiftKey){
    const lineStart = el.value.lastIndexOf('\n', start-1) + 1;
    if(el.value.slice(lineStart, lineStart+INDENT.length) === INDENT){
      el.value = el.value.slice(0,lineStart) + el.value.slice(lineStart+INDENT.length);
      el.selectionStart = Math.max(lineStart, start-INDENT.length);
      el.selectionEnd = Math.max(lineStart, end-INDENT.length);
    }
  } else if(start === end){
    el.value = el.value.slice(0,start) + INDENT + el.value.slice(end);
    el.selectionStart = el.selectionEnd = start + INDENT.length;
  } else {
    el.value = el.value.slice(0,start) + INDENT + el.value.slice(start,end) + el.value.slice(end);
    el.selectionStart = start + INDENT.length;
    el.selectionEnd = end + INDENT.length;
  }
  el.dispatchEvent(new Event('input', {bubbles:true}));
}


function highlightCode(code){
  // Single-pass tokenizer (same safe approach as before: match against the
  // ORIGINAL source text in one pass so an inserted <span> from an earlier
  // match can never get re-matched by a later one). Tuned for HTML/CSS
  // instead of C++: highlights HTML/CSS comments, quoted attribute/property
  // values, and tag names (<div, </div, <style, etc).
  const pattern = /(<!--[\s\S]*?-->)|(\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(<\/?[a-zA-Z][\w-]*)/g;
  let out = '';
  let lastIndex = 0;
  let m;
  while((m = pattern.exec(code))){
    out += escapeHtml(code.slice(lastIndex, m.index));
    if(m[1] !== undefined) out += `<span class="com">${escapeHtml(m[1])}</span>`;
    else if(m[2] !== undefined) out += `<span class="com">${escapeHtml(m[2])}</span>`;
    else if(m[3] !== undefined) out += `<span class="str">${escapeHtml(m[3])}</span>`;
    else if(m[4] !== undefined) out += `<span class="kw">${escapeHtml(m[4])}</span>`;
    lastIndex = pattern.lastIndex;
  }
  out += escapeHtml(code.slice(lastIndex));
  return out;
}

/* Blueprint memory diagram */
function renderDiagram(vars){
  const entries = Object.entries(vars||{}).filter(([k,v])=> typeof v !== 'function' && !k.startsWith('__'));
  if(entries.length===0){
    return `<div class="diagram-wrap"><svg viewBox="0 0 400 60"><text x="10" y="34" fill="#5a7086" font-family="IBM Plex Mono" font-size="12">no variables captured yet — click Run</text></svg></div>`;
  }
  const boxW = 116, boxH = 54, gap = 14, perRow = 3;
  const rows = Math.ceil(entries.length/perRow);
  const svgH = rows*(boxH+gap)+20;
  let items = '';
  entries.forEach(([name,val],i)=>{
    const col = i % perRow, row = Math.floor(i/perRow);
    const x = 16 + col*(boxW+gap), y = 16 + row*(boxH+gap);
    let display = Array.isArray(val) ? '['+val.slice(0,4).join(',')+(val.length>4?',…':'')+']' : (typeof val==='object' && val!==null) ? '{object}' : String(val);
    if(display.length>16) display = display.slice(0,14)+'…';
    items += `
      <g>
        <rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="4" fill="none" stroke="#4FD1E8" stroke-width="1.2" stroke-dasharray="3,2"/>
        <line x1="${x}" y1="${y+20}" x2="${x+boxW}" y2="${y+20}" stroke="#1D3A54" stroke-width="1"/>
        <text x="${x+8}" y="${y+14}" fill="#4FD1E8" font-family="JetBrains Mono" font-size="10" font-weight="700">${escapeHtml(name)}</text>
        <text x="${x+8}" y="${y+38}" fill="#EDEFF2" font-family="IBM Plex Mono" font-size="12">${escapeHtml(display)}</text>
      </g>`;
  });
  return `<div class="diagram-wrap"><svg viewBox="0 0 400 ${svgH}" xmlns="http://www.w3.org/2000/svg">${items}</svg></div>`;
}

function buildDashCards(){
  const cards = [];
  CHAPTERS.forEach(ch=>{
    const prog = chapterProgress(ch);
    const pct = prog.total ? Math.round(prog.done/prog.total*100) : 0;
    const started = prog.done>0 || ch.lessons.some(l=>STATE.attemptedLessons.includes(l.id));
    cards.push({
      kind:'chapter', id:ch.id, title:ch.title,
      blurb: ch.lessons.map(l=>l.title).slice(0,3).join(' · '),
      badges: prog.done===prog.total ? ['done'] : (started?['started']:[]),
      meta: `${ch.lessons.length} lessons`,
      pct, started, done: prog.done===prog.total,
      recentKey: ch.lessons.map(l=>l.id)
    });
  });
  Object.keys(PROJECTS).forEach(pid=>{
    const proj = PROJECTS[pid];
    const done = STATE.completedProjects.includes(pid);
    const started = done || PROJECT_CODE_CACHE[pid] !== undefined;
    cards.push({
      kind:'project', id:pid, title:'Project: '+proj.title,
      blurb: proj.brief,
      badges: ['proj', ...(done?['done']:started?['started']:[])],
      meta: proj.chapterTitle,
      pct: done?100:(started?40:0), started, done,
      recentKey:[pid]
    });
  });
  CHAPTERS.forEach(ch=>{
    const best = STATE.quizBest && STATE.quizBest[ch.id]!=null ? STATE.quizBest[ch.id] : null;
    const done = best===100;
    const started = best!=null && !done;
    cards.push({
      kind:'quiz', id:ch.id, title:'🧠 Quiz: '+ch.title,
      blurb: best!=null ? `Best score so far: ${best}%. Retake any time to try for a better one.` : `Test yourself on ${ch.title} — mix of multiple choice, enumeration, and drag-and-drop.`,
      badges: ['quiz', ...(done?['done']:started?['started']:[])],
      meta: ch.title,
      pct: best!=null?best:0, started, done,
      recentKey: []
    });
  });
  return cards;
}

function runLessonExample(id){
  const found = lessonById(id);
  const code = found.lesson.example;
  const result = runHtmlCss(code, []);
  LESSON_LAST_RUN[id] = {code, vars: tryCollectVars(code)};
  applyLessonRun(id);
}
// pushes the stored last-run (live preview + tag-tally diagram) for a lesson into its DOM,
// without a full render() — keeps this consistent with how the problem/project/machine
// views update their <iframe> preview in place after Run.
function applyLessonRun(id){
  const lastRun = LESSON_LAST_RUN[id];
  const consoleEl = document.getElementById('lesson-console-'+id);
  const diagramEl = document.getElementById('lesson-diagram-'+id);
  if(!lastRun || !consoleEl || !diagramEl) return;
  livePreview(consoleEl, lastRun.code);
  diagramEl.innerHTML = renderDiagram(lastRun.vars);
}
// crude var collector: run transpiled code but capture locals via Function + explicit return object
// repurposed for this track: instead of capturing C++ variable values, tally which
// HTML elements the code actually contains so renderDiagram (unchanged, generic over
// any name->value object) can draw an "elements used" box diagram instead.
function tryCollectVars(code){
  try{
    const doc = new DOMParser().parseFromString(code, 'text/html');
    const els = doc.body ? doc.body.querySelectorAll('*') : [];
    const tally = {};
    els.forEach(el=>{ const t = el.tagName.toLowerCase(); tally[t] = (tally[t]||0)+1; });
    return tally;
  }catch(e){ return {}; }
}

function startChallenge(lessonId){
  const found = lessonById(lessonId);
  const tag = found.lesson.tag;
  const diff = pickDifficulty(tag);
  const gen = PROBLEM_GENERATORS[tag];
  const problem = gen ? gen[diff]() : null;
  if(!problem){ return; }
  CURRENT_PROBLEM = Object.assign({tag, diff, lessonId}, problem);
  STATE.hintIndex[lessonId+'_problem'] = 0;
  goTo('problem', lessonId+'_problem');
}

function markLessonComplete(id){
  // "mark complete" used to award XP with zero verification, letting someone rack up
  // XP/mastery-adjacent credit for every lesson without ever running the challenge.
  // Now it requires having attempted the lesson's challenge at least once, and pays out
  // less XP than actually passing one (10 vs the 20-30 checkProblem() awards).
  if(!STATE.attemptedLessons.includes(id)){
    const fbEl = document.getElementById('lesson-complete-note');
    if(fbEl) fbEl.textContent = 'Try the challenge for this lesson at least once before marking it complete.';
    return;
  }
  if(!STATE.completedLessons.includes(id)){
    STATE.completedLessons.push(id);
    addXP(10);
  }
  saveState();
  render();
}

// Plain substring matching lets numeric answers false-positive: a challenge expecting "15"
// would accept a buggy "115" or "1500" because "115".includes("15") is true. For expected
// values that are pure numbers, require them to appear as a standalone token (not embedded
// inside a longer digit run) rather than anywhere in the output. Non-numeric expected values
// (phrases like "Rex says woof", "even", "yes") keep plain substring matching, since prompts
// often have surrounding text/formatting that a full-output match would wrongly reject.
function outputMatches(output, expected){
  if(/^-?\d+(\.\d+)?$/.test(expected)){
    const escaped = expected.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`(?<![\\d.-])${escaped}(?![\\d.])`);
    return re.test(output);
  }
  return output.includes(expected);
}
function gradeProblem(code, p){
  const result = runHtmlCss(code, []);
  const runOk = result.success;
  let pass = false, msg = '';
  if(p.structural && p.structural.length){
    const missing = p.structural.filter(kw => !code.includes(kw));
    const executionRequired = p.expectedContains && p.expectedContains.length > 0;
    if(missing.length===0 && (!executionRequired || (runOk && p.expectedContains.every(e=>outputMatches(result.output,e))))){
      pass = true; msg = 'Structure and output both look right. Nice.';
    } else if(missing.length){
      msg = `Missing expected structure: ${missing.join(', ')}`;
    } else if(executionRequired && !runOk){
      msg = `Runs with an error: ${result.error}`;
    } else if(executionRequired){
      msg = `Runs, but the output doesn't match yet. Got: "${result.output}"`;
    } else {
      msg = `Runtime error (not required to pass, but worth checking): ${result.error}`;
    }
  } else {
    if(!runOk){ msg = `Runtime error: ${result.error}`; }
    else if(p.expectedContains.every(e=>outputMatches(result.output,e))){ pass = true; msg = 'Correct! Output matches.'; }
    else { msg = `Not quite — expected output to include "${p.expectedContains.join('", "')}". Got: "${result.output}"`; }
  }
  return {pass, msg, runOk, result};
}

function checkProblem(){
  const code = getProblemCode();
  const p = CURRENT_PROBLEM;
  const fbEl = document.getElementById('prob-feedback');
  const {pass, msg, runOk, result} = gradeProblem(code, p);

  const consoleEl = document.getElementById('prob-console');
  consoleEl.className = 'console htmlpreview'+(runOk?'':' err');
  livePreview(consoleEl, code);
  document.getElementById('prob-diagram').innerHTML = renderDiagram(tryCollectVars(code));

  fbEl.innerHTML = `<div class="feedback ${pass?'pass':'fail'}">${pass?'✓ ':'✗ '}${msg}</div>`;
  if(pass){
    updateMastery(p.tag, p.diff==='hard'?18:p.diff==='medium'?15:12);
    addXP(p.diff==='hard'?30:p.diff==='medium'?20:10);
    if(p.isDaily){
      if(!STATE.dailyChallenge.completed){
        STATE.dailyChallenge.completed = true;
        const today = todayKey();
        const y = new Date(); y.setDate(y.getDate()-1);
        const yesterday = y.toISOString().slice(0,10);
        STATE.dailyStreak = (STATE.lastDailyDate === yesterday) ? STATE.dailyStreak + 1 : 1;
        STATE.lastDailyDate = today;
        addXP(25); // daily bonus on top of the normal reward above
      }
    } else {
      if(!STATE.completedLessons.includes(p.lessonId)) STATE.completedLessons.push(p.lessonId);
      if(!STATE.attemptedLessons.includes(p.lessonId)) STATE.attemptedLessons.push(p.lessonId);
    }
    saveState();
    refreshChrome();
  } else {
    if(!p.isDaily){
      updateMastery(p.tag, -4);
      if(!STATE.attemptedLessons.includes(p.lessonId)) { STATE.attemptedLessons.push(p.lessonId); saveState(); }
    }
  }
}

/* ---------------- Quiz (multiple choice / enumeration / drag-and-drop) ---------------- */
function buildQuizState(chapterId){
  const bank = QUIZZES[chapterId] || [];
  const chosen = shuffleArr(bank).slice(0, Math.min(6, bank.length));
  const questions = chosen.map(q=>{
    if(q.type==='dragdrop'){
      const pool = shuffleArr(q.items.map((text,i)=>({origIndex:i, text})));
      return Object.assign({}, q, {slots:new Array(q.items.length).fill(null), pool});
    }
    if(q.type==='mc') return Object.assign({}, q, {selected:null});
    if(q.type==='enum') return Object.assign({}, q, {answer:''});
    return Object.assign({}, q);
  });
  return {chapterId, questions, submitted:false, score:0};
}
function ensureQuiz(chapterId){
  if(!QUIZ_STATE || QUIZ_STATE.chapterId !== chapterId){
    QUIZ_STATE = buildQuizState(chapterId);
  }
}
function startQuiz(chapterId){
  ensureQuiz(chapterId);
  goTo('quiz', chapterId);
}
function restartQuiz(){
  if(!QUIZ_STATE) return;
  QUIZ_STATE = buildQuizState(QUIZ_STATE.chapterId);
  rerenderMain();
}
function selectMcOption(qIndex, optIndex){
  if(!QUIZ_STATE || QUIZ_STATE.submitted) return;
  QUIZ_STATE.questions[qIndex].selected = optIndex;
  rerenderMain();
}
function setEnumAnswer(qIndex, val){
  if(!QUIZ_STATE || QUIZ_STATE.submitted) return;
  QUIZ_STATE.questions[qIndex].answer = val;
}
function placeDragItem(qIndex, origIndex){
  if(!QUIZ_STATE || QUIZ_STATE.submitted) return;
  const q = QUIZ_STATE.questions[qIndex];
  const slotIdx = q.slots.findIndex(s=>s===null);
  if(slotIdx===-1) return;
  q.slots[slotIdx] = origIndex;
  q.pool = q.pool.filter(p=>p.origIndex!==origIndex);
  rerenderMain();
}
function removeDragItem(qIndex, slotIdx){
  if(!QUIZ_STATE || QUIZ_STATE.submitted) return;
  const q = QUIZ_STATE.questions[qIndex];
  const origIndex = q.slots[slotIdx];
  if(origIndex==null) return;
  q.slots[slotIdx] = null;
  q.pool.push({origIndex, text:q.items[origIndex]});
  rerenderMain();
}
function submitQuiz(){
  if(!QUIZ_STATE || QUIZ_STATE.submitted) return;
  const norm = s => String(s||'').trim().toLowerCase();
  QUIZ_STATE.questions.forEach(q=>{
    let correct = false;
    if(q.type==='mc'){
      correct = q.selected === q.answer;
      q.partialScore = correct ? 1 : 0;
    } else if(q.type==='enum'){
      if(q.multi){
        const parts = norm(q.answer).split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean);
        correct = q.answers.every(a=>parts.includes(norm(a)));
      } else {
        correct = q.answers.some(a=>norm(a)===norm(q.answer));
      }
      q.partialScore = correct ? 1 : 0;
    } else if(q.type==='dragdrop'){
      // fractional credit: how many slots landed in their correct position, out of the total
      const totalSlots = q.items.length;
      const correctSlots = q.slots.filter((v,i)=>v===i).length;
      q.partialScore = totalSlots ? correctSlots/totalSlots : 0;
      correct = q.partialScore === 1;
    }
    q.correct = correct;
  });
  QUIZ_STATE.score = QUIZ_STATE.questions.reduce((sum,q)=>sum+(q.partialScore||0), 0);
  QUIZ_STATE.submitted = true;
  const total = QUIZ_STATE.questions.length;
  QUIZ_STATE.questions.forEach(q=>{ updateMastery(q.tag, q.correct ? 8 : -2); });
  addXP(Math.round(QUIZ_STATE.score*5) + (QUIZ_STATE.score===total ? 15 : 0));
  if(!STATE.quizBest) STATE.quizBest = {};
  const pct = Math.round((QUIZ_STATE.score/total)*100);
  STATE.quizBest[QUIZ_STATE.chapterId] = Math.max(STATE.quizBest[QUIZ_STATE.chapterId]||0, pct);
  saveState();
  rerenderMain();
  refreshChrome();
}
function renderQuizQuestion(q, i){
  const stateClass = QUIZ_STATE.submitted ? (q.correct?'correct':'wrong') : '';
  const typeLabel = q.type==='mc' ? 'multiple choice' : q.type==='enum' ? 'enumeration' : 'drag &amp; drop';
  let body = '';
  if(q.type==='mc'){
    body = `<div class="qopts">${q.options.map((opt,oi)=>{
      let cls = 'qopt';
      if(QUIZ_STATE.submitted){
        if(oi===q.answer) cls += ' correct';
        else if(oi===q.selected) cls += ' wrong';
      } else if(oi===q.selected){ cls += ' selected'; }
      return `<button class="${cls}" ${QUIZ_STATE.submitted?'disabled':''} onclick="selectMcOption(${i},${oi})">${escapeHtml(opt)}</button>`;
    }).join('')}</div>`;
  } else if(q.type==='enum'){
    body = `<input type="text" class="qinput" ${QUIZ_STATE.submitted?'disabled':''} placeholder="${q.multi?'comma-separated answers':'type your answer'}" value="${escapeHtml(q.answer)}" oninput="setEnumAnswer(${i},this.value)">
      ${QUIZ_STATE.submitted?`<div class="qanswerkey">Accepted: ${q.answers.map(escapeHtml).join(', ')}</div>`:''}`;
  } else if(q.type==='dragdrop'){
    const slots = q.slots.map((origIndex,si)=>{
      let cls = 'dragslot' + (origIndex!=null?' filled':'');
      if(QUIZ_STATE.submitted && origIndex!=null){ cls += (origIndex===si?' ok':' bad'); }
      const label = origIndex!=null ? escapeHtml(q.items[origIndex]) : 'tap a piece below to place it here';
      return `<div class="${cls}" onclick="removeDragItem(${i},${si})"><span class="n">${si+1}</span>${label}</div>`;
    }).join('');
    const pool = q.pool.map(p=>`<button class="dragchip" onclick="placeDragItem(${i},${p.origIndex})">${escapeHtml(p.text)}</button>`).join('');
    body = `<div class="dragslots">${slots}</div>${!QUIZ_STATE.submitted?`<div class="dragpool">${pool}</div>`:(q.correct?'':`<div class="qanswerkey">Correct order: ${q.items.map(escapeHtml).join(' → ')}</div>`)}`;
  }
  return `
    <div class="qcard ${stateClass}">
      <div class="qhead">
        <span class="qnum">Q${i+1} · ${typeLabel}</span>
        ${QUIZ_STATE.submitted?(q.correct?'<span class="badge" style="border-color:var(--green);color:var(--green)">✓ correct</span>':'<span class="badge" style="border-color:var(--red);color:var(--red)">✗ missed</span>'):''}
      </div>
      <p class="qtext">${q.q}</p>
      ${body}
      ${QUIZ_STATE.submitted && !q.correct && q.explain ? `<div class="qexplain"><b>Why:</b> ${escapeHtml(q.explain)}</div>` : ''}
    </div>`;
}
function renderQuizView(chapterId){
  ensureQuiz(chapterId);
  const ch = CHAPTERS.find(c=>c.id===chapterId);
  if(!ch) return '<p>Chapter not found.</p>';
  const best = STATE.quizBest && STATE.quizBest[chapterId]!=null ? STATE.quizBest[chapterId] : null;
  const questionsHtml = QUIZ_STATE.questions.map((q,i)=>renderQuizQuestion(q,i)).join('');
  const total = QUIZ_STATE.questions.length;
  const scoreDisplay = Number.isInteger(QUIZ_STATE.score) ? QUIZ_STATE.score : QUIZ_STATE.score.toFixed(1);
  return `
    <div class="crumbs">${ch.title} <span class="cyan">/</span> Quiz</div>
    <h2 class="title">🧠 Quiz: ${ch.title}</h2>
    <span class="badge quiz">${total} questions</span>
    ${best!=null?`<span class="badge" style="border-color:var(--cyan-dim);color:var(--cyan)">best ${best}%</span>`:''}
    <div class="prose" style="margin:14px 0;">Mix of multiple choice, enumeration, and drag-and-drop pulled from this chapter's lessons. Drag-and-drop questions award partial credit for slots placed correctly. Answer everything, then submit to see your score.</div>
    ${questionsHtml}
    <div class="qsubmitrow">
      ${QUIZ_STATE.submitted
        ? `<span class="quizscore">Score: ${scoreDisplay} / ${total}</span><button class="btn ghost" onclick="restartQuiz()">↺ Retake quiz</button>`
        : `<button class="btn primary" onclick="submitQuiz()">✓ Submit quiz</button>`}
    </div>
  `;
}
